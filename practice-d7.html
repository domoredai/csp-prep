<script>
CSPQuiz.init({
  quizId: 'practice-d7',
  quizTitle: 'D7 培训 强化训练 / Domain 7 Boost',
  quizTopic: 'Domain 7 — Training',
  containerId: 'quiz-root',
  questions: [{"text":"A behavior-based training program costs $80,000 to develop and deliver. After the training effect is isolated, the program is credited with $200,000 in reduced injury and downtime costs. What is the Phillips ROI?","group":1,"options":["40%","150%","250%","60%"],"correct":1,"explanation":"ROI = [(Benefit − Cost) ÷ Cost] × 100 = [(200,000 − 80,000) ÷ 80,000] × 100 = (120,000 ÷ 80,000) × 100 = 150%. An ROI of 100% is breakeven; 150% means $1.50 of net benefit per dollar invested. The 250% option comes from dividing the benefit by the cost (a benefit-cost ratio of 2.5) instead of using the net benefit.\n\nROI = [(收益 − 成本) ÷ 成本] × 100 = [(200,000 − 80,000) ÷ 80,000] × 100 = (120,000 ÷ 80,000) × 100 = 150%。ROI 为 100% 即收支平衡；150% 表示每投入 1 美元获得 1.50 美元净收益。250% 是把收益直接除以成本（收益成本比 2.5）而非使用净收益造成的。","related":[{"n":"20.6","t":"菲利普斯ROI"}],"level":"calculation","topic":"Phillips ROI Calculation"},{"text":"A near miss occurs on a packaging line. The supervisor asks for a full refresher course for all 42 operators. Training records show that 3 operators transferred in last month and never received the line-specific training. What is the BEST action?","group":1,"options":["Deliver the refresher to all 42 operators to be safe","Train the 3 untrained operators and verify the others by observation","Take no action, because a near miss is not an injury","Repeat the training annually for everyone regardless of findings"],"correct":1,"explanation":"A person-level needs analysis identifies who actually has the gap. The records show that only three operators lack the required training, so targeted training closes the real gap and avoids the cost and credibility loss of blanket retraining. Observation then confirms whether the other 39 perform correctly; if they do not, the cause may be the procedure, tools, or supervision rather than knowledge. Blanket refreshers are a common but unsupported reaction to a single event.\n\n人员层面的需求分析确定真正存在差距的人。记录显示只有 3 名操作员缺少该岗位培训，因此针对性培训能弥补真实差距，避免全员复训的成本与信任损失。随后通过观察确认其余 39 人是否操作正确；若不正确，原因可能是程序、工具或监督而非知识不足。用全员复训应对单起事件很常见，但缺乏依据。","related":[{"n":"19.1","t":"培训需求评估"}],"level":"application","topic":"Person-Level Needs Analysis"},{"text":"Operators skip the pre-use inspection of powered pallet jacks. Investigation finds the inspection forms are kept in a locked office and shifts are staffed so tightly that a proper inspection would make the pick rate unattainable. Training is currently the proposed fix. What should the safety professional recommend?","group":1,"options":["Deliver inspection training and add a knowledge test","Increase disciplinary action for skipped inspections","Add a refresher toolbox talk each quarter","Fix the system first: put forms at the point of use and adjust staffing"],"correct":3,"explanation":"When a performance gap is caused by missing forms or by production pressure that makes the required behavior impossible, training cannot fix it; the system must change first. A training needs assessment exists precisely to separate knowledge and skill gaps from organizational barriers. Discipline and repeated awareness training treat the symptom and typically increase under-reporting.\n\n当绩效差距源于表单缺失或生产压力使要求的行为无法完成时，培训无法解决，必须先改变系统。培训需求评估的意义正是把知识与技能差距同组织障碍区分开。纪律处罚和反复的意识培训只是治标，通常还会导致漏报增加。","related":[{"n":"19.1","t":"培训需求评估"}],"level":"application","topic":"Performance Gap Not Training"},{"text":"A course has been delivered to 200 employees. Smile sheets average 4.7/5, but no post-test, no on-the-job observation, and no revision have occurred. Which ADDIE phase is incomplete?","group":1,"options":["Evaluation","Analysis","Design","Development"],"correct":0,"explanation":"The Evaluation phase measures whether the objectives were met, using Kirkpatrick Levels 1–4, and feeds the findings back for improvement. Collecting only reaction data leaves Levels 2–4 untouched, so the program's effectiveness is unknown. Analysis, Design, and Development all occurred before delivery (needs assessment, objectives, materials and pilot), so the missing phase is Evaluation.\n\n评估（Evaluation）阶段用柯氏 1–4 级衡量目标是否达成，并把结果反馈用于改进。只收集反应数据，2–4 级完全缺失，项目有效性无从判断。分析、设计、开发都在交付前完成（需求评估、目标、材料与试讲），因此缺失的是评估阶段。","related":[{"n":"19.3","t":"ADDIE模型"}],"level":"application","topic":"ADDIE Evaluation Phase"},{"text":"Course materials have been finalized and pilot-tested. The training manager is now booking rooms, scheduling shifts around production, enrolling learners in the LMS, and arranging equipment for the practical exercise. Which ADDIE phase is this?","group":1,"options":["Analysis: needs assessment and context","Design: objectives and assessment plan","Implementation: scheduling and records","Evaluation: measuring results and impact"],"correct":2,"explanation":"Implementation covers scheduling sessions, arranging logistics (venue, equipment, materials), delivering the training, and managing attendance and records. Finalizing and pilot-testing materials belonged to Development; writing objectives and planning assessment belonged to Design. Evaluation comes after delivery and measures effectiveness.\n\n实施（Implementation）包括安排课程、协调后勤（场地、设备、材料）、交付培训以及管理出勤与记录。材料定稿与试讲属于开发阶段；编写目标和规划评估属于设计阶段。评估在交付之后进行，用于衡量效果。","related":[{"n":"19.3","t":"ADDIE模型"}],"level":"application","topic":"ADDIE Implementation Phase"},{"text":"An objective reads: 'Given three exposure limits for the same substance, the trainee will differentiate among the PEL, TLV, and REL and explain the basis of each.' At which Bloom level is the verb 'differentiate'?","group":1,"options":["Analyze","Understand","Apply","Evaluate"],"correct":0,"explanation":"Analyze is the level at which learners break information into parts and examine relationships and distinctions — differentiating, comparing, and categorizing. Understand would only require explaining or summarizing; Apply would require using the limits in a calculation or decision; Evaluate would require judging against criteria and justifying a choice. 'Differentiate' is a signature Analyze verb.\n\n分析（Analyze）是学习者把信息分解为部分并考察关系与区别的层次——区分、比较、归类。理解只需解释或总结；应用要求在计算或决策中使用这些限值；评价要求依据标准判断并为选择辩护。“区分”是分析层次的标志性动词。","related":[{"n":"19.5","t":"布鲁姆分类学"}],"level":"application","topic":"Bloom Analyze Level"},{"text":"Halfway through a two-day course, the trainer notices that learners cannot interpret a permit form. She adds a worked example and a short practice exercise before moving to the next module. This is an example of:","group":1,"options":["Summative evaluation","Formative evaluation","Kirkpatrick Level 4 evaluation","Phillips ROI analysis"],"correct":1,"explanation":"Formative evaluation happens during development and delivery to improve the training while it is still running — mid-course checks, learner feedback, and adjustments such as adding a worked example. Summative evaluation judges the finished program through a final exam or certification. Level 4 and ROI measure organizational results and financial return, which come much later.\n\n形成性评估发生在开发与交付过程中，目的是在培训仍在进行时加以改进——课程中检查、学员反馈，以及补充示例等调整。总结性评估通过期末考试或认证来评判已完成的项目。第 4 级和 ROI 衡量组织结果与财务回报，时间上要晚得多。","related":[{"n":"19.8","t":"形成性与总结性评估"}],"level":"application","topic":"Formative Evaluation in Delivery"},{"text":"Participants rate a confined space course 4.8/5 for enjoyment and relevance, yet 45% fail the post-course written test. What is the MOST accurate interpretation?","group":1,"options":["The course worked because reactions were high","The test is invalid because learners enjoyed it","Level 1 reaction does not prove Level 2 learning","Repeat the course unchanged to raise scores"],"correct":2,"explanation":"Level 1 measures satisfaction only; it is the weakest evidence of effectiveness and does not predict learning. A high reaction score with a high failure rate points to a Level 2 problem — objectives, content depth, practice time, or assessment alignment — and requires investigation. Invalidating the test or repeating the same course unchanged addresses nothing.\n\n第 1 级只衡量满意度，是有效性最弱的证据，不能预测学习效果。高满意度伴随高不及格率，说明第 2 级存在问题——目标、内容深度、练习时间或考核与内容不一致——需要调查。认定考试无效或原样重复课程都解决不了问题。","related":[{"n":"20.5","t":"柯氏四级评估"}],"level":"application","topic":"Reaction vs Learning"},{"text":"After a lifting-technique program, the site's recordable injury rate falls 30%. In the same quarter, two lift-assist devices were installed and staffing changed. Management wants to report the full 30% as training results. What should the safety professional recommend?","group":1,"options":["Report all 30% as the training result","Report an ROI of 30% for the program","Abandon the evaluation as confounded","Isolate the training effect before crediting it"],"correct":3,"explanation":"Level 4 results are influenced by many variables, so the training effect must be isolated before it is credited or monetized — this is the Phillips step that precedes the ROI calculation. A comparison group, a matched site, or interrupted time-series analysis can separate the contribution of the lift assists and staffing changes. Reporting the full 30% overstates the program, and abandoning evaluation throws away useful information.\n\n第 4 级结果受多种变量影响，因此在归因或货币化之前必须分离培训效果——这是菲利普斯 ROI 计算之前的步骤。对照组、匹配场地或中断时间序列分析可以区分辅助提举设备与人员配置变化的贡献。把 30% 全部归功于培训会高估项目；放弃评估则浪费了有用信息。","related":[{"n":"20.8","t":"评估比较方法"},{"n":"20.6","t":"菲利普斯ROI"}],"level":"application","topic":"Isolating Level 4 Results"},{"text":"A trainer lets each crew choose which of two incident scenarios to work through and how to divide the roles, and asks them to set their own practice goals. Which andragogical assumption is being applied?","group":1,"options":["Self-concept: self-directed learning","Need to know: relevance comes first","Readiness: timing to a real need","Orientation: problem-centered content"],"correct":0,"explanation":"Self-concept states that adults prefer to be self-directed rather than dependent, so effective design offers choices, involves learners in planning, and uses discovery. Need to know concerns explaining why the topic matters; readiness concerns timing relative to a real need; orientation concerns problem-centred content. Offering choice and self-set goals is the hallmark of self-direction.\n\n自我概念假设认为成人倾向于自我导向而非依赖，因此有效设计应提供选择、让学习者参与规划并采用发现式活动。学习需求涉及解释主题为何重要；学习准备度涉及与实际需求出现的时机；学习取向涉及以问题为中心的内容。提供选择和自设目标正是自我导向的标志。","related":[{"n":"20.1","t":"成人学习理论"}],"level":"application","topic":"Andragogy Self-Concept"},{"text":"A crew includes some learners who want diagrams, some who want to read the procedure, and some who want to try the task. The trainer adds a schematic, a one-page handout, and a hands-on practice round for one topic. This approach is best described as:","group":1,"options":["Matching each learner's single VARK preference with a separate course","A waste of time, because VARK preferences do not exist","Auditory-only instruction with visual support","Using multiple modalities so the content reaches the whole group"],"correct":3,"explanation":"VARK describes preferences for taking in information; the practical response is to build multiple modalities into the same session — visuals, text, explanation, and hands-on practice — so every learner has a route into the content. Designing separate courses per preference is not feasible and is not what the model recommends. The schematic, handout, and practice round are exactly that multimodal design.\n\nVARK 描述的是信息接收偏好；实用的做法是在同一节课中融入多种方式——图形、文字、讲解和动手练习——让每位学员都有进入内容的通道。按偏好分设不同课程既不可行，也不是该模型所建议的。示意图、讲义和实操练习正是这种多方式设计。","related":[{"n":"20.2","t":"VARK"}],"level":"application","topic":"VARK Multimodal Design"},{"text":"After a hands-on spill-response drill, the facilitator asks the team: 'What did you notice? What worked and what did not?' Which stage of Kolb's cycle is this?","group":1,"options":["Concrete experience","Active experimentation","Reflective observation","Abstract conceptualization"],"correct":2,"explanation":"The drill itself is concrete experience; the structured debrief that reviews what happened is reflective observation. Abstract conceptualization would draw principles or rules from the experience, and active experimentation would apply the new concepts to a new scenario. Skipping the debrief leaves the experience unprocessed, which is why facilitated reflection is essential.\n\n演练本身是具体体验；回顾发生了什么的结构化讲评属于反思观察。抽象概念化要从经验中提炼原则或规则，主动实验则把新概念应用到新情景。省略讲评会使经验未经加工，这正是需要引导式反思的原因。","related":[{"n":"20.3","t":"库伯学习循环"}],"level":"application","topic":"Kolb Reflective Observation"},{"text":"A crew starts a shift after a near miss in which a saw guard was found taped open. The supervisor wants a short, focused discussion of that specific hazard before work begins. What is the MOST appropriate method?","group":1,"options":["A 15-minute toolbox talk at the point of use","A 40-hour HAZWOPER course for the crew","A self-paced e-learning module this week","An annual refresher next quarter"],"correct":0,"explanation":"A toolbox talk is a short (typically about 15 minutes), single-topic session used to reinforce training, address a recent incident, or cover a task-specific hazard at the point of use — exactly this situation. Attendance, topic, date, and presenter should be documented as part of the training record. A 40-hour course, a self-paced module, or a quarterly refresher is disproportionate and too late to shape behavior this shift.\n\n工具箱谈话是简短（通常约 15 分钟）、聚焦单一主题的活动，用于强化培训、应对近期事件或在作业现场讲解特定危害——正符合此情形。出勤、主题、日期和主讲人应作为培训记录的一部分予以保存。40 小时课程、自定进度模块或季度复训都不成比例，且对本班次的行为影响太迟。","related":[{"n":"20.4","t":"培训交付方式"}],"level":"application","topic":"Toolbox Talk Use"},{"text":"An experienced forklift operator transfers to a department that uses a different type of powered industrial truck with a side-loader attachment. What does 1910.178 require?","group":1,"options":["Nothing; the operator was evaluated 3 years ago","Formal instruction, practical training, and evaluation","A written test only, since the operator is experienced","A new 3-year certification with no extra training"],"correct":1,"explanation":"1910.178(l) requires training and evaluation when an operator is assigned to a different type of truck or when conditions change, in addition to the 3-year recertification. Training combines formal instruction, practical training, and evaluation of the operator's performance in the workplace. Prior experience may shorten training but does not remove the requirement for equipment-specific evaluation.\n\n1910.178(l) 规定，操作员被分配到不同类型车辆或工况变化时，必须重新培训和评估，这与 3 年一次的发证复评是两回事。培训包括正式教学、实操训练以及在工作场所对操作表现的评估。已有经验可以缩短培训，但不能免除针对具体设备的评估要求。","related":[{"n":"20.7","t":"OSHA培训要求"}],"level":"application","topic":"Retraining on New Equipment"},{"text":"A site maintains a grid listing each job title's required competencies down one axis and each worker's demonstrated proficiency across the other. What is this tool, and what is it used for?","group":1,"options":["A job hazard analysis; used to identify task hazards","A training needs assessment; used to set the training budget","A competency (skills) matrix; used to target training and verify coverage","A Kirkpatrick evaluation grid; used to score reaction data"],"correct":2,"explanation":"A competency matrix maps the required competencies for each role against each individual's demonstrated proficiency, making gaps and single-point-of-failure skills visible. It drives targeted training, cross-training, and succession planning. A JHA analyzes task hazards, a TNA is the broader three-level analysis, and Kirkpatrick is an evaluation framework rather than a skills inventory.\n\n能力矩阵把每个岗位所需的能力与每位员工已证实的能力水平对应起来，使差距和“单点失效”技能一目了然。它用于指导针对性培训、交叉培训和继任规划。JHA 分析任务危害；TNA 是更宏观的三层面分析；柯氏是评估框架而非技能清单。","related":[{"n":"19.7","t":"培训计划要素"},{"n":"19.1","t":"培训需求评估"}],"level":"recall","topic":"Competency Matrix"},{"text":"Under 29 CFR 1910.1030, how long must an employer keep bloodborne pathogens training records?","group":1,"options":["1 year","3 years","5 years","30 years"],"correct":1,"explanation":"1910.1030(h)(2)(i) requires training records to be kept for 3 years from the date the training occurred, and they must include the dates, a summary of contents, the names and qualifications of trainers, and the names and job titles of attendees. The 30-year figure applies to medical and exposure records under 1910.1020, not to BBP training records.\n\n1910.1030(h)(2)(i) 要求培训记录自培训之日起保存 3 年，内容包括培训日期、内容摘要、讲师姓名与资质、参训人员姓名与职务。30 年适用于 1910.1020 下的医疗与暴露记录，不适用于血源性病原体培训记录。","related":[{"n":"20.7","t":"OSHA培训要求"}],"level":"recall","topic":"BBP Training Record Retention"},{"text":"ANSI/ASSP Z490.1 requires which combination of evaluation for EHS training?","group":1,"options":["Summative evaluation only","Formative evaluation only","Both formative and summative evaluation","Kirkpatrick Level 1 only"],"correct":2,"explanation":"Z490.1 requires both formative evaluation (during development and delivery, to improve the program) and summative evaluation (at the end, to judge whether objectives were met). Relying on reaction data alone does not satisfy the standard. This dual requirement is what links evaluation to continuous improvement.\n\nZ490.1 要求同时进行形成性评估（在开发与交付期间进行，用于改进项目）和总结性评估（在结束时判断目标是否达成）。仅依赖反应数据不满足该标准。正是这一双重要求把评估与持续改进连接起来。","related":[{"n":"19.2","t":"ANSI/ASSP Z490.1"},{"n":"19.8","t":"形成性与总结性评估"}],"level":"recall","topic":"Z490.1 Evaluation Requirement"},{"text":"An objective requires the trainee to 'justify the selected ventilation control against the applicable exposure limit and cost constraints.' Which Bloom level is this?","group":1,"options":["Apply","Analyze","Create","Evaluate"],"correct":3,"explanation":"Evaluate is judging a choice against criteria and defending it — verbs such as justify, assess, recommend, and prioritize. Analyze would be comparing or differentiating without a judgment; Apply would be using the control in a situation; Create would require designing a new system. Justifying a selection against stated criteria is the definition of Evaluate.\n\n评价（Evaluate）是依据标准判断选择并为之辩护——对应 justify、assess、recommend、prioritize 等动词。分析是作出判断前的比较或区分；应用是在情境中使用控制措施；创造要求设计新系统。依据既定标准为选择辩护正是评价层次的定义。","related":[{"n":"19.5","t":"布鲁姆分类学"}],"level":"recall","topic":"Bloom Evaluate Level"},{"text":"Under 29 CFR 1910.146, how often must permit-required confined space training be repeated for entrants and attendants?","group":1,"options":["Every 12 months","Every 6 months","Every 2 years","Every 3 years"],"correct":0,"explanation":"1910.146(g)(2) requires retraining when duties change, when there is a change in the permit space program or operations that presents a hazard, or when the employer believes the employee's performance is inadequate; the common compliance interval is every 12 months. Three years is the forklift recertification interval, and 8 hours is the HAZWOPER annual refresher.\n\n1910.146(g)(2) 要求：职责变更、许可空间程序或作业变化带来新危害、或雇主认为员工表现不足时须重新培训；实务中通常按每 12 个月执行。3 年是叉车复评周期，8 小时是 HAZWOPER 的年度复训。","related":[{"n":"20.7","t":"OSHA培训要求"}],"level":"recall","topic":"Confined Space Retraining"},{"text":"Which element of a SMART objective is addressed by the phrase 'within 30 days of hire'?","group":1,"options":["Specific","Measurable","Relevant","Time-bound"],"correct":3,"explanation":"Time-bound (T) fixes the deadline or timeframe by which the performance must be demonstrated — 'within 30 days of hire'. Specific defines the behavior precisely, Measurable supplies the standard or accuracy, and Relevant ties the objective to job requirements. Vagueness about when is one of the most common defects in safety training objectives.\n\n有时限（T）确定必须展示该绩效的截止时间或时间框架——“入职 30 天内”。具体（S）精确界定行为，可衡量（M）给出标准或准确率，相关（R）把目标与岗位要求联系起来。时间含糊是安全培训目标最常见的缺陷之一。","related":[{"n":"19.6","t":"SMART目标"}],"level":"recall","topic":"SMART Time-Bound"}]
});
