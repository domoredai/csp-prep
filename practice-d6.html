<script>
CSPQuiz.init({
  quizId: 'practice-d6',
  quizTitle: 'D6 职业健康 强化训练 / Domain 6 Boost',
  quizTopic: 'Domain 6 — Occupational Health & Applied Science',
  containerId: 'quiz-root',
  questions: [{"text":"An industrial hygienist samples a solvent mist with a pump calibrated at 1.5 L/min for 300 minutes. Laboratory analysis reports 180 µg of analyte on the filter cassette. What is the airborne concentration in mg/m³?","group":1,"options":["0.12 mg/m³","0.27 mg/m³","0.40 mg/m³","0.90 mg/m³"],"correct":2,"explanation":"Sample volume = flow rate × time = 1.5 L/min × 300 min = 450 L = 0.45 m³. Convert the analytical mass to milligrams: 180 µg = 0.180 mg. Then C = mass ÷ volume = 0.180 mg ÷ 0.45 m³ = 0.40 mg/m³, which is the same as 0.180 × 1000 ÷ 450. Forgetting the µg-to-mg conversion, or treating 450 L as 450 m³, produces the distractors.\n\n采样体积 = 流速 × 时间 = 1.5 L/min × 300 min = 450 L = 0.45 m³。先把分析质量换算为毫克：180 µg = 0.180 mg。浓度 = 质量 ÷ 体积 = 0.180 mg ÷ 0.45 m³ = 0.40 mg/m³，也可写作 0.180 × 1000 ÷ 450。忘记 µg 换 mg，或把 450 L 当成 450 m³，就会得到干扰项。","related":[{"n":"16.4","t":"采样设备与方法"}],"level":"calculation","topic":"Sampler Volume & Mass"},{"text":"A direct-reading instrument reports toluene at 200 mg/m³. The molecular weight of toluene is 92. Using the standard conversion at 25 °C (molar volume 24.45 L), what is the concentration in ppm?","group":1,"options":["53 ppm","76 ppm","112 ppm","38 ppm"],"correct":0,"explanation":"C(ppm) = C(mg/m³) × 24.45 ÷ MW = 200 × 24.45 ÷ 92 = 4,890 ÷ 92 = 53 ppm. The 24.45 is the molar volume in liters at 25 °C and 1 atm, and ppm is a volume ratio, so the conversion always depends on molecular weight. Inverting the factor (multiplying by MW) or dropping the molecular weight gives the other options.\n\nC(ppm) = C(mg/m³) × 24.45 ÷ 分子量 = 200 × 24.45 ÷ 92 = 4,890 ÷ 92 = 53 ppm。24.45 是 25 °C、1 个大气压下的摩尔体积；ppm 是体积比，因此换算必须除以分子量。把因子倒过来（乘以分子量）或忽略分子量，就会得到其他选项。","related":[{"n":"16.4","t":"采样设备与方法"},{"n":"16.6","t":"OELs"}],"level":"calculation","topic":"ppm to mg/m³ Conversion"},{"text":"A plant moves from 8-hour to 12-hour shifts. A solvent has an 8-hour PEL-TWA of 100 ppm. Using the Brief & Scala model, what exposure limit should the industrial hygienist apply to the 12-hour shift?","group":1,"options":["67 ppm","50 ppm","75 ppm","88 ppm"],"correct":1,"explanation":"Adjusted OEL = OEL × (8/h) × (24 − h)/16 = 100 × (8/12) × (24 − 12)/16 = 100 × 0.667 × 0.75 = 50 ppm. Brief & Scala accounts for both the longer daily exposure and the shorter recovery period, so at h = 12 the limit halves. The 67 ppm option applies only the 8/12 term, and 75 ppm applies only the recovery term.\n\n调整后 OEL = OEL × (8/h) × (24 − h) ÷ 16 = 100 × (8/12) × (24 − 12) ÷ 16 = 100 × 0.667 × 0.75 = 50 ppm。Brief & Scala 模型同时考虑每日暴露时间延长和恢复时间缩短，因此 h = 12 时限值减半。67 ppm 只乘了 8/12，75 ppm 只乘了恢复项。","related":[{"n":"16.3","t":"采样类型与时长"}],"level":"calculation","topic":"Extended Shift Adjustment"},{"text":"A worker on a 10-hour shift is exposed to 60 ppm for 4 hours, 30 ppm for 4 hours, and 0 ppm for the remaining 2 hours. What is the 10-hour TWA?","group":1,"options":["29 ppm","45 ppm","54 ppm","36 ppm"],"correct":3,"explanation":"TWA = sum of (C × T) ÷ total hours = (60 × 4 + 30 × 4 + 0 × 2) ÷ 10 = (240 + 120 + 0) ÷ 10 = 36 ppm. The denominator must be the full 10 hours worked, including the zero-exposure period, not 8. This 10-hour TWA is not directly comparable with an 8-hour PEL until the limit itself is adjusted for the extended shift (Brief & Scala).\n\nTWA = 各段（浓度 × 时长）之和 ÷ 总时长 = (60×4 + 30×4 + 0×2) ÷ 10 = (240 + 120 + 0) ÷ 10 = 36 ppm。分母必须是实际工作的 10 小时，包含无暴露时段，而不是 8 小时。该 10 小时 TWA 不能直接与 8 小时 PEL 比较，须先用 Brief & Scala 调整限值。","related":[{"n":"16.5","t":"TWA与PEL混合计算"}],"level":"calculation","topic":"10-Hour Shift TWA"},{"text":"A sampling pump is calibrated at 2.00 L/min before a 6-hour personal sample and at 1.80 L/min immediately afterward. The laboratory result is within the expected range for the task. What should the industrial hygienist do with the sample?","group":1,"options":["Accept the result and multiply it by 1.10 to correct for drift","Accept the result because the pre-calibration was in tolerance","Reject the sample and resample, because flow varied more than 5%","Average the two flow rates and recalculate the volume"],"correct":2,"explanation":"Pumps must be calibrated before and after every sampling session, and flow must stay within ±5% of the target. A drop from 2.00 to 1.80 L/min is 10%, so the true sample volume is unknown and the concentration cannot be defensibly calculated. A correction factor is not allowed because the timing of the drift is unknown; the sample is invalid and must be repeated.\n\n采样泵必须在每次采样前后标定，流速须保持在目标值的 ±5% 以内。从 2.00 降到 1.80 L/min 是 10% 的漂移，真实采样体积未知，浓度无法可靠计算。由于不知道漂移发生的时间，不能用修正系数补救；该样品无效，必须重新采样。","related":[{"n":"16.4","t":"采样设备与方法"}],"level":"application","topic":"Pump Calibration Drift"},{"text":"An exposure assessment at a 3-shift plant is based on eight full-shift samples collected on the day shift. The night shift runs a different product line with the building's general ventilation shut down for energy savings. Management wants to close the assessment as compliant. What is the MOST significant weakness?","group":1,"options":["Eight samples are too few for any conclusion","The night shift is a distinct exposure scenario that was never evaluated","Full-shift sampling cannot be compared with an 8-hour PEL","Personal sampling is invalid unless paired with area sampling"],"correct":1,"explanation":"A compliance decision must cover every similar exposure group and operating condition. The night shift runs a different product line with ventilation off, so it is a separate, potentially higher exposure scenario; closing the assessment from day-shift data alone is not defensible. Eight samples is adequate for screening, full-shift samples are exactly what a PEL-TWA requires, and area sampling is optional rather than a validity requirement.\n\n合规判定必须覆盖所有相似暴露组和运行工况。夜班运行不同产品线且通风关闭，属于独立且可能更高的暴露情景；仅凭白班数据结案不可靠。8 个样品用于筛查已足够，整班次采样正是 PEL-TWA 所需要的，区域采样是可选项而非有效性的前提。","related":[{"n":"16.7","t":"暴露评估策略"},{"n":"16.3","t":"采样类型与时长"}],"level":"application","topic":"SEG Coverage Across Shifts"},{"text":"A substance has an OSHA ceiling limit of 10 ppm. A safety professional plans to verify compliance using a charcoal tube sample collected over the full 8-hour shift. Why is this approach inadequate?","group":1,"options":["An 8-hour integrated sample averages out short peaks that may exceed the ceiling","Charcoal tubes cannot collect the substance at ceiling concentrations","Ceiling limits apply only to 15-minute averages, not to instantaneous values","The sample volume would be too large for laboratory analysis"],"correct":0,"explanation":"A ceiling limit must never be exceeded, even momentarily, so compliance can only be shown with real-time (direct-reading) monitoring that captures peaks. An integrated 8-hour sample yields only a TWA and would dilute a short excursion. A 15-minute window describes a STEL, which is a different limit, and charcoal is a suitable sorbent for organic vapors; the problem is the averaging, not the medium.\n\n上限值即使瞬间也不得超过，因此只有能捕捉峰值的实时（直读式）监测才能证明合规。8 小时综合样品只给出 TWA，会把短时超限稀释掉。15 分钟对应的是 STEL，属另一种限值；活性炭是合适的有机蒸气吸附介质，问题在于平均而非介质。","related":[{"n":"16.3","t":"采样类型与时长"}],"level":"application","topic":"Ceiling Limit Monitoring"},{"text":"A worker will use a half-mask air-purifying respirator with an assigned protection factor (APF) of 10. The substance has a PEL of 200 ppm and an IDLH of 500 ppm. What is the maximum use concentration for this respirator in this atmosphere?","group":1,"options":["200 ppm","1,000 ppm","500 ppm","2,000 ppm"],"correct":2,"explanation":"MUC = APF × OEL = 10 × 200 = 2,000 ppm, but the MUC can never exceed the IDLH. Because 2,000 ppm is above the IDLH of 500 ppm, the IDLH governs and the respirator is limited to 500 ppm; above that, a supplied-air respirator (SCBA, or SAR with escape bottle) is required. The 2,000 ppm choice is the uncapped calculation and is the standard trap.\n\nMUC = APF × OEL = 10 × 200 = 2,000 ppm，但 MUC 绝不可超过 IDLH。由于 2,000 ppm 高于 IDLH 500 ppm，以 IDLH 为准，该呼吸器最多只能用到 500 ppm；超过 500 ppm 必须使用供气式呼吸器（SCBA 或带逃生瓶的 SAR）。2,000 ppm 是未设上限的计算结果，也是常见陷阱。","related":[{"n":"16.6","t":"OELs"}],"level":"calculation","topic":"MUC vs IDLH"},{"text":"During a plant walkthrough an industrial hygienist reviews SDSs, interviews employees, examines injury and illness logs, and follows the process flow. Which AREC phase is being performed?","group":1,"options":["Anticipate","Evaluate","Control","Recognize"],"correct":3,"explanation":"Recognize is the phase in which hazards that already exist are identified using qualitative tools: walkthrough surveys, SDS review, employee interviews, injury/illness logs, and process flow diagrams. Anticipate happens before the hazard exists (design review, PSSR, management of change); Evaluate is quantitative sampling compared with OELs; Control is applying the hierarchy of controls.\n\n识别（Recognize）是发现已存在危害的阶段，使用定性工具：走查调查、SDS 审查、员工访谈、伤害/疾病记录和工艺流程图。预判（Anticipate）发生在危害存在之前（设计审查、PSSR、变更管理）；评估（Evaluate）是定量采样并与 OEL 比较；控制（Control）是应用控制层级。","related":[{"n":"16.1","t":"AREC框架"}],"level":"recall","topic":"AREC Recognize Phase"},{"text":"A facility wants to measure personal exposure to a solvent vapor using passive diffusion badges. The work area has large circulation fans that keep air moving across the workers at roughly 150 fpm. What is the PRIMARY concern?","group":1,"options":["Air movement alters the uptake rate, so results may be biased","Badges cannot be worn in areas with organic vapors","Badges only measure peak concentrations, not averages","Badges require a pump, which the fans would disturb"],"correct":0,"explanation":"Passive badges rely on diffusion at a rate derived from Fick's law, calibrated for a quiescent air boundary layer. High face velocity can thin that layer and change the uptake rate, biasing the result, so active pump sampling is preferred in drafty areas. Badges need no pump, and they integrate exposure over time rather than measuring peaks.\n\n被动式徽章依靠菲克定律的扩散速率工作，标定时假设存在静止空气边界层。高面风速会减薄该边界层、改变吸收速率，使结果产生偏差，因此在气流大的区域应改用主动泵采样。徽章不需要泵，且是对时间积分而非测峰值。","related":[{"n":"16.4","t":"采样设备与方法"}],"level":"application","topic":"Passive Badge Limitations"},{"text":"A respirable dust sample from a concrete-cutting operation is analyzed at 0.08 mg/m³ of respirable crystalline silica. The OSHA PEL is 50 µg/m³ as an 8-hour TWA, with an action level of 25 µg/m³. What percentage of the PEL does this exposure represent?","group":1,"options":["40%","60%","160%","250%"],"correct":2,"explanation":"Convert units first: 0.08 mg/m³ = 80 µg/m³. Then 80 ÷ 50 = 1.6, or 160% of the PEL, which is an overexposure and also well above the 25 µg/m³ action level that triggers exposure monitoring and medical surveillance. Comparing 0.08 directly with 50 without converting units is the error that produces the low distractors.\n\n先换算单位：0.08 mg/m³ = 80 µg/m³。80 ÷ 50 = 1.6，即 PEL 的 160%，属于过度暴露，也远高于 25 µg/m³ 的行动水平（触发暴露监测与医学监护）。若不换算单位直接拿 0.08 与 50 比较，就会得到偏低的干扰项。","related":[{"n":"16.2","t":"工业卫生危害因素"},{"n":"16.6","t":"OELs"}],"level":"calculation","topic":"Silica PEL Percentage"},{"text":"Under the OSHA noise standard (5-dB exchange rate), what is the maximum allowable exposure time at 105 dBA?","group":2,"options":["0.5 hour","2 hours","4 hours","1 hour"],"correct":3,"explanation":"T = 8 ÷ 2^((L − 90)/5) = 8 ÷ 2^(15/5) = 8 ÷ 2³ = 8 ÷ 8 = 1 hour. Every 5 dBA above 90 dBA halves the allowed time: 90 dBA gives 8 h, 95 dBA 4 h, 100 dBA 2 h, and 105 dBA 1 h. The 2-hour option is the value for 100 dBA, and 0.5 hour would correspond to 110 dBA.\n\nT = 8 ÷ 2^((L − 90)/5) = 8 ÷ 2^(15/5) = 8 ÷ 2³ = 1 小时。90 dBA 以上每增加 5 dBA，允许时间减半：90 dBA 为 8 小时、95 dBA 为 4 小时、100 dBA 为 2 小时、105 dBA 为 1 小时。2 小时对应的是 100 dBA，0.5 小时对应 110 dBA。","related":[{"n":"17.2","t":"噪声计算"}],"level":"calculation","topic":"OSHA Allowable Time at 105 dBA"},{"text":"A worker is exposed to 100 dBA for 1 hour, 95 dBA for 2 hours, and 85 dBA for 5 hours. What is the noise dose under OSHA?","group":2,"options":["131%","106%","119%","156%"],"correct":0,"explanation":"D = 100 × Σ(C/T). Allowed times under the 5-dB rule: 100 dBA → 2 h; 95 dBA → 4 h; 85 dBA → 16 h. So D = 100 × (1/2 + 2/4 + 5/16) = 100 × (0.500 + 0.500 + 0.3125) = 131%. Because D > 100%, the worker is overexposed and feasible engineering/administrative controls plus hearing protection are required. Treating 85 dBA as an 8-hour allowance, instead of 16 hours, is the usual arithmetic error.\n\nD = 100 × Σ(C/T)。按 5 dB 交换率：100 dBA 允许 2 小时、95 dBA 允许 4 小时、85 dBA 允许 16 小时。故 D = 100 × (1/2 + 2/4 + 5/16) = 100 × (0.500 + 0.500 + 0.3125) = 131%。因 D 大于 100%，属过度暴露，必须实施可行的工程/行政控制并提供听力防护。把 85 dBA 的允许时间当作 8 小时而不是 16 小时，是最常见的算术错误。","related":[{"n":"17.2","t":"噪声计算"}],"level":"calculation","topic":"Noise Dose Three Levels"},{"text":"Using the NIOSH recommended criterion (3-dB exchange rate), what is the allowable exposure time at 100 dBA?","group":2,"options":["30 minutes","15 minutes","1 hour","2 hours"],"correct":1,"explanation":"NIOSH: T = 8 ÷ 2^((L − 85)/3) = 8 ÷ 2^(15/3) = 8 ÷ 2⁵ = 8 ÷ 32 = 0.25 hour = 15 minutes. The 3-dB rate reflects the true doubling of acoustic energy, so allowed time falls much faster than under OSHA's 5-dB rule, where 100 dBA still permits 2 hours. NIOSH values are recommendations, not enforceable limits.\n\nNIOSH：T = 8 ÷ 2^((L − 85)/3) = 8 ÷ 2^(15/3) = 8 ÷ 2⁵ = 8 ÷ 32 = 0.25 小时 = 15 分钟。3 dB 交换率反映声能的真实倍增，因此允许时间比 OSHA 的 5 dB 规则下降得快得多——在 OSHA 下 100 dBA 仍允许 2 小时。NIOSH 数值是建议值，不是强制限值。","related":[{"n":"17.2","t":"噪声计算"},{"n":"17.1","t":"噪声监管标准"}],"level":"calculation","topic":"NIOSH Allowable Time at 100 dBA"},{"text":"In an indoor work area with no solar load, the wet-bulb temperature is 24 °C and the globe temperature is 40 °C. Using the indoor WBGT equation, what is the WBGT?","group":2,"options":["26.4 °C","27.6 °C","31.2 °C","28.8 °C"],"correct":3,"explanation":"For indoor or no-sun conditions, WBGT = 0.7 × WB + 0.3 × GT = 0.7(24) + 0.3(40) = 16.8 + 12.0 = 28.8 °C. The outdoor equation adds a dry-bulb term (0.7 × WB + 0.2 × GT + 0.1 × DB), which would give a different value. The WBGT is then compared with the ACGIH TLV for the worker's metabolic rate and work/rest cycle.\n\n室内或无日照条件下，WBGT = 0.7 × WB + 0.3 × GT = 0.7(24) + 0.3(40) = 16.8 + 12.0 = 28.8 °C。室外公式还要加干球项（0.7 × WB + 0.2 × GT + 0.1 × DB），结果会不同。随后将 WBGT 与按代谢率和工作/休息周期查得的 ACGIH TLV 比较。","related":[{"n":"17.8","t":"热应激"}],"level":"calculation","topic":"Indoor WBGT Calculation"},{"text":"A dosimeter reports a noise dose of 250% for an 8-hour shift. Using the OSHA conversion, what is the equivalent 8-hour TWA?","group":2,"options":["96.6 dBA","93.6 dBA","95.0 dBA","99.4 dBA"],"correct":0,"explanation":"TWA = 16.61 × log10(D/100) + 90 = 16.61 × log10(2.5) + 90 = 16.61 × 0.3979 + 90 = 6.6 + 90 ≈ 96.6 dBA. As a check, a 200% dose corresponds to 95 dBA and a 100% dose to 90 dBA, so 250% must fall above 95 dBA. The formula already embeds the OSHA 5-dB exchange rate.\n\nTWA = 16.61 × log10(D/100) + 90 = 16.61 × log10(2.5) + 90 = 16.61 × 0.3979 + 90 = 6.6 + 90 ≈ 96.6 dBA。可作校核：200% 剂量对应 95 dBA，100% 对应 90 dBA，因此 250% 必然高于 95 dBA。该公式已内含 OSHA 的 5 dB 交换率。","related":[{"n":"17.2","t":"噪声计算"}],"level":"calculation","topic":"TWA from Noise Dose"},{"text":"A worker's 8-hour TWA is 98 dBA. The employer issues earmuffs labeled NRR 25. Applying the OSHA derating method, what is the estimated protected exposure, and is it adequate?","group":2,"options":["84 dBA — adequate, below the 85 dBA level","91 dBA — adequate, below the 90 dBA PEL","89 dBA — not adequate; more attenuation is needed","73 dBA — adequate, but overprotection is a concern"],"correct":2,"explanation":"OSHA derating: protected level = TWA − (NRR − 7)/2 = 98 − (25 − 7)/2 = 98 − 9 = 89 dBA. Hearing protection must bring exposure below 85 dBA, so 89 dBA is still too high; a higher-attenuation protector or dual protection (earplugs under muffs) is needed. The derating is required because labeled NRRs overstate real-world protection.\n\nOSHA 降噪修正：受保护暴露 = TWA − (NRR − 7)/2 = 98 − (25 − 7)/2 = 98 − 9 = 89 dBA。听力防护必须把暴露降到 85 dBA 以下，89 dBA 仍然偏高，需要更高衰减量的防护器或双重防护（耳塞加耳罩）。标称 NRR 高估了实际防护效果，因此必须做修正。","related":[{"n":"17.2","t":"噪声计算"},{"n":"17.3","t":"听力保护计划"}],"level":"application","topic":"NRR Derating Adequacy"},{"text":"A radiation worker declares her pregnancy in writing. Her dosimetry shows 1.2 rem accumulated so far this year. What dose limit applies for the remainder of the gestation period?","group":2,"options":["5 rem to the whole body each year","0.5 rem to the fetus over the gestation","15 rem to the lens of the eye","0.1 rem, the public annual limit"],"correct":1,"explanation":"A declared pregnant worker is subject to a limit of 0.5 rem (5 mSv) to the embryo/fetus over the entire gestation, and doses must be kept ALARA. The 5 rem whole-body limit applies to other occupationally exposed adults, 15 rem is the lens limit, and 0.1 rem is the public limit. The employer should review her exposure history and adjust duties using time, distance, and shielding so the 0.5 rem is not exceeded.\n\n已申报怀孕的工人，整个妊娠期胚胎/胎儿的剂量限值为 0.5 rem（5 mSv），且须保持在 ALARA 水平。5 rem 是其他职业受照成人的全身限值，15 rem 是眼晶状体限值，0.1 rem 是公众限值。雇主应审查其暴露史，并通过时间、距离和屏蔽调整工作，确保不超过 0.5 rem。","related":[{"n":"17.4","t":"电离辐射"}],"level":"application","topic":"Declared Pregnant Worker"},{"text":"A worker using an impact wrench is measured at a peak sound pressure of 148 dB. The 8-hour TWA is only 84 dBA. What is the correct interpretation?","group":2,"options":["No action is needed because the 8-hour TWA is below 85 dBA","The peak limit applies only to continuous noise, not impact tools","The reading is invalid because peak levels are measured in dBA","The 140 dB peak limit is exceeded, so feasible controls and hearing protection are required"],"correct":3,"explanation":"OSHA 1910.95 separately limits impulsive noise to a 140 dB peak, independent of the 8-hour TWA. A 148 dB peak is an overexposure even though the TWA is only 84 dBA, and it carries a risk of acoustic trauma. The employer must use feasible engineering and administrative controls and provide hearing protection; peak levels are indeed expressed in dB rather than dBA.\n\nOSHA 1910.95 对脉冲噪声单独规定 140 dB 峰值上限，与 8 小时 TWA 无关。即使 TWA 只有 84 dBA，148 dB 的峰值仍属过度暴露，存在声创伤风险。雇主必须采用可行的工程和行政控制并提供听力防护；峰值声压确实以 dB（而非 dBA）表示。","related":[{"n":"17.1","t":"噪声监管标准"}],"level":"application","topic":"140 dB Peak Limit"},{"text":"A welder reports a gritty, painful sensation in both eyes and extreme sensitivity to light several hours after a shift of arc welding without a face shield. What is the condition and the primary control?","group":2,"options":["Photokeratitis from UV; use a welding helmet","Infrared cataract; use leaded glass shields","Retinal burn from visible light; use sunglasses","Chemical conjunctivitis; use sealed goggles"],"correct":0,"explanation":"Arc welding emits intense ultraviolet radiation that damages the corneal epithelium, producing photokeratitis (\"welder's flash\" or \"arc eye\") with a characteristic delay of several hours. The control is to block the UV on the source-facing side: a welding helmet with the correct shade, plus screens to protect nearby workers. Sunglasses do not block enough UV, infrared is associated with the delayed \"glassblower's cataract\", and fume irritation is a different exposure.\n\n电弧焊发出强烈紫外线，损伤角膜上皮，导致光性角膜炎（“电焊眼”），典型表现为数小时潜伏期后发病。控制措施是在迎光侧阻挡紫外线：使用合适遮光号的焊接面罩，并用屏风保护附近人员。太阳镜不能充分阻挡紫外线；红外线关联的是“吹玻璃工白内障”；烟尘刺激属另一类暴露。","related":[{"n":"17.5","t":"非电离辐射"}],"level":"application","topic":"Welder's Flash"},{"text":"Air sampling shows a solvent with a 'Skin' notation at only 5% of its PEL, and the supervisor concludes the risk is negligible. Why is this conclusion unsafe?","group":2,"options":["Air sampling always underestimates vapor levels","Dermal uptake can add substantially to the dose","A 5% result proves the sampler failed","Skin notation applies only to gases"],"correct":1,"explanation":"A 'Skin' notation signals that the substance is absorbed through intact skin in amounts that can contribute significantly to total body burden. Airborne concentration alone therefore does not bound the dose, and the correct controls are engineering controls plus appropriate gloves and hygiene rather than reliance on the air result. The sampling did not necessarily fail — the dermal route was simply never measured.\n\n“Skin（皮肤）”标注表示该物质可经完整皮肤吸收，且吸收量可显著增加体内总负荷。因此仅凭空气浓度不能界定剂量；正确控制是工程控制加上合适的手套与卫生措施，而不能只依赖空气检测结果。采样未必失败——只是皮肤途径从未被测量。","related":[{"n":"17.6","t":"毒理学指标"},{"n":"16.6","t":"OELs"}],"level":"application","topic":"Skin Notation"},{"text":"Under OSHA 1910.95, when must a baseline audiogram be obtained for a newly exposed employee?","group":2,"options":["Within 30 days of the first exposure","Within 12 months of the first exposure","Only after a threshold shift is recorded","Within 6 months, or 1 year with a mobile van"],"correct":3,"explanation":"A baseline audiogram must be established within 6 months of the employee's first exposure at or above the action level; the period extends to 1 year when a mobile test van is used. Annual audiograms follow and are compared with the baseline to detect a standard threshold shift, which triggers a retest within 30 days. Thirty days is the STS retest interval, not the baseline deadline.\n\n基线听力图必须在员工首次暴露达到或超过行动水平后 6 个月内完成；使用移动检测车时可延长至 1 年。之后每年复查并与基线比较，以发现标准阈值偏移（STS），STS 需在 30 天内重测。30 天是 STS 的重测期限，不是基线期限。","related":[{"n":"17.3","t":"听力保护计划"}],"level":"recall","topic":"Baseline Audiogram Timing"},{"text":"A worker lifts a 32-lb box from knuckle height (V = 30 in) to a shelf 20 in higher (D = 20 in). The horizontal distance is H = 16 in, there is no twisting (A = 0), the frequency multiplier is 0.88, and coupling is fair (CM = 0.95). What are the RWL and the Lifting Index?","group":3,"options":["RWL ≈ 21.6 lb; LI ≈ 1.5, high risk","RWL ≈ 24.2 lb; LI ≈ 1.3, redesign recommended","RWL ≈ 26.8 lb; LI ≈ 1.2, nominal risk","RWL ≈ 30.5 lb; LI ≈ 1.0, no action needed"],"correct":1,"explanation":"HM = 10/16 = 0.625; VM = 1 − 0.0075|30 − 30| = 1.00; DM = 0.82 + 1.8/20 = 0.91; AM = 1.00. RWL = 51 × 0.625 × 1.00 × 0.91 × 1.00 × 0.88 × 0.95 ≈ 24.2 lb. LI = 32 ÷ 24.2 ≈ 1.3, which is above 1.0 and indicates moderate-to-high risk; job redesign is recommended, so 'no action needed' is wrong.\n\nHM = 10/16 = 0.625；VM = 1 − 0.0075|30 − 30| = 1.00；DM = 0.82 + 1.8/20 = 0.91；AM = 1.00。RWL = 51 × 0.625 × 1.00 × 0.91 × 1.00 × 0.88 × 0.95 ≈ 24.2 磅。LI = 32 ÷ 24.2 ≈ 1.3，大于 1.0，属中高风险，建议进行作业再设计，因此“无需行动”不正确。","related":[{"n":"18.1","t":"NIOSH提举方程"}],"level":"calculation","topic":"RWL and Lifting Index"},{"text":"A degreasing operation releases solvent vapor at a steady 0.2 cfm. The target concentration is 100 ppm, the incoming air contains no solvent, and a safety factor K of 4 is applied. What dilution ventilation rate is required?","group":3,"options":["800 cfm","2,000 cfm","8,000 cfm","80,000 cfm"],"correct":2,"explanation":"Q = (q × K × 10⁶) ÷ (C − C₀) = (0.2 × 4 × 1,000,000) ÷ (100 − 0) = 800,000 ÷ 100 = 8,000 cfm. The 10⁶ converts the ppm target into a volume fraction, and K provides margin for imperfect mixing. Dilution at this scale is acceptable only because the solvent is of low toxicity and released uniformly; a highly toxic or intermittent release would call for LEV.\n\nQ = (q × K × 10⁶) ÷ (C − C₀) = (0.2 × 4 × 1,000,000) ÷ (100 − 0) = 800,000 ÷ 100 = 8,000 cfm。10⁶ 用于把 ppm 目标值换算为体积分数，K 为混合不均提供余量。只有在溶剂低毒且释放均匀时，才可采用这种规模的稀释通风；高毒或间歇性释放应改用局部排风。","related":[{"n":"18.6","t":"通风一般原则"}],"level":"calculation","topic":"Dilution Ventilation Rate"},{"text":"A local exhaust system serving a metal-grinding bench has a duct velocity of 1,500 fpm. Inspectors find dust accumulating in the horizontal duct run and reduced capture at the hood. What is the MOST likely cause?","group":3,"options":["Transport velocity is too low, so dust settles","Capture velocity at the hood is too high","The fan sits on the clean side of the filter","The duct is round rather than rectangular"],"correct":0,"explanation":"Transport velocity must keep particles suspended: roughly 3,000–4,000 fpm for light dusts and 4,000–5,000 fpm for heavy dusts, while gases and vapors need only about 1,000–3,000 fpm. At 1,500 fpm the metal dust settles, partly blocking the duct and reducing flow at the hood. The fan belongs on the clean side after the air cleaner, and round duct is preferred, so neither of those is the fault.\n\n输送速度必须使颗粒保持悬浮：轻粉尘约 3,000–4,000 fpm，重粉尘约 4,000–5,000 fpm，而气体和蒸气只需约 1,000–3,000 fpm。1,500 fpm 时金属粉尘会沉积，部分堵塞管道并降低罩口风量。风机本应位于净化器之后的洁净侧，圆管也更优，因此这两项都不是原因。","related":[{"n":"18.7","t":"局部排风"}],"level":"application","topic":"Duct Transport Velocity"},{"text":"A laboratory adds three fume hoods without adding supply air. Staff report that doors are hard to open, the gas-fired water heater back-drafts, and hood capture has worsened. What is the BEST explanation and correction?","group":3,"options":["The hoods are too close; space them farther apart","The stack is too short; extend it above the roof","Face velocity is too high; reduce the fan speed","Negative pressure from low makeup air; add supply air"],"correct":3,"explanation":"Every cubic foot exhausted must be replaced by makeup air; otherwise the building goes negative. Negative pressure causes back-drafting of combustion appliances (a CO hazard), difficult doors, infiltration of unconditioned air, and degraded hood performance because the hood must compete for air. The correction is to supply tempered, filtered makeup air at no less than about 90% of the exhaust volume. Reducing fan speed would drop face velocity below the 80–120 fpm range and worsen capture.\n\n排出的每一立方英尺空气都必须由补风补回，否则建筑会处于负压。负压会导致燃烧设备反抽（CO 危险）、门难开、未调节空气渗入，并使通风橱要与全楼争空气而性能下降。正确做法是提供经调温和过滤的补风，风量不低于排风的约 90%。降低风机转速会使面风速低于 80–120 fpm 范围，反而使捕集更差。","related":[{"n":"18.7","t":"局部排风"}],"level":"application","topic":"Makeup Air and Back-Drafting"},{"text":"A RULA assessment of a repetitive assembly task yields a grand score of 5. What action level does this represent, and what should happen next?","group":3,"options":["Action level 1 — acceptable posture, no action","Action level 3 — investigate and implement changes soon","Action level 2 — further investigation, changes may be needed","Action level 4 — investigate and implement changes immediately"],"correct":1,"explanation":"RULA scores map to action levels: 1–2 = AL1 (acceptable), 3–4 = AL2 (further investigation), 5–6 = AL3 (investigation and changes required soon), and 7+ = AL4 (changes required immediately). A score of 5 is therefore AL3 — schedule the investigation and redesign promptly, but it is not the immediate trigger reserved for 7 and above.\n\nRULA 分值与行动级别对应：1–2 为 AL1（可接受）、3–4 为 AL2（需进一步调查）、5–6 为 AL3（需尽快调查并改进）、7 及以上为 AL4（需立即改进）。因此 5 分属于 AL3——应尽快安排调查与再设计，但尚未达到 7 分以上才有的“立即”级别。","related":[{"n":"18.2","t":"RULA与REBA"}],"level":"application","topic":"RULA Action Level"},{"text":"A worker on a poultry line reports nighttime numbness and tingling in the thumb, index, and middle fingers, and has begun dropping objects. Which condition is most likely, and which control is most appropriate?","group":3,"options":["Epicondylitis; prescribe a counter-force brace and rest","Trigger finger; provide finger splints and anti-vibration gloves","Carpal tunnel syndrome; redesign tools and workstations to cut repetition and force","Thoracic outlet syndrome; restrict overhead work and add stretching"],"correct":2,"explanation":"Numbness and tingling in the median-nerve distribution (thumb, index, middle fingers) that wakes the worker at night is the classic presentation of carpal tunnel syndrome, associated with repetitive wrist motion, forceful gripping, and awkward wrist posture. The MSD hierarchy puts engineering controls first — tool and workstation redesign, reduced force and repetition — with administrative controls and then PPE as supplements. Epicondylitis affects the elbow, trigger finger causes catching or locking, and thoracic outlet syndrome involves the neck and shoulder.\n\n正中神经分布区（拇指、食指、中指）的麻木刺痛并在夜间加重，是腕管综合征的典型表现，与重复性腕部动作、用力握持和手腕不良姿势有关。MSD 控制层级以工程控制为先——工具与工位再设计、降低力量与重复——行政控制和 PPE 仅作补充。上髁炎在肘部，扳机指表现为手指卡顿或交锁，胸廓出口综合征累及颈肩。","related":[{"n":"18.3","t":"人因风险因素"}],"level":"application","topic":"Carpal Tunnel Syndrome"},{"text":"In the NIOSH Revised Lifting Equation, what are the coupling multiplier (CM) values for good, fair, and poor coupling?","group":3,"options":["1.00, 0.95, and 0.90","1.00, 0.90, and 0.80","0.95, 0.90, and 0.85","1.00, 0.85, and 0.75"],"correct":0,"explanation":"CM reflects hand-to-object coupling based on handle design and grasp quality: good = 1.00, fair = 0.95, poor = 0.90. It is the narrowest of the multiplier ranges but still matters: a poor grip on an otherwise ideal lift drops the RWL by 10%. The other sets are invented values.\n\nCM 反映手与物体的耦合质量（取决于手柄设计和抓握条件）：良好 = 1.00、一般 = 0.95、差 = 0.90。它是各乘数中变化幅度最小的，但仍有影响：在其他条件理想时，抓握差会使 RWL 下降 10%。其余数值组合是虚构的。","related":[{"n":"18.1","t":"NIOSH提举方程"}],"level":"recall","topic":"Coupling Multiplier Values"},{"text":"An engineer measures the maximum reach envelope of workers while they move tools along a bench. This measurement is an example of:","group":3,"options":["Static (structural) anthropometry","Biomechanical load analysis","Cumulative trauma screening","Dynamic (functional) anthropometry"],"correct":3,"explanation":"Static or structural anthropometry uses fixed-position measurements such as standing height or arm length. Dynamic or functional anthropometry measures the body in motion, including reach envelopes and clearance during movement, which is what a moving task requires. Biomechanics deals with forces and moments, and CTD screening is a health-outcome tool, not a measurement of body dimensions.\n\n静态（结构）人体测量使用固定姿势的尺寸，如身高、臂长。动态（功能）人体测量则测量运动中的身体，包括可达范围和运动中的间隙，这正是移动性任务所需要的。生物力学关注力与力矩；CTD 筛查是健康结果工具，不是人体尺寸测量。","related":[{"n":"18.4","t":"人体测量学"}],"level":"recall","topic":"Dynamic Anthropometry"}]
