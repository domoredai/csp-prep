<script>
CSPQuiz.init({
  quizId: 'practice-d4',
  quizTitle: 'D4 应急管理 强化训练 / Domain 4 Boost',
  quizTopic: 'Domain 4 — Emergency Management',
  containerId: 'quiz-root',
  questions: [{"text":"A machine shop with 18 employees keeps six portable fire extinguishers on the floor and trains selected employees to use them on incipient fires. The shop has no written emergency action plan. Which statement is correct under 29 CFR 1910.38?","group":1,"options":["No plan is needed unless the shop employs more than 25 people","A written emergency action plan is required because employees may use the portable extinguishers provided","A plan is required only if the local fire department inspects the building","No plan is needed because the shop has fewer than 20 employees"],"correct":1,"explanation":"An emergency action plan is triggered when another OSHA standard requires one, or when the employer provides portable fire extinguishers that employees may use to fight incipient fires (1910.38 with 1910.157). The classic exemption applies only where the employer has a total evacuation policy and no employee is permitted to use an extinguisher. Employee-count thresholds such as 25 do not appear in 1910.38; the 10-employee provision concerns oral rather than written communication.\n\n当另一项OSHA标准要求时，或雇主提供便携式灭火器且员工可以用其扑救初期火灾时，就必须制定应急行动计划（1910.38配合1910.157）。唯一典型的豁免情形是：雇主要求全部疏散且不允许员工使用灭火器。1910.38中并没有25人这样的门槛；10名员工的规定只涉及可以口头而非书面传达。","related":[{"n":"12.2","t":"应急行动计划"}],"level":"application","topic":"EAP Applicability"},{"text":"After a plant reorganization, the evacuation wardens, their radio channels, and two assembly areas changed. The written emergency action plan still shows the old wardens and old muster points. What is the correct compliance position?","group":1,"options":["The plan may stay unchanged until its next five-year revision","The plan only needs updating after an actual evacuation has failed","The plan must be updated only if the local fire marshal requests it","The plan must be reviewed and revised whenever the plan itself or employee responsibilities change"],"correct":3,"explanation":"29 CFR 1910.38 requires the employer to review the emergency action plan with each employee when the plan is developed, when the employee's responsibilities change, and when the plan changes. A reorganization that reassigns wardens and moves assembly areas is exactly such a change, so the plan must be revised promptly rather than on a fixed multi-year cycle. There is no five-year revision cycle in 1910.38, and waiting for an inspection or a failed drill defeats the purpose of the plan.\n\n29 CFR 1910.38要求：在计划制定时、员工职责变化时以及计划变更时，必须与每位员工一起审查应急行动计划。重组导致监护人和集合点改变，正属于此类变更，必须及时修订，而不能等到固定的多年周期。1910.38中没有五年修订周期，等到检查或演练失败才改也违背了计划的目的。","related":[{"n":"12.2","t":"应急行动计划"}],"level":"application","topic":"EAP Review Triggers"},{"text":"During a full evacuation, a supervisor at the assembly area counts 41 of 40 employees plus one contractor crew of three, but only two contractors are present. Smoke is now visible from the roof of the contractor's work area. What is the supervisor's BEST action?","group":1,"options":["Report the missing contractor to the incident commander and keep everyone at the assembly area","Send two employees back inside to search the contractor's work area","Wait ten minutes and re-count before notifying anyone","Release the employees to their vehicles so the parking lot can be cleared"],"correct":0,"explanation":"Accounting for all employees is a required EAP element, and the count only has value if the discrepancy is reported immediately to the incident commander, who then directs trained search-and-rescue or informs the fire department. Sending untrained employees back into a building with visible smoke creates additional victims, which is the classic failure mode in evacuation fatalities. Waiting delays rescue, and releasing people prevents any further accountability.\n\n清点所有员工是EAP的必需要素，而清点只有在差异立即报告给事故指挥官时才有意义，由指挥官派出受训的搜救人员或通报消防部门。派未受训员工返回已有可见烟雾的建筑，会造成更多伤亡，这是疏散死亡事故的典型失效模式。等待会延误救援，放人离开则使后续清点无法进行。","related":[{"n":"12.2","t":"应急行动计划"}],"level":"application","topic":"Evacuation Accounting"},{"text":"An EAP assigns two boiler operators to remain behind briefly to shut down a high-pressure steam header before they evacuate. Which required EAP element does this assignment satisfy?","group":1,"options":["Procedures for reporting fires and other emergencies","Procedures to account for all employees after evacuation","Procedures for employees who remain to operate critical plant operations before evacuating","Identification of employees designated to perform rescue and medical duties"],"correct":2,"explanation":"29 CFR 1910.38(c) requires procedures for employees who must remain to operate critical plant operations before they evacuate, such as shutting down a hazardous process or utility. Reporting procedures cover alarms and notification, accounting procedures cover head counts at the assembly area, and rescue and medical duties cover designated responders. Keeping a shutdown crew on the floor is specifically the critical-operations element.\n\n29 CFR 1910.38(c)要求制定程序，规定必须在疏散前留下来操作关键工厂运行的员工（例如关闭危险工艺或公用设施）。报警程序涉及报警与通知，清点程序涉及集合点人数核对，救援与医疗职责涉及指定的响应人员。留下关机小组正对应“关键操作”这一要素。","related":[{"n":"12.2","t":"应急行动计划"}],"level":"recall","topic":"EAP Critical Operations"},{"text":"A tornado warning is issued for a county that contains a 200,000-square-foot distribution warehouse with a wide-span steel roof, dock doors on both long walls, and racking throughout. Where should the workers shelter?","group":1,"options":["Inside the truck cabs at the loading dock so they can drive away afterward","In an interior reinforced masonry room such as a restroom or designated shelter area","Along the exterior wall between the racking rows, away from the aisles","Under the steel mezzanine stairs in the center of the storage floor"],"correct":1,"explanation":"Tornado shelter guidance calls for a small interior space on the lowest floor, surrounded by as many walls as possible, away from windows, exterior walls, and long-span roof areas. Wide-span metal roofs and dock doors are the first elements lost in a tornado, so exterior walls and truck cabs are among the worst choices. An interior reinforced masonry room or a pre-designated shelter area best protects occupants from flying debris and roof collapse.\n\n龙卷风避难原则是：到最低层、尽可能多墙围绕的小型内部空间，远离窗户、外墙和大跨度屋顶区域。大跨度金属屋顶和装卸门是龙卷风中最先破坏的部位，因此外墙和卡车驾驶室是最差的选择之一。内部钢筋混凝土房间或预先指定的避难区能最好地防护飞散碎片与屋顶坍塌。","related":[{"n":"12.1","t":"应急情况类型"}],"level":"application","topic":"Severe Weather Shelter"},{"text":"A rail tank car derails half a mile upwind of a plant and begins releasing chlorine. The plume is drifting steadily toward the plant, and the local fire department advises that evacuation routes are not yet established. What is the plant's BEST immediate action?","group":1,"options":["Evacuate all personnel through the main gate, which faces the release","Keep the HVAC running at full outside-air intake to dilute the gas indoors","Send employees home immediately in personal vehicles along local roads","Move personnel to interior rooms, shut down HVAC and seal openings, and monitor air"],"correct":3,"explanation":"For a toxic gas plume moving toward a building, shelter-in-place is the protective action: move people into interior spaces, shut down HVAC and close ventilation openings, seal gaps, and monitor air until authorities give the all-clear. Evacuating through the main gate or sending people out in vehicles would move them into or through the plume, and running HVAC at full outside-air intake would deliberately draw the contaminant inside.\n\n当有毒气体烟羽向建筑物移动时，正确防护行动是就地避难：人员进入内部房间，关闭暖通空调并封闭通风口，堵住缝隙，监测空气，直到当局宣布解除。经大门疏散或让员工驾车离开会把人员送入或穿过烟羽；而全开新风运行暖通空调则等于主动把污染物抽进室内。","related":[{"n":"12.1","t":"应急情况类型"}],"level":"application","topic":"Shelter-in-Place Decision"},{"text":"An employee reports hearing gunshots in an adjacent building of an office complex. Employees in the reporting building begin moving toward the fire alarm pull station. What should the facility emergency coordinator direct?","group":1,"options":["Pull the alarm so the entire complex evacuates into the parking lots","Direct everyone to the main lobby to wait for police instructions","Secure employees in lockable rooms, call 911, and avoid activating the fire alarm","Continue normal work until the police confirm the report"],"correct":2,"explanation":"Pulling a fire alarm during an active shooter event moves large numbers of people into corridors, stairs, and parking lots where they may meet the attacker and interfere with police movement. The protective actions are to run if a safe route exists, otherwise hide in a lockable room behind cover, and call 911 with as much detail as possible. Assembling in a lobby or continuing work leaves people exposed and uninformed.\n\n在活跃枪手事件中拉响火警，会把大量人员驱入走廊、楼梯和停车场，可能迎面遇到袭击者并妨碍警方行动。正确的防护行动是：有安全路线时尽快逃离，否则躲进可上锁房间并利用掩体，并拨打911提供尽可能详细的信息。在大厅集合或继续工作会使人员暴露且无从判断。","related":[{"n":"12.1","t":"应急情况类型"}],"level":"application","topic":"Active Shooter Response"},{"text":"A manufacturer has just finished writing a new all-hazards emergency plan and wants to validate the plan's logic and clarify roles before spending money on field operations. Which exercise type should be conducted FIRST?","group":1,"options":["A tabletop exercise with the key players walking through a scenario","A full-scale exercise with role players and mutual-aid agencies","A functional exercise that deploys all response equipment","No exercise, because the plan cannot be tested until an actual emergency occurs"],"correct":0,"explanation":"Exercises are built as a progressive sequence: discussion-based tabletop exercises first test plan logic, roles, and decision points at low cost, then functional exercises test specific functions, and only then do full-scale exercises deploy people and equipment. Jumping straight to a full-scale exercise wastes resources on a plan whose gaps have not yet been found. A plan can and must be tested through exercises rather than waiting for a real event.\n\n演练应循序渐进：先做基于讨论的桌面演练，以低成本检验计划逻辑、角色与决策点；再做功能演练检验特定功能；最后才做全面演练、实际部署人员与设备。直接上全面演练会把资源浪费在尚未发现缺陷的计划上。计划必须通过演练来检验，而不是等真实事件发生。","related":[{"n":"12.6","t":"应急演练"}],"level":"application","topic":"Exercise Selection"},{"text":"After a functional exercise, evaluators identified twelve shortfalls. Which document assigns each corrective action to a responsible party with a completion date and is tracked until closed?","group":1,"options":["The Incident Action Plan","The Improvement Plan issued with the After-Action Report","The Business Impact Analysis","The Emergency Operations Plan"],"correct":1,"explanation":"The After-Action Report captures observations against objectives, and the accompanying Improvement Plan converts each finding into a corrective action with an owner and a due date that is tracked to closure. The Incident Action Plan is the operational document for a single incident or operational period, the BIA quantifies business impacts, and the Emergency Operations Plan is the response framework itself. Without a tracked Improvement Plan, exercise findings are rarely corrected.\n\n事后报告（AAR）按演练目标记录观察结果，随附的改进计划（IP）把每项发现转化为纠正措施，明确负责人与截止日期并跟踪至关闭。事故行动计划是单次事故或单个作战周期的行动文件，业务影响分析用于量化业务影响，应急运作计划则是响应框架本身。没有可跟踪的改进计划，演练发现往往得不到纠正。","related":[{"n":"12.6","t":"应急演练"}],"level":"recall","topic":"Improvement Planning"},{"text":"A three-day hazardous materials incident requires tracking of responder hours, rented heavy equipment, contractor invoices, and two injury claims. Which ICS section is responsible for this function?","group":1,"options":["Planning","Logistics","Operations","Finance and Administration"],"correct":3,"explanation":"The Finance and Administration section tracks incident costs, timekeeping, procurement, contracts, and compensation or claims. Logistics obtains facilities, supplies, and services but does not own cost documentation, Operations directs tactical resources, and Planning develops the Incident Action Plan and maintains situation status. Cost recovery and claim documentation at a long incident are classic Finance and Administration duties.\n\n财务与行政处负责跟踪事故成本、考勤、采购、合同以及赔偿与索赔。后勤处负责获取设施、物资与服务，但不负责成本记录；行动处指挥战术资源；规划处制定事故行动计划并维护态势信息。长时间事故中的费用追偿与索赔记录正是财务与行政处的典型职责。","related":[{"n":"12.4","t":"事故指挥系统"}],"level":"recall","topic":"ICS Finance Section"},{"text":"A fire in a chemical warehouse involves the plant's emergency response team and three municipal fire departments. The plant manager and the ranking fire chief both arrive and both want to give orders to the same entry teams. How should command be organized?","group":1,"options":["The plant manager takes command because the plant owns the building","The fire chief takes command and the plant manager is excluded from decisions","The agencies form a Unified Command that sets joint objectives and approves one Incident Action Plan","A new Incident Commander is elected by a vote of all responding agencies"],"correct":2,"explanation":"Unified Command is used when several agencies or jurisdictions share responsibility for an incident; their representatives sit together, jointly set objectives, and approve a single Incident Action Plan while each retains authority over its own resources. There is still only one consolidated command, so competing chains of authority are eliminated. Neither ownership of the building nor rank alone decides command, and command is never decided by a vote.\n\n当多个机构或辖区共同承担事故责任时采用联合指挥：各机构代表共同议事、共同设定目标、批准单一的事故行动计划，同时各自保留对本机构资源的指挥权。指挥仍然是统一的一个，从而消除相互竞争的指挥链。指挥权不由建筑物所有权或单纯职级决定，更不能通过投票产生。","related":[{"n":"12.4","t":"事故指挥系统"}],"level":"application","topic":"Unified Command"},{"text":"A lab technician knocks over a 1-quart bottle of 10 percent sulfuric acid. Two trained employees absorb it with a spill kit and neutralize the residue in about five minutes, with no injury and no release to the environment. How should this event be classified under 29 CFR 1910.120?","group":1,"options":["An incidental release that does not require a HAZWOPER emergency response","An emergency response requiring a hazardous materials technician","An emergency response requiring full evacuation and National Response Center notification","An emergency response requiring a trained on-scene incident commander"],"correct":0,"explanation":"HAZWOPER excludes incidental releases of hazardous substances that can be absorbed, neutralized, or otherwise controlled at the time of release by employees in the immediate release area, or by maintenance personnel. A one-quart acid spill handled immediately with a spill kit is the textbook incidental release, so no emergency response organization, technician-level responder, or incident commander is required. Notification thresholds are also not met at this quantity and concentration.\n\nHAZWOPER不涵盖那种可由泄漏区域内员工或维修人员在泄漏当时吸收、中和或以其他方式控制的偶发泄漏。一夸脱酸液用泄漏处理包立即处理，正是教科书式的偶发泄漏，因此不需要启动应急响应组织、技术员级响应人员或事故指挥官。该数量与浓度也达不到通报阈值。","related":[{"n":"12.8","t":"危险废物作业与应急响应"}],"level":"application","topic":"Incidental Release"},{"text":"At a hazardous waste site the atmosphere is immediately dangerous to life or health, but the contaminants are not absorbed through the skin. Which EPA/OSHA response PPE level provides the required protection?","group":1,"options":["Level A, a fully encapsulating suit with SCBA","Level B, the highest level of respiratory protection with lesser skin protection","Level C, an air-purifying respirator with chemical-resistant clothing","Level D, ordinary work clothing with a hard hat and safety glasses"],"correct":1,"explanation":"Level B combines the highest available respiratory protection, such as SCBA or supplied air, with chemical-resistant clothing that provides less skin protection than a fully encapsulating suit. It is selected when the highest respiratory protection is needed but there is no significant skin absorption or splash hazard. Level A adds a fully encapsulating chemical protective suit, Level C uses an air-purifying respirator and is never acceptable in an IDLH atmosphere, and Level D is only a baseline work uniform.\n\nB级防护将可获得的最高呼吸防护（如自给式呼吸器或供气式呼吸器）与化学防护服相结合，但由于不是全封闭防护服，皮肤防护程度低于A级。当需要最高呼吸防护但不存在明显皮肤吸收或喷溅危害时选用B级。A级增加了全封闭化学防护服；C级使用过滤式呼吸器，绝不能用于IDLH环境；D级仅为基本工作服。","related":[{"n":"12.8","t":"危险废物作业与应急响应"}],"level":"recall","topic":"HAZWOPER PPE Levels"},{"text":"After a dust explosion, employees first learned about injuries at their own plant from a television news report broadcast before the company sent any internal message. What is the MOST important lesson for the crisis communication plan?","group":1,"options":["Employees should be instructed to say nothing if reporters call them at home","All internal communication should wait until the investigation report is final","The company should stop answering media questions until the cause is known","An internal notification system must deliver information to employees before external media do"],"correct":3,"explanation":"A core crisis communication principle is that employees should hear about an incident from their own organization first; otherwise rumor and anxiety fill the gap and trust erodes. The fix is a rapid internal notification system with pre-drafted messages and clear channels, not silence. Waiting for the final investigation or refusing to speak to the media at all simply lengthens the information vacuum.\n\n危机沟通的核心原则之一是：员工应首先从自己的组织获知事故消息；否则谣言与焦虑会填补空白，信任随之流失。解决办法是建立快速内部通知系统，配合预先起草的信息和明确的渠道，而不是沉默。等到调查报告最终完成或完全拒绝与媒体沟通，只会延长信息真空。","related":[{"n":"12.7","t":"危机沟通"}],"level":"application","topic":"Internal Crisis Communication"},{"text":"A reporter obtains the personal mobile number of the shipping supervisor and calls him directly for comment on a chemical release. The supervisor knows only that a tank was being unloaded when the alarm sounded. What should he do?","group":1,"options":["Give his personal account of what he saw so the company appears responsive","Speculate about the likely cause but ask not to be quoted by name","Politely refer the reporter to the designated spokesperson and say nothing further","Hang up without speaking and report the call to security"],"correct":2,"explanation":"Only the designated, trained spokesperson is authorized to speak for the organization, and all other employees refer media inquiries to that person. A supervisor who improvises or speculates can create statements the company must later retract and can prejudice the incident investigation or legal position. A polite referral with no further comment follows the protocol; hanging up or offering personal speculation does not.\n\n只有被指定并受过培训的发言人有权代表组织发言，其他员工应把媒体询问转交给他。主管若即兴发言或猜测，会产生公司日后不得不撤回的表述，并可能影响事故调查或法律立场。礼貌转交且不再多说符合规定；直接挂断或提供个人猜测都不符合。","related":[{"n":"12.7","t":"危机沟通"}],"level":"application","topic":"Designated Spokesperson"},{"text":"After a new compressor is installed, background noise in a utility room measures about 95 dBA. Workers there can no longer hear the building's fire alarm, although it works normally everywhere else. What is the MOST appropriate correction?","group":1,"options":["Add visual notification appliances and make the audible signal perceptible above the background noise","Give the workers earplugs and tell them to watch for smoke","Lower the alarm volume so it does not add to the noise exposure","Post a sign at the door stating that the alarm may not be heard in this room"],"correct":0,"explanation":"An alarm system must be distinctive, recognizable, and perceived by all employees, including those with hearing loss and those in high-noise areas. The standard remedy is to supplement the audible signal with visual notification appliances and to ensure the audible signal is perceptible above ambient noise. Hearing protection reduces the wearer's ability to hear alarms and must not be used as a substitute, and a posted warning leaves workers unprotected.\n\n报警信号必须独特、可识别，并能被所有员工感知，包括听力受损者和高噪声区域的人员。标准做法是增设视觉报警装置补充声音信号，并确保声音信号在环境噪声之上仍可感知。听力保护器会降低佩戴者听到报警的能力，不能作为替代；贴告示则使员工处于无保护状态。","related":[{"n":"12.2","t":"应急行动计划"}],"level":"application","topic":"Alarm Perception"},{"text":"A church sanctuary has a posted occupant load of 250 persons, all of whom exit along level corridors to the outside. What total egress width does NFPA 101 require?","group":2,"options":["25 inches","50 inches","75 inches","100 inches"],"correct":1,"explanation":"Required egress width equals occupant load times the capacity factor: 250 persons times 0.2 inch per person on a level surface equals 50 inches total. The 75-inch value comes from wrongly applying the 0.3 inch per person stairway factor, while 25 and 100 inches correspond to no recognized factor. Stairs require more width per person because occupants move more slowly and cautiously.\n\n所需疏散宽度等于人员负荷乘以容量因子：250人 × 水平面0.2英寸/人 = 总宽50英寸。75英寸来自错误地套用楼梯的0.3英寸/人系数，25英寸与100英寸则不对应任何公认系数。楼梯因人员移动更慢更谨慎，所以每人需要更多宽度。","related":[{"n":"13.2","t":"疏散设计"}],"level":"calculation","topic":"Egress Width Calculation"},{"text":"A training center has a calculated occupant load of 600 persons. Egress is provided through three exit doors, each with a 36-inch clear width, leading to level corridors. What do the calculations show?","group":2,"options":["Capacity is adequate because every door exceeds the 32-inch minimum clear width","Capacity is adequate because three separate exits are provided","Capacity is adequate only if all three doors swing outward","Capacity is inadequate because 108 inches are provided against the 120 inches required"],"correct":3,"explanation":"Required width is 600 times 0.2 inch per person, or 120 inches; the three 36-inch doors provide only 108 inches, so the egress capacity is short by 12 inches. Meeting the 32-inch minimum clear width and providing multiple exits are necessary but not sufficient, because each door must also contribute enough capacity. Door swing direction is a separate requirement and does not increase capacity.\n\n所需宽度为600 × 0.2英寸/人 = 120英寸；三扇36英寸门仅提供108英寸，缺口12英寸。满足每扇门32英寸最小净宽、以及设置多个出口都是必要条件而非充分条件，因为每扇门还必须贡献足够的通行能力。门开启方向是另一项要求，不会增加通行能力。","related":[{"n":"13.2","t":"疏散设计"}],"level":"calculation","topic":"Exit Capacity Check"},{"text":"An auditorium with an occupant load of 150 persons has a main egress door fitted with a standard round knob that requires a twist and pull to open. What does NFPA 101 require?","group":2,"options":["Panic hardware that releases with no more than 15 pounds of force","A second sign instructing occupants to turn the knob firmly","A door closer adjusted so the door opens automatically","No change, because the door is not a required exit"],"correct":0,"explanation":"Doors serving assembly occupancies with an occupant load of 100 or more must have panic hardware that unlatches with a maximum force of 15 pounds, so a panicking crowd can open the door by pushing. A round knob that must be turned defeats that purpose, and signage or a door closer does not solve the release-force problem. The main egress door is by definition a required exit.\n\n用于人员负荷100人及以上集会场所的门必须安装紧急推杆锁，最大开启力不超过15磅，使惊慌的人群靠推压即可开门。需要旋转的圆形门把手无法满足这一目的，标识或闭门器也不能解决开启力的问题。主疏散门本身就是必需出口。","related":[{"n":"13.2","t":"疏散设计"}],"level":"recall","topic":"Panic Hardware"},{"text":"A mixing room with 60 occupants stores flammable solvents in open containers. The only egress door currently swings inward, into the room. What is the correct requirement?","group":2,"options":["Inward swing is preferred so the door does not obstruct the corridor","A sliding door would satisfy the requirement more reliably","The door must swing in the direction of egress travel because of the occupant load and hazard","Swing direction is unregulated as long as the door opens easily"],"correct":2,"explanation":"Egress doors must swing in the direction of egress travel where the door serves 50 or more occupants or where high-hazard contents are present, so that a crowd pressing toward the door cannot be trapped against it. This room meets both conditions, so an inward-swinging door is a deficiency. Sliding doors are restricted for egress use, and swing direction is definitely regulated.\n\n当门服务50人及以上，或存在高风险内容物时，疏散门必须朝疏散行进方向开启，以免涌向门口的人群被门挡住无法逃生。该房间同时满足两个条件，因此内开门属于缺陷。疏散路径上对推拉门有严格限制，而开启方向确实是受监管的。","related":[{"n":"13.2","t":"疏散设计"}],"level":"application","topic":"Door Swing Direction"},{"text":"Which sequence correctly describes the four steps for using a portable fire extinguisher?","group":2,"options":["Aim, Pull, Sweep, Squeeze","Pull, Aim, Squeeze, Sweep","Pull, Aim, Sweep, Squeeze","Squeeze, Pull, Aim, Sweep"],"correct":1,"explanation":"The PASS sequence is Pull the pin, Aim the nozzle at the base of the fire, Squeeze the handle, and Sweep the agent side to side across the base of the fire. Aiming at the base rather than the flames, and sweeping rather than holding one spot, are what actually extinguish the fire. The other sequences put the steps out of order, for example squeezing before aiming.\n\nPASS顺序为：拔销（Pull）、将喷嘴对准火焰根部（Aim）、压下压把（Squeeze）、左右横扫喷射（Sweep）。对准根部而不是火焰本身，并横扫而非固定一点，才真正能灭火。其他顺序把步骤颠倒了，例如先压把后瞄准。","related":[{"n":"13.5","t":"便携式灭火器"}],"level":"recall","topic":"Extinguisher Operation"},{"text":"A cook working a bank of deep fryers must know how far away the Class K extinguisher may be mounted. What maximum travel distance does NFPA 10 allow from the cooking appliance?","group":2,"options":["75 ft","50 ft","45 ft","30 ft"],"correct":3,"explanation":"NFPA 10 limits the travel distance to a Class K extinguisher to 30 feet from cooking appliances, because a cooking-oil fire grows extremely fast and the appliance must be reached almost immediately. The 75-foot figure applies to Class A and Class D hazards, and 50 feet applies to Class B hazards up to 20-B; neither covers commercial cooking equipment. Faster access is the reason Class K distances are the shortest in the standard.\n\nNFPA 10规定到K类灭火器的行走距离不得超过距烹饪设备30英尺，因为食用油火灾蔓延极快，必须几乎立即到达设备。75英尺适用于A类和D类危害，50英尺适用于20-B及以下的B类危害；两者都不覆盖商用烹饪设备。正是这一更快速到达的要求，使K类的距离成为标准中最短的。","related":[{"n":"13.5","t":"便携式灭火器"}],"level":"recall","topic":"Class K Travel Distance"},{"text":"During a monthly inspection, an employee finds an extinguisher whose pressure gauge needle sits in the red overcharged zone, and the shell has a visible dent near the base. What is the correct action?","group":2,"options":["Remove it from service, tag it, and have it recharged or replaced","Return it to the bracket and note the reading on the tag","Shake the cylinder and recheck the gauge next month","Use it for training so the pressure is reduced"],"correct":0,"explanation":"An extinguisher with an out-of-range gauge or visible shell damage is not serviceable and must be removed from service, tagged, and recharged, repaired, or replaced by a qualified person. Recording the reading and leaving it in place risks having an unreliable unit at the moment of need. Shaking the cylinder does not correct pressure, and deliberately discharging a damaged cylinder is unsafe.\n\n压力表读数超出范围或外壳有可见损伤的灭火器不可使用，必须撤出使用、挂牌，并由合格人员重新充装、维修或更换。仅记录读数并留在原位会在需要时留下不可靠的器材。摇动筒体不能纠正压力，而故意排放受损钢瓶也不安全。","related":[{"n":"13.5","t":"便携式灭火器"}],"level":"application","topic":"Extinguisher Condition"},{"text":"A data center wants automatic sprinkler protection but cannot risk water discharge from a damaged head or a false trip. Which system requires both detection activation and individual head fusing before water enters the piping?","group":2,"options":["Wet pipe","Dry pipe","Pre-action","Deluge"],"correct":2,"explanation":"A pre-action system holds water back at a pre-action valve and admits water only after a detection system operates, with the individual sprinkler head also needing to fuse before discharge. That two-event design protects water-sensitive spaces such as data centers, museums, and libraries. Wet pipe always contains water, dry pipe protects against freezing rather than accidental discharge, and deluge opens all heads at once.\n\n预作用系统由预作用阀挡水，只有在探测系统动作后才允许水进入管道，同时还需单个喷头感温元件动作才会喷水。这种“双事件”设计保护对水敏感的空间，如数据中心、博物馆和图书馆。湿式系统管道常年充水；干式系统主要用于防冻而非防误喷；雨淋系统则同时开启全部喷头。","related":[{"n":"13.6","t":"喷淋系统"}],"level":"application","topic":"Pre-Action Sprinklers"},{"text":"A new production area has a measured ambient noise level of 78 dBA. Under NFPA 72, what is the minimum requirement for the public mode audible alarm signal in that area?","group":2,"options":["At least 5 dBA above the ambient level","A fixed minimum of 65 dBA regardless of ambient noise","At least 10 dBA above the ambient level","At least 15 dBA above ambient or 75 dBA, whichever is greater"],"correct":3,"explanation":"NFPA 72 requires public mode audible signals to be at least 15 dBA above the ambient sound level or at least 75 dBA, whichever is greater, so the signal is distinguishable from machine noise. With 78 dBA ambient, the signal must reach at least 93 dBA. Fixed values such as 65 dBA or margins of 5 or 10 dBA do not ensure perception above industrial background noise.\n\nNFPA 72要求公共模式声音信号至少比环境声级高15 dBA，或至少达到75 dBA，以较大者为准，从而能与机器噪声相区分。环境为78 dBA时，信号至少需达到93 dBA。固定65 dBA或仅高5、10 dBA的余量，无法保证在工业背景噪声中被感知。","related":[{"n":"13.3","t":"火灾报警"}],"level":"recall","topic":"Audible Notification"},{"text":"Which heat detection device responds to a rapid temperature increase of roughly 15 degrees F per minute and restores itself automatically after the temperature falls?","group":2,"options":["Fixed-temperature heat detector","Rate-of-rise heat detector","Ionization smoke detector","Photoelectric smoke detector"],"correct":1,"explanation":"A rate-of-rise detector actuates when the temperature climbs faster than a preset rate, typically about 15 degrees F per minute, and self-restores when conditions normalize. A fixed-temperature detector waits for a specific absolute temperature such as 135 F, so it is slower for a fast-growing fire. Ionization and photoelectric detectors respond to smoke particles rather than to heat.\n\n差温探测器在温度上升速率超过预设值（通常约每分钟15华氏度）时动作，条件恢复正常后可自动复位。定温探测器则要等到某个绝对温度（如135华氏度）才动作，对快速发展的火灾响应更慢。离子式和光电式探测器响应的是烟雾颗粒而非热量。","related":[{"n":"13.3","t":"火灾报警"}],"level":"recall","topic":"Rate-of-Rise Detection"},{"text":"A designer is locating manual fire alarm pull stations in a new building. What are the maximum travel distances to the nearest pull station?","group":2,"options":["200 ft in an unsprinklered building and 400 ft in a sprinklered building","75 ft in an unsprinklered building and 150 ft in a sprinklered building","100 ft in an unsprinklered building and 200 ft in a sprinklered building","400 ft in an unsprinklered building and 200 ft in a sprinklered building"],"correct":0,"explanation":"NFPA 72 permits up to 200 feet of travel to the nearest manual pull station in an unsprinklered building, and up to 400 feet where the building is protected by sprinklers because the sprinklers provide the primary detection. The shorter distances in the other options are not the code values, and the last option reverses the two figures. The logic is that a sprinklered building can tolerate longer travel because suppression begins automatically.\n\nNFPA 72允许在无喷淋建筑中到最近手动报警按钮的行走距离最远200英尺；在有喷淋保护的建筑中可放宽到400英尺，因为喷淋系统本身提供了主要探测功能。其他选项中的较短距离并非规范值，最后一个选项还把两个数字颠倒了。其逻辑是：有喷淋的建筑因自动灭火已启动，可容许更长的行走距离。","related":[{"n":"13.3","t":"火灾报警"}],"level":"recall","topic":"Manual Pull Stations"},{"text":"A 50 percent hydrogen peroxide solution is shipped by truck to a plating shop. Which DOT hazard class applies?","group":2,"options":["Class 3, flammable liquid","Class 8, corrosive","Class 5.1, oxidizer","Class 9, miscellaneous dangerous goods"],"correct":2,"explanation":"Concentrated hydrogen peroxide is classified as a Class 5.1 oxidizer because it readily yields oxygen and can intensify combustion, even though it is also corrosive at high concentration. Class 3 is reserved for liquids with a flash point at or below 60 C, which hydrogen peroxide does not have, and Class 8 covers the corrosives such as sulfuric acid and sodium hydroxide. Class 9 is for miscellaneous goods such as lithium batteries and dry ice.\n\n浓过氧化氢被划为第5.1类氧化剂，因为它容易释放氧并加剧燃烧，尽管高浓度时也具有腐蚀性。第3类针对闪点不超过60摄氏度的液体，过氧化氢并不符合；第8类涵盖硫酸、氢氧化钠等腐蚀品；第9类为锂电池、干冰等杂项危险品。","related":[{"n":"13.7","t":"DOT危险品"}],"level":"recall","topic":"Oxidizer Classification"},{"text":"A supplier delivers twenty 100-pound propane cylinders to a maintenance yard. Which DOT hazard class and placard apply?","group":2,"options":["Class 3, red placard with a flame","Class 4.1, red-and-white striped placard","Class 2.2, green non-flammable gas placard","Class 2.1, red flammable gas placard"],"correct":3,"explanation":"Propane is a liquefied flammable gas, so it falls in DOT Class 2.1, which uses a red placard bearing a flame symbol. Class 2.2 covers non-flammable, non-toxic gases such as nitrogen and is placarded green, while Class 2.3 covers toxic gases such as chlorine. Class 3 is for flammable liquids and Class 4.1 for flammable solids, neither of which applies to a compressed gas.\n\n丙烷是液化易燃气体，属DOT第2.1类，使用带火焰符号的红色标牌。第2.2类为非易燃、无毒气体（如氮气），标牌为绿色；第2.3类为氯气等毒性气体。第3类是易燃液体，第4.1类是易燃固体，都不适用于压缩气体。","related":[{"n":"13.7","t":"DOT危险品"}],"level":"recall","topic":"Flammable Gas Placard"},{"text":"The sprinkler control valve for an occupied warehouse must be closed for eight hours to repair a broken riser. What is the MOST appropriate action during the impairment?","group":2,"options":["Post a notice at the valve and continue normal operations","Implement impairment procedures, including a fire watch and notification of the fire department","Increase the warehouse heating setpoint to reduce fire risk","Delay the repair until the next scheduled shutdown period"],"correct":1,"explanation":"When a sprinkler system is taken out of service, NFPA 25 impairment procedures require notifying the fire department and insurer, establishing a fire watch in the affected area, and restoring protection as soon as possible. A posted notice alone leaves the building without suppression or early warning. Raising the thermostat does nothing for ignition risk, and postponing a broken riser repair leaves a known deficiency in place.\n\n喷淋系统停用时，NFPA 25的中断程序要求通知消防部门和保险人、在受影响区域设置防火巡查（fire watch），并尽快恢复保护。仅张贴通知会使建筑既无灭火也无早期报警。调高温度对点火风险无作用，而拖延破损立管的维修则使已知缺陷持续存在。","related":[{"n":"13.6","t":"喷淋系统"}],"level":"application","topic":"Sprinkler Impairment"}]
