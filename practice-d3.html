<script>
CSPQuiz.init({
  quizId: 'practice-d3',
  quizTitle: 'D3 风险管理 强化训练 / Domain 3 Boost',
  quizTopic: 'Domain 3 — Risk Management',
  containerId: 'quiz-root',
  questions: [{"text":"A steel-erection crew will lift loads over a walkway that remains open to plant personnel. The assessment team rates likelihood as 3 (Possible) and severity as 5 (Catastrophic). On the company's 1-5 by 1-5 matrix, what risk score applies to this lift?","group":1,"options":["8","15","20","25"],"correct":1,"explanation":"Risk score = likelihood x severity = 3 x 5 = 15. A score of 15 sits in the high or extreme band of a typical 5x5 matrix, so the lift should not proceed until additional controls are in place. Adding the two ratings gives 8, a common error; 20 and 25 would require a likelihood of 4 or 5.\n\n风险分值 = 可能性 × 严重性 = 3 × 5 = 15。在典型 5×5 矩阵中 15 属于高或极高区，因此在落实追加控制措施前不应起吊。把两项相加得到 8 是常见错误；20 与 25 需要可能性为 4 或 5。","related":[{"n":"9.3","t":"风险=可能性×严重性"},{"n":"9.4","t":"风险矩阵"}],"level":"calculation","topic":"Risk Score Calculation"},{"text":"Over the past 12 years a pallet conveyor has failed three times. Each failure costs about $80,000 in repair, lost production, and cleanup. What is the expected annual loss from this failure?","group":1,"options":["$8,000","$32,000","$80,000","$20,000"],"correct":3,"explanation":"The annual frequency is 3 / 12 = 0.25 failures per year, so expected annual loss = 0.25 x $80,000 = $20,000. This annualized figure is what a proposed control must be compared against. $80,000 is the cost of one event, and the other values come from misplacing the decimal or dividing instead of multiplying.\n\n年频率 = 3 ÷ 12 = 0.25 次/年，故预期年度损失 = 0.25 × 80,000 = 20,000 美元/年。拟议控制措施应与该年化数值比较。80,000 是单次损失，其余数值来自小数点错位或误用除法。","related":[{"n":"9.3","t":"风险=可能性×严重性"}],"level":"calculation","topic":"Annualized Expected Loss"},{"text":"A task is initially rated likelihood 5 and severity 4. After a machine-feeding interlock is installed, the team re-rates likelihood as 2 while severity stays at 4. By what percentage was the risk score reduced?","group":1,"options":["40%","50%","60%","75%"],"correct":2,"explanation":"Initial score = 5 x 4 = 20; residual score = 2 x 4 = 8. Reduction = (20 - 8) / 20 = 12 / 20 = 60%. Severity is unchanged because the interlock reduces the probability of entanglement but does not reduce the harm if entanglement still occurs.\n\n初始分值 = 5 × 4 = 20；残余分值 = 2 × 4 = 8。降幅 = (20 − 8) ÷ 20 = 60%。严重性未变，因为联锁降低的是卷入发生的可能性，一旦仍然发生，伤害程度不变。","related":[{"n":"9.8","t":"风险登记册"},{"n":"9.3","t":"风险=可能性×严重性"}],"level":"calculation","topic":"Residual Risk Reduction"},{"text":"A residual individual fatality risk of 9.9 x 10^-5 per year sits in the tolerable region. An engineering change costing $5 million would lower it to 9.8 x 10^-5 per year. What does ALARP require?","group":1,"options":["Decline the change as grossly disproportionate, record the justification, and revisit it if conditions change","Implement the change at once, because ALARP requires every available risk reduction","Stop the activity, because any risk above 1 x 10^-6 per year is intolerable","Ask the insurer to decide, because ALARP is fundamentally a financial test"],"correct":0,"explanation":"ALARP requires further reduction unless the sacrifice is grossly disproportionate to the benefit. Here $5 million buys about 1 x 10^-6 of annual fatality risk reduction, which is grossly disproportionate, so the measure is not required - but the judgement must be recorded and revisited. ALARP does not demand every conceivable measure, and 1 x 10^-6 per year is a broadly acceptable reference, not a stop line for a risk already in the tolerable band.\n\nALARP 要求继续降险，除非所付代价与收益明显不成比例。此处花 500 万美元仅消除约每年 1×10⁻⁶ 的致命风险，属明显不成比例，故不强制实施，但必须记录论证并定期复核。ALARP 不要求采取一切可想见的措施；10⁻⁶/年 是可广泛接受的参考值，而不是可容忍区风险的强制停工线。","related":[{"n":"9.6","t":"风险接受标准与ALARP"}],"level":"application","topic":"ALARP Gross Disproportion"},{"text":"After additional controls, a warehouse chemical exposure falls below the company's broadly acceptable threshold. The warehouse manager wants to cancel quarterly exposure monitoring and stop maintaining the ventilation system. What is the correct position?","group":1,"options":["Cancel both, because the risk is now acceptable","Maintain the controls and keep monitoring; no further reduction is required","Reclassify the chemical as eliminated from the process","Add more controls until the exposure risk reaches zero"],"correct":1,"explanation":"In the broadly acceptable region no further risk reduction is required, but existing controls must be maintained and monitored so the risk does not drift back up. Dropping ventilation maintenance would invalidate the assessment, and low exposure does not mean the chemical has been eliminated. ALARP is not a zero-risk standard.\n\n处于可广泛接受区域时无需进一步降险，但必须维持并监控现有控制，防止风险回升。停止通风维护会使评估失效；暴露水平低并不等于化学品已被消除。ALARP 并不是零风险标准。","related":[{"n":"9.6","t":"风险接受标准与ALARP"}],"level":"application","topic":"Broadly Acceptable Region"},{"text":"A punch press produces 103 dBA at the operator station. The plant can rotate operators, issue molded earplugs, build an acoustic enclosure, or replace the press with a servo-driven unit that removes the impact noise at source. Which choice best follows the hierarchy of controls?","group":1,"options":["Rotate operators between the press and other jobs","Issue molded earplugs to the press operators","Replace the press with a servo-driven unit that eliminates the impact noise at source","Build an acoustic enclosure around the existing press"],"correct":2,"explanation":"Replacing the impact mechanism with a quieter servo drive is substitution at the source, which ranks above engineering, administrative, and PPE controls. The enclosure is a valid engineering control but leaves the hazard in place, while rotation and earplugs depend on people and only reduce exposure. Select the highest feasible level, not the most familiar one.\n\n用更安静的伺服驱动替代冲击机构属于源头替代，层级高于工程控制、行政控制和 PPE。隔音罩是有效的工程控制，但危害依然存在；轮岗与耳塞依赖人的执行，且只降低暴露。应选可行的最高层级，而不是最熟悉的措施。","related":[{"n":"9.5","t":"控制层级"}],"level":"application","topic":"Noise Control Selection"},{"text":"A maintenance crew will apply a new epoxy coating inside a tank next week. The product is new to the site, the task is performed only once, and the crew has never used the application equipment. What should the safety professional do first?","group":1,"options":["Wait until the first application is finished and then observe the crew","Complete a JHA with the crew before the task is first performed","Issue respirators and let the crew start as scheduled","File the new SDS and rely on the manufacturer's recommendations"],"correct":1,"explanation":"New, infrequent, high-hazard work is the top priority for a JHA, and the analysis must be done before the task starts with the workers who will perform it. Observing afterwards is reactive, and an SDS or a respirator alone does not identify task-specific hazards such as tank entry or solvent vapor accumulation. Worker involvement is what surfaces the real steps and shortcuts.\n\n新增、不常做、高风险作业是 JHA 的最高优先级，且必须在作业开始前、与实际作业人员共同完成。事后观察属被动；仅凭 SDS 或呼吸器无法识别进入储罐、溶剂蒸气积聚等任务特有危害。工人的参与才能揭示真实步骤与变通做法。","related":[{"n":"9.7","t":"作业危害分析JHA"}],"level":"application","topic":"JHA for New Task"},{"text":"A JHA for a six-minute valve-replacement job lists 40 steps, many of them single hand movements. What is the best critique of this worksheet?","group":1,"options":["The 40 steps are appropriate, because more detail always helps","The JHA should be replaced by a compliance checklist","The task should be analyzed only after the first injury","The steps should be consolidated into about 10 to 15 logical steps"],"correct":3,"explanation":"A JHA breaks the job into logical steps, each describing a meaningful action; roughly 10 to 15 steps is a practical guide. Excessive fragmentation hides hazards in detail and makes the worksheet unusable in the field, while too few steps merges different exposures together. A checklist verifies known items and cannot substitute for task analysis.\n\nJHA 应把作业分解为有意义的逻辑步骤，通常 10–15 步较为实用。过度细分会让危害淹没在细节中，现场难以使用；步骤过少又会把不同暴露混在一起。检查表只能核对已知项目，不能替代任务分析。","related":[{"n":"9.7","t":"作业危害分析JHA"}],"level":"application","topic":"JHA Step Granularity"},{"text":"A risk register lists two open items. Risk A has an inherent score of 20 and a residual score of 5; Risk B has an inherent score of 12 and a residual score of 10. Which item should receive additional controls first, and why?","group":1,"options":["Risk B, because additional controls are prioritized on residual risk, which remains 10","Risk A, because its inherent score of 20 is the highest","Risk A, because inherent risk is always larger than residual risk","Neither, because both scores are below the maximum of 25"],"correct":0,"explanation":"Prioritization uses residual risk, the exposure that actually remains after existing controls, compared against acceptance criteria. Risk B's residual of 10 is higher than Risk A's 5, so B needs attention first even though A has the larger gross score. Inherent risk is recorded to show how much the controls achieved, not to rank current work.\n\n优先级依据残余风险，即现有控制之后实际剩余的暴露，并与接受标准比较。B 的残余分 10 高于 A 的 5，因此尽管 A 的固有分更高，仍应先处理 B。登记册保留固有风险是为了显示控制成效，而不是用于当前排序。","related":[{"n":"9.8","t":"风险登记册"}],"level":"application","topic":"Residual Risk Prioritization"},{"text":"A plant completed a risk assessment eight months ago and is now converting a batch mixing line to continuous operation. No incident has occurred and the insurance policy renews in June. What review action is required?","group":1,"options":["Only the annual scheduled review, because no incident has occurred","A triggered review, because the process change can introduce hazards that were not assessed","No review until the insurance policy renews in June","A review only if the regulator or insurer requests one"],"correct":1,"explanation":"A change in process, equipment, or materials is a classic trigger for reviewing a risk assessment, independent of the annual cycle. A batch-to-continuous conversion changes inventories, control philosophy, and operator tasks, so new hazards are likely. Incident history, insurance dates, and regulator requests are not the controlling criteria.\n\n工艺、设备或材料变更本身就是复审风险评估的典型触发条件，与年度周期无关。间歇改连续会改变物料存量、控制方案和操作任务，很可能引入新危害。事故史、保险日期和监管要求都不是这里的决定因素。","related":[{"n":"9.9","t":"监控与沟通"}],"level":"application","topic":"Review Trigger"},{"text":"A board asks for a defensible numerical estimate of the annual probability of a fatality from a proposed chlorine system, to compare against a 1 x 10^-6 per year criterion. Which approach fits the request?","group":1,"options":["A 5x5 risk matrix completed by site supervisors","A qualitative checklist review of the system","A quantitative risk assessment using fault tree and consequence models","A JHA for each operating task in the new system"],"correct":2,"explanation":"Comparing against a numerical criterion requires a quantitative method, typically fault tree analysis for the failure logic combined with consequence modelling. A 5x5 matrix and a checklist are qualitative or semi-quantitative and cannot produce an annual probability. A JHA identifies task hazards but does not quantify system risk.\n\n要与数值标准（如 10⁻⁶/年）比较，必须使用定量方法，通常用故障树分析处理失效逻辑并结合后果建模。5×5 矩阵与检查表属于定性或半定量，无法给出年度概率。JHA 识别任务危害，但不量化系统风险。","related":[{"n":"9.9","t":"评估方法"}],"level":"application","topic":"Quantitative Method Selection"},{"text":"A risk assessment team calculates a residual risk score of 12 for a task. The site criterion states that any score above 9 is unacceptable. What is the correct next step?","group":1,"options":["Implement additional controls and re-evaluate the residual risk before the task proceeds","Accept the risk because controls are already in place","Record the score and continue, since evaluation is only advisory","Raise the acceptance criterion to 12 so the item can be closed"],"correct":0,"explanation":"The evaluate step compares the analyzed risk with pre-set criteria; a residual of 12 against a limit of 9 means the risk is not acceptable, so further controls are required and the assessment is repeated. Accepting the score or moving the goalpost defeats the purpose of having criteria, and the evaluation drives real decisions rather than serving as advice.\n\n评估步骤是把分析出的风险与预定标准比较；残余 12 超过上限 9，说明风险不可接受，必须追加控制并重新评估。直接接受或修改标准会使标准失去意义；评估结论具有决策效力，而不是参考意见。","related":[{"n":"9.2","t":"风险评估五步流程"}],"level":"application","topic":"Evaluation Against Criteria"},{"text":"A new lockout procedure is issued as an English memo. Forty percent of the maintenance crew are Spanish speakers, and two near misses follow. What is the most effective corrective action?","group":1,"options":["Re-issue the same memo with a signed acknowledgement sheet","Post the memo on the notice board in the original language","Add the memo to the annual training file and record completion","Translate the content, confirm understanding, and involve the crew in reviewing the procedure"],"correct":3,"explanation":"Risk communication is a continuous two-way process, so comprehension must be verified rather than assumed. Translating the content and involving the crew in reviewing the procedure addresses both the language barrier and the practical shortcuts the memo missed. Signature sheets and posting do not prove that anyone understood the procedure.\n\n风险沟通是持续的双向过程，必须确认对方真正理解，而不是假定理解。用工人语言传达并让其参与程序评审，既解决语言障碍，也能发现程序与实际操作的脱节。签字表和张贴都不能证明理解。","related":[{"n":"9.9","t":"风险沟通"}],"level":"application","topic":"Two-Way Risk Communication"},{"text":"Two plants store the same flammable solvent. At Plant A, workers manually pour it from open drums in an occupied room. At Plant B, a closed transfer system is used and no one enters the room during transfer. Which statement is correct?","group":1,"options":["The closed-system plant has a different hazard because the chemical is handled differently","Both plants carry identical risk because they store the same solvent","The hazard is the same at both plants, but the risk is lower where the closed transfer system prevents exposure","The closed-system plant has no hazard because the transfer is automated"],"correct":2,"explanation":"The intrinsic hazard, a flammable solvent, is identical at both sites. Risk depends on exposure and the probability of ignition, both of which the closed system greatly reduces, so the risk differs even though the hazard does not. Automation alone never removes a hazard; only eliminating the material would do that.\n\n易燃溶剂这一固有危害在两个厂区完全相同。风险取决于暴露与点火概率，密闭输送大幅降低二者，因此风险不同而危害相同。仅靠自动化并不能消除危害，只有消除物料本身才算消除。","related":[{"n":"9.1","t":"危害与风险的区别"}],"level":"application","topic":"Same Hazard Different Risk"},{"text":"A contractor's 3x3 matrix rates a fall from a 6 m platform as Medium. The host employer's 5x5 matrix rates the same exposure as High. What is the best explanation and action?","group":1,"options":["The contractor is wrong, because a 5x5 matrix is always more accurate","The scales and criteria differ, so the ratings are not comparable; align them first","The two ratings should be averaged to settle the difference","The lower rating should be used to avoid conflict"],"correct":1,"explanation":"A risk matrix is semi-quantitative and its scales are defined by the organization, so a 3x3 Medium and a 5x5 High can describe the same exposure. Before comparing or ranking across organizations, the scales and acceptance criteria must be harmonized. Neither matrix is intrinsically more correct, and averaging or choosing the lower rating only hides the disagreement.\n\n风险矩阵是半定量工具，其量表由组织自行定义，因此 3×3 的“中”与 5×5 的“高”可能指同一暴露。跨组织比较或排序前必须先统一量表与接受标准。两种矩阵本身没有绝对对错；取平均或取低值只会掩盖分歧。","related":[{"n":"9.4","t":"风险矩阵"}],"level":"application","topic":"Matrix Calibration Mismatch"},{"text":"After applying every feasible control, the residual risk of a task remains in the intolerable region of the company matrix. Production pressure is high and the task is scheduled for tomorrow. What should the safety professional recommend?","group":1,"options":["Proceed, because every feasible control has already been applied","Rely on PPE to close the remaining gap","Reclassify the residual risk as tolerable and record the decision","Do not proceed; escalate to management to stop, redesign, or authorize"],"correct":3,"explanation":"Intolerable risk cannot be justified by having applied all available controls; the activity must be stopped, redesigned, or escalated for an explicit senior decision. PPE cannot move a risk out of the intolerable band, and relabelling a risk does not change it. Documenting the escalation also records that the professional acted on the assessment.\n\n不可容忍的风险不能因为“已用尽现有控制”而被合理化，必须停止、重新设计，或上报由最高管理层明确决策。PPE 无法把风险移出不可容忍区，改标签也不会改变风险。记录上报过程也能证明专业人员依据评估结果采取了行动。","related":[{"n":"9.6","t":"风险接受标准与ALARP"},{"n":"9.2","t":"风险评估五步流程"}],"level":"application","topic":"Residual Risk Still Intolerable"},{"text":"Why should risk acceptance criteria be defined before the risk assessment begins?","group":1,"options":["So ratings meet a consistent standard and decisions are defensible","To eliminate the need for monitoring, review, and reassessment","To guarantee that no residual risk remains after controls are applied","To replace consultation with the workforce during hazard identification"],"correct":0,"explanation":"Criteria set in advance tell the team what will count as acceptable, so ratings lead to consistent decisions and are not adjusted afterwards to fit a desired answer. They do not remove the need to monitor, cannot guarantee zero risk, and do not replace worker consultation. ISO 31000 treats risk criteria as an input to risk evaluation.\n\n事先设定标准，才能让评分对应一致的决策，避免事后为迎合结论而调整尺度。标准不能免除监控需要，也无法保证零风险，更不能替代与工人的协商。ISO 31000 将风险准则作为风险评估的输入。","related":[{"n":"9.2","t":"风险评估五步流程"},{"n":"9.6","t":"风险接受标准与ALARP"}],"level":"recall","topic":"Criteria Before Assessment"},{"text":"An FMEA team scores a pump seal failure mode: severity 8, occurrence 4, detection 3. What is the RPN?","group":2,"options":["96","15","108","128"],"correct":0,"explanation":"RPN = S x O x D = 8 x 4 x 3 = 96, just below the common action threshold of 100. The value 15 is the sum of the three ratings, while 108 and 128 come from mixing the factors. Even below the threshold, a severity of 8 should keep the item visible in the ranking.\n\nRPN = S × O × D = 8 × 4 × 3 = 96，略低于常用的行动阈值 100。15 是三项相加，108 与 128 来自因子混算。即使低于阈值，严重性 8 仍应让该条目保持在排序视野中。","related":[{"n":"10.2","t":"风险优先数RPN"}],"level":"calculation","topic":"RPN Calculation"},{"text":"A failure mode is scored severity 9, occurrence 6, detection 7. A design change cuts occurrence to 2 while severity and detection are unchanged. What is the revised RPN?","group":2,"options":["378","252","189","126"],"correct":3,"explanation":"Original RPN = 9 x 6 x 7 = 378; revised RPN = 9 x 2 x 7 = 126. The team must recompute the RPN after implementation to verify that the action actually reduced risk. 378 is the pre-action value, and the other figures come from changing the wrong factor.\n\n原 RPN = 9 × 6 × 7 = 378；修订后 RPN = 9 × 2 × 7 = 126。措施实施后必须重新计算 RPN，验证风险确实下降。378 是措施前的值，其余数字来自改错了因子。","related":[{"n":"10.3","t":"FMEA工作表与行动"},{"n":"10.2","t":"风险优先数RPN"}],"level":"calculation","topic":"Revised RPN After Action"},{"text":"Three failure modes are ranked on an FMEA worksheet: A has S=10, O=1, D=1 (RPN 10); B has S=6, O=6, D=6 (RPN 216); C has S=8, O=5, D=4 (RPN 160). Which should be addressed first?","group":2,"options":["Mode B, because it has the highest RPN of the three","Mode C, because its severity is 8 and its RPN is the second highest","Mode A, because a severity of 10 requires action regardless of its low RPN","Any of the three, because all RPNs are below 1000"],"correct":2,"explanation":"A severity of 9 or 10 means a hazardous effect, often without warning, and warrants action regardless of the RPN. Mode A's low occurrence and good detection cannot justify leaving a catastrophic failure mode unaddressed. Highest RPN is the general ranking rule, but severity overrides it.\n\n严重性 9 或 10 表示危险后果、往往无预警，无论 RPN 高低都必须处理。A 的发生度低、检测好，都不能成为不处理灾难性失效模式的理由。按 RPN 排序是一般规则，但严重性优先。","related":[{"n":"10.3","t":"FMEA工作表与行动"}],"level":"application","topic":"Severity Rule in FMEA"},{"text":"A fault tree AND gate has three independent basic events with probabilities 0.2, 0.3, and 0.1. What is the output probability?","group":2,"options":["0.0006","0.006","0.06","0.6"],"correct":1,"explanation":"For an AND gate all inputs must occur, so multiply: 0.2 x 0.3 x 0.1 = 0.006. AND gates model redundancy and therefore lower the probability. Adding the inputs would give 0.6, which describes an OR gate, not an AND gate.\n\n与门要求所有输入同时发生，故相乘：0.2 × 0.3 × 0.1 = 0.006。与门代表冗余，概率因此降低。把三者相加得 0.6 是与门的错误算法，那正是或门的结果。","related":[{"n":"10.4","t":"故障树分析FTA"}],"level":"calculation","topic":"AND Gate Probability"},{"text":"Two independent basic events with probabilities 0.05 and 0.02 feed an OR gate. What is the exact output probability?","group":2,"options":["0.001","0.049","0.069","0.07"],"correct":2,"explanation":"P(A or B) = P(A) + P(B) - P(A)P(B) = 0.05 + 0.02 - 0.001 = 0.069. The subtracted term removes the double-counted case where both events occur. 0.07 is the rare-event approximation, acceptable when probabilities are very small but slightly high here.\n\nP(A 或 B) = P(A) + P(B) − P(A)P(B) = 0.05 + 0.02 − 0.001 = 0.069。减去交集项，避免重复计算两者同时发生。0.07 是罕见事件近似值，概率极小时可用，此处略偏高。","related":[{"n":"10.4","t":"故障树分析FTA"}],"level":"calculation","topic":"OR Gate Probability"},{"text":"A top event occurs if both A and B fail, or if C fails alone. The probabilities are P(A)=0.1, P(B)=0.1 and P(C)=0.01, and the events are independent. What is the top event probability?","group":2,"options":["0.0199","0.011","0.02","0.0001"],"correct":0,"explanation":"TOP = (A AND B) OR C. First the AND branch: 0.1 x 0.1 = 0.01. Then the OR: 0.01 + 0.01 - (0.01 x 0.01) = 0.0199. Reduce AND branches before OR branches, and subtract the intersection so the case where both branches fail is not counted twice.\n\n顶事件 =（A 与 B）或 C。先算与门分支：0.1 × 0.1 = 0.01；再算或门：0.01 + 0.01 − 0.0001 = 0.0199。应先化简与门再处理或门，并减去交集，避免两分支同时失效被重复计算。","related":[{"n":"10.5","t":"组合故障树计算"}],"level":"calculation","topic":"Combined Fault Tree"},{"text":"An initiating event has probability 0.02. Safeguard 1 works with probability 0.95 and Safeguard 2 works with probability 0.90. A major release requires both safeguards to fail. What is the probability of a major release?","group":2,"options":["0.001","0.0005","0.019","0.0001"],"correct":3,"explanation":"Both safeguards must fail: P = 0.02 x (1 - 0.95) x (1 - 0.90) = 0.02 x 0.05 x 0.10 = 0.0001. Each branch multiplies the failure probabilities along its path. 0.019 is the probability that Safeguard 1 succeeds, not the major release path.\n\n两个防护都必须失效：P = 0.02 × (1 − 0.95) × (1 − 0.90) = 0.02 × 0.05 × 0.10 = 0.0001。每条路径的概率是沿路径各分支概率的乘积。0.019 是防护 1 成功的路径概率，不是重大泄漏路径。","related":[{"n":"10.6","t":"事件树分析ETA"}],"level":"calculation","topic":"Event Tree Path Probability"},{"text":"A fault tree has minimal cut sets {A, B} and {C}, with P(A)=0.02, P(B)=0.03 and P(C)=0.004. Using the rare-event approximation, what is the top event probability?","group":2,"options":["0.0006","0.004","0.0046","0.0052"],"correct":2,"explanation":"Each minimal cut set probability is the product of its events: {A, B} = 0.02 x 0.03 = 0.0006, and {C} = 0.004. The rare-event approximation sums them: 0.004 + 0.0006 = 0.0046. The single-event cut set {C} dominates, so improving C gives the largest reduction.\n\n每个最小割集的概率为其事件概率之积：{A, B} = 0.02 × 0.03 = 0.0006，{C} = 0.004。罕见事件近似将二者相加：0.004 + 0.0006 = 0.0046。单事件割集 {C} 占主导，因此改进 C 收益最大。","related":[{"n":"10.5","t":"组合故障树计算"}],"level":"calculation","topic":"Cut Set Probability"},{"text":"An FMEA of a cooling system with two pumps finds that no single component failure has a severe effect, so the team concludes overall risk is low. What important limitation applies to this conclusion?","group":2,"options":["FMEA cannot assign severity ratings to failure modes","FMEA reviews modes one at a time, so it can miss combinations","FMEA requires numerical probabilities for every basic event","FMEA applies only to software systems and controls"],"correct":1,"explanation":"FMEA is a bottom-up, single-failure technique: each mode is judged on its own effect, so two independent failures occurring together, or one cause defeating both pumps, may not surface. A fault tree built around the loss-of-cooling top event would expose those combinations and minimal cut sets. FMEA does assign severity, and it does not require probabilities.\n\nFMEA 是自下而上的单点失效方法，逐条评估失效模式的影响，因此两个失效同时发生、或一个共因同时打掉两台泵的情形可能被漏掉。以失去冷却为顶事件建立故障树可以揭示这些组合与最小割集。FMEA 会评严重性，也不要求概率数据。","related":[{"n":"10.1","t":"失效模式与影响分析"}],"level":"application","topic":"FMEA Limitation"},{"text":"A fault tree uses an AND gate for two redundant shutdown valves, each with failure probability 0.1, giving 0.01. Both valves are actuated from the same instrument-air header. What is the effect on that calculation?","group":2,"options":["The calculated probability is optimistic, because a single instrument-air failure can defeat both valves","The probability is unchanged, because two valves are two components","The probability is lower, because redundancy always improves the AND gate result","The gate should be changed to an OR gate to make the result conservative"],"correct":0,"explanation":"The AND gate formula assumes independence, but a shared instrument-air header is a common cause that can fail both valves at once. The true probability is therefore higher than 0.01, and the barrier pair should be redesigned for independence or modelled with a common-cause term. Switching to an OR gate would be an arbitrary change that misrepresents the logic.\n\n与门公式假设各事件独立，但共用仪表空气总管是共因，可同时使两个阀失效。因此真实概率高于 0.01，应重新设计以保证独立性，或在模型中引入共因项。随意改成或门会歪曲逻辑关系。","related":[{"n":"10.4","t":"故障树分析FTA"}],"level":"application","topic":"Common-Cause Failure"},{"text":"In a minimal cut set containing three basic events, what happens if one of those events is removed?","group":2,"options":["The top-event probability doubles, because one path was removed","The cut set is converted into an AND gate with the same events","The top event becomes certain, because the path is broken","The remaining events no longer form a cut set for that path"],"correct":3,"explanation":"By definition a minimal cut set contains no subset that is itself a cut set, so removing any one event breaks that path. This is what makes minimal cut sets the critical failure paths worth ranking. The probability does not double and no gate type changes.\n\n根据定义，最小割集不包含仍是割集的子集，因此去掉任一事件该路径即不成立。正因如此，最小割集才是值得排序的关键失效路径。概率不会翻倍，门的类型也不会改变。","related":[{"n":"10.4","t":"故障树分析FTA"}],"level":"recall","topic":"Minimal Cut Set Property"},{"text":"In a fault tree diagram, what does a circle represent?","group":2,"options":["An intermediate event produced by a logic gate","An undeveloped event that is not analyzed further","A basic event at the bottom of the tree","A transfer symbol to another part of the tree"],"correct":2,"explanation":"A circle is a basic event, a root cause that is not developed further. Rectangles are intermediate events (gate outputs), diamonds are undeveloped events, and triangles are transfer symbols. Confusing the circle with the diamond is a common exam error.\n\n圆形表示基本事件——不再展开的根本原因。矩形是中间事件（门的输出），菱形是未展开事件，三角形是转移符号。把圆形与菱形混淆是常见失分点。","related":[{"n":"10.4","t":"故障树分析FTA"}],"level":"recall","topic":"FTA Symbols"},{"text":"Before releasing a new valve actuator design, an engineering team must review each component, list how it could fail, and rank the modes for corrective action. Which technique fits best?","group":2,"options":["Fault tree analysis, because it works backward from a top event","FMEA, because it reviews each component's failure modes and ranks them by RPN","Event tree analysis, because it follows safeguards to outcomes","Bow-tie analysis, because it displays barriers"],"correct":1,"explanation":"The task is a component-by-component, bottom-up review that ends in a ranked action list, which is exactly FMEA. FTA starts from a defined top event and finds combinations of causes; ETA works forward from an initiating event; bow-tie communicates barriers. None of those produces a component-level ranking.\n\n该任务是逐组件、自下而上的审查，并输出排序后的措施清单，正是 FMEA 的用途。FTA 从既定顶事件反推原因组合；ETA 从初始事件向前推演；蝴蝶结用于屏障沟通。它们都不产生组件级排序。","related":[{"n":"10.9","t":"技术选择"}],"level":"application","topic":"Technique Selection FMEA"},{"text":"A failure mode is scored S=9, O=3, D=8. Which set of recommended actions is most consistent with FMEA practice?","group":2,"options":["Reduce occurrence by design change and improve detection with automated testing","Reduce severity by rewriting the severity scale definitions","Lower the RPN action threshold until the item qualifies for action","Raise the detection rating to 10 so the item stands out in the ranking"],"correct":0,"explanation":"Recommended actions target occurrence (remove the cause) or detection (catch it earlier), because severity is usually fixed by the design. Rewriting scales or thresholds manipulates the numbers without reducing risk, and raising the detection rating makes the score worse, not better. A severity of 9 also requires action in its own right.\n\n建议措施针对发生度（消除原因）或检测度（更早发现），因为严重性通常由设计决定、难以改变。改量表或阈值只是操纵数字，并未降低风险；把检测评分提高到 10 反而使评分更差。严重性 9 本身也要求采取措施。","related":[{"n":"10.3","t":"FMEA工作表与行动"}],"level":"application","topic":"FMEA Action Selection"},{"text":"An FMEA worksheet for a conveyor records 'belt slips' as one entry, 'conveyor speed drops' as another, and 'worn tensioner' as a third. In FMEA terms, what is 'belt slips'?","group":2,"options":["The failure effect","The failure cause","The detection control","The failure mode"],"correct":3,"explanation":"The failure mode is the manner in which the item fails, here the belt slipping. 'Worn tensioner' is the cause, 'conveyor speed drops' is the effect on the system, and a detection control would be an inspection or sensor. Keeping these columns distinct is essential to consistent scoring.\n\n失效模式是物件失效的方式——此处为皮带打滑。“张紧轮磨损”是原因，“输送速度下降”是对系统的影响，检测控制则是检查或传感器。三列区分清楚才能保证评分一致。","related":[{"n":"10.1","t":"失效模式与影响分析"}],"level":"application","topic":"Failure Mode Classification"},{"text":"A plant sets an FMEA action threshold of RPN 100. One mode scores 96 and another 210, and a supervisor proposes lowering the threshold to 90 so the 96 item is captured. What is the best response?","group":2,"options":["Lower the threshold to 90 so the item is captured","Keep the threshold but rank all modes and act on severity 9 or 10","Raise the threshold to 250 to reduce the review workload","Abandon RPN and rank failure modes by occurrence alone"],"correct":1,"explanation":"The RPN threshold is a relative screening aid, not a precise decision line, so the answer is to rank all modes and apply the severity override rather than move the line to fit one item. Adjusting the threshold to capture a single mode undermines consistency across worksheets. Occurrence alone ignores severity and detection.\n\nRPN 阈值只是相对筛查工具，不是精确判定线，正确做法是对所有失效模式排序，并对严重性 9/10 单独设规则，而不是移动阈值去套某一项。为单项调整阈值会破坏各工作表之间的一致性。只看发生度会忽略严重性与检测度。","related":[{"n":"10.3","t":"FMEA工作表与行动"}],"level":"application","topic":"RPN Threshold Use"},{"text":"A team proposes adding cost as a fourth multiplier in the RPN so that expensive failures rank higher. Why is this inappropriate?","group":2,"options":["It is acceptable, provided every mode uses the same cost scale","It is required by the standard FMEA procedure for all modes","It is incorrect: RPN is S x O x D, and a fourth factor destroys comparability","It is acceptable only for failure modes with severity 10"],"correct":2,"explanation":"RPN is defined as severity x occurrence x detection on 1-10 scales, giving a 1-1000 range that can be compared across teams and worksheets. Cost belongs in the business case or action prioritization discussion, not in the index itself, because a fourth factor makes the score incomparable with published scales. Consistency is the whole point of the metric.\n\nRPN 定义为严重性 × 发生度 × 检测度，各按 1–10 分，结果 1–1000，便于跨团队、跨工作表比较。成本应放在商业论证或措施优先级讨论中，而不是塞进指数，否则评分无法与通用量表比较。该指标的价值就在于一致性。","related":[{"n":"10.2","t":"风险优先数RPN"}],"level":"application","topic":"RPN Definition"},{"text":"A general liability policy carries a $500 deductible per claim. The plant has four covered claims this year, averaging $3,000 each. How much does the insured pay out of pocket for these claims?","group":3,"options":["$500","$1,500","$2,000","$12,000"],"correct":2,"explanation":"The deductible applies to each claim: 4 x $500 = $2,000 retained by the insured. The insurer pays the remaining $10,000 of the $12,000 total. $500 is a single deductible and $12,000 is the gross claim value before the insurer's share.\n\n免赔额按每笔索赔计：4 × 500 = 2,000 美元由被保险人自付。保险人在 12,000 美元总损失中赔付其余 10,000 美元。500 是单笔免赔额，12,000 是赔付前的总损失。","related":[{"n":"11.8","t":"保险概念"}],"level":"calculation","topic":"Insurance Deductible"},{"text":"A plant estimates expected annual fire losses of $50,000. Full insurance costs $70,000 per year in premium. Self-insuring through a captive would cost $8,000 per year in administration plus the expected losses. On a purely expected-cost basis, what is the annual cost of each option?","group":3,"options":["Retention $58,000; transfer $70,000","Retention $50,000; transfer $70,000","Retention $78,000; transfer $70,000","Retention $58,000; transfer $58,000"],"correct":0,"explanation":"Retention cost = $50,000 expected losses + $8,000 administration = $58,000, versus $70,000 for full transfer, a $12,000 difference. Expected cost alone does not decide the issue, however: retention leaves the organization exposed to a single large loss and requires capital, which is why low-frequency, high-severity risk is usually transferred.\n\n保留成本 = 50,000 预期损失 + 8,000 行政费 = 58,000 美元；完全转移为 70,000 美元，相差 12,000 美元。但仅看预期成本不足以决策：保留会让组织暴露于单次巨额损失并占用资本，因此低频高严重风险通常选择转移。","related":[{"n":"11.6","t":"风险财务五大策略"}],"level":"calculation","topic":"Retention vs Transfer Cost"},{"text":"A boiler explosion is expected once in 25 years, with total losses estimated at $5 million per event. What is the expected annual loss?","group":3,"options":["$50,000","$200,000","$250,000","$2,000,000"],"correct":1,"explanation":"Expected annual loss = loss per event x annual frequency = $5,000,000 x (1/25) = $200,000 per year. This figure is compared against insurance premiums and control costs. $2,000,000 and $50,000 come from using the wrong divisor.\n\n预期年度损失 = 单次损失 × 年频率 = 5,000,000 × (1/25) = 200,000 美元/年。该数值用于与保费和控制成本比较。2,000,000 与 50,000 分别来自错误的除数。","related":[{"n":"11.6","t":"风险财务五大策略"}],"level":"calculation","topic":"Expected Annual Loss"},{"text":"During a HAZOP on a reactor node, the team applies the guideword More to the parameter Temperature and records the deviation 'higher temperature than design intent'. What should the team do next?","group":3,"options":["Re-score the deviation with an RPN and move to the next guideword","Confirm the reactor design pressure before continuing the node","Stop the study and request a design change for the reactor","Identify causes and consequences, list safeguards, and recommend action"],"correct":3,"explanation":"The HAZOP cycle moves from deviation to causes, consequences, existing safeguards, and recommendations, all recorded on the worksheet. Replacing that with an RPN score changes the method, and stopping the study or checking one design value does not complete the analysis. Recommendations follow only after safeguards are judged inadequate.\n\nHAZOP 的流程是由偏差推进到原因、后果、现有防护与建议，并记录在工作表上。改用 RPN 评分会偏离方法本身；中断研究或只核对某个设计值都不能完成分析。只有在判定防护不足后才提出建议。","related":[{"n":"11.1","t":"危害与可操作性研究"}],"level":"application","topic":"HAZOP Deviation Follow-Up"},{"text":"A HAZOP team defines one node covering the whole unit from the feed drum to the product tank. What is the main problem with this approach?","group":3,"options":["HAZOP requires at least twenty nodes per study","The node is too broad, so causes and safeguards become vague; split it","Each node must contain exactly one pipe or line","Large nodes shorten the study without any loss of quality"],"correct":1,"explanation":"Nodes are sized so that a deviation can be traced through specific equipment and lines. One unit-wide node produces generic causes and unspecific safeguards, and important equipment-level deviations are missed. There is no minimum node count, and a node is not limited to a single pipe.\n\n划分节点是为了让偏差能对应到具体设备与管线。整单元作为一个节点会得到笼统的原因和防护，遗漏设备级偏差。规范没有节点数量下限，节点也不限于单根管道。","related":[{"n":"11.3","t":"HAZOP团队与工作表"}],"level":"application","topic":"HAZOP Node Definition"},{"text":"A company can afford one full HAZOP for a new process unit that is now in detailed design. When is the study most cost-effective?","group":3,"options":["During detailed design, because design changes are least costly before construction","After startup, using actual operating data from the unit","After the first incident reveals the real failure modes","Only at the five-year revalidation required by PSM"],"correct":0,"explanation":"HAZOP is most valuable at the design stage, where recommendations can still be incorporated into drawings at low cost. Studies after startup or after an incident identify problems that are far more expensive to correct, and a revalidation is a check, not a first study. The five-year cycle is a PSM minimum, not an optimum.\n\nHAZOP 在设计阶段价值最高，此时建议仍能以低成本纳入图纸。投产后或事故后再做，整改代价高得多；再验证只是复核，不是首次研究。五年周期是 PSM 的最低要求，不是最佳时机。","related":[{"n":"11.3","t":"HAZOP团队与工作表"}],"level":"application","topic":"HAZOP Timing"},{"text":"A HAZOP team includes the process engineer, instrument engineer, and safety specialist, but no operations representative. What is the most likely consequence?","group":3,"options":["The study is invalid because operators must lead the team","Nothing, because the process engineer knows how the plant is designed","Actual operating practices may be missed; add an operations representative","The scribe can cover the operations role during the study"],"correct":2,"explanation":"Operators know how the plant is actually run, including the deviations and workarounds that design documents do not show. Without them, the team may assess the design as intended rather than as operated. The leader facilitates method rather than representing operations, and the scribe records rather than contributes operating knowledge.\n\n操作人员了解装置实际如何运行，包括设计文件未体现的偏差与变通做法。缺少操作代表，团队评估的是“设计意图”而非“实际运行”。主持人的职责是保证方法，记录员只负责记录，都不能替代操作经验。","related":[{"n":"11.3","t":"HAZOP团队与工作表"}],"level":"application","topic":"HAZOP Team Composition"},{"text":"A bow-tie for loss of containment credits two preventive barriers: a high-pressure alarm and an automatic shutdown. Both are implemented in the same PLC with a single power supply. What is the main weakness?","group":3,"options":["Nothing, because two barriers always provide redundancy","Both share a PLC and power supply, so a single failure disables both","Alarms are always mitigative rather than preventive barriers","A bow-tie requires at least three barriers on each side"],"correct":1,"explanation":"Barrier independence is one of the four effectiveness criteria, and common-mode dependencies defeat it. If one PLC failure removes both the alarm and the shutdown, the left side of the bow-tie collapses to a single barrier. Adding a barrier that shares the same control platform does not add real protection.\n\n屏障独立性是四项有效性标准之一，共因依赖会破坏它。若一次 PLC 故障同时导致报警与停车失效，蝴蝶结左侧实际上只剩一道屏障。新增与原有屏障共用同一控制平台的措施，并不能带来真正的保护。","related":[{"n":"11.4","t":"蝴蝶结分析"}],"level":"application","topic":"Bow-Tie Common Cause"},{"text":"A deluge system is credited as a mitigative barrier in a bow-tie, but it has not been flow-tested in four years and there is no test procedure. Which barrier effectiveness criterion is most clearly failing?","group":3,"options":["Adequacy","Independence","Cost-effectiveness","Auditability"],"correct":3,"explanation":"Auditability asks whether barrier effectiveness can be verified by testing or inspection; no test procedure and a four-year gap fail that test. Adequacy asks whether the barrier addresses the specific consequence, and independence asks whether it shares a failure mode with other barriers. Cost is not one of the four criteria.\n\n可审核性考察屏障有效性是否可通过测试或检查验证；没有测试程序且四年未试验，显然不满足。充分性考察是否针对特定后果，独立性考察是否与其他屏障共因。成本不属于四项标准。","related":[{"n":"11.4","t":"蝴蝶结分析"}],"level":"application","topic":"Barrier Auditability"},{"text":"Why is a bow-tie diagram particularly useful for training the workforce on barrier management?","group":3,"options":["Because it calculates numerical probabilities for each threat","Because it replaces the need for written operating procedures","Because it links threats, barriers, and consequences on one page","Because it ranks failure modes by RPN for action"],"correct":2,"explanation":"The single-page diagram shows what can go wrong, which barriers prevent it, and which barriers limit the consequences, so workers can see where they fit. A bow-tie is qualitative and does not compute probabilities or produce RPNs, and it supports rather than replaces procedures.\n\n单页图清楚显示可能出什么错、哪些屏障防止发生、哪些屏障限制后果，工人因此能看到自己的位置。蝴蝶结是定性工具，不计算概率、不产生 RPN，而且是程序的补充而非替代。","related":[{"n":"11.4","t":"蝴蝶结分析"}],"level":"application","topic":"Bow-Tie Communication"},{"text":"A construction contract requires the subcontractor to indemnify and hold the owner harmless for injuries to the subcontractor's own employees. This arrangement is best classified as:","group":3,"options":["Risk transfer by contract","Risk retention","Risk avoidance","Loss reduction"],"correct":0,"explanation":"Indemnification and hold-harmless clauses shift financial responsibility to another party, which is contractual risk transfer. They do not remove the hazard or reduce injuries, and the owner may still face regulatory and reputational exposure. Retention would mean the owner keeps the loss, and avoidance would mean not doing the work.\n\n赔偿与免责条款把财务责任转移给另一方，属于合同风险转移。它既不消除危害也不减少伤害，业主仍可能面临监管与声誉风险。保留是业主自担损失，规避则是不做这项作业。","related":[{"n":"11.6","t":"风险财务五大策略"}],"level":"application","topic":"Contractual Risk Transfer"},{"text":"Which action is an example of risk avoidance rather than loss prevention or loss reduction?","group":3,"options":["Adding interlocked guards to a press","Training operators on lockout procedures","Installing a fire suppression system","Discontinuing the solvent-based process that creates the exposure"],"correct":3,"explanation":"Stopping the activity that generates the risk is avoidance, the most definitive strategy because the exposure no longer exists. Guards and training are loss prevention (they lower likelihood), and suppression is loss reduction (it lowers severity). Those measures leave the activity in place.\n\n停止产生风险的活动属于规避，是最彻底的策略，因为暴露不再存在。防护罩与培训属于损失预防（降低可能性），灭火系统属于损失减少（降低严重性），这些措施都保留了该活动。","related":[{"n":"11.6","t":"风险财务五大策略"}],"level":"application","topic":"Avoidance vs Loss Prevention"},{"text":"A distribution company operates 300 vans and records frequent minor parking damage averaging $1,500 per event. Which risk financing approach fits this exposure best?","group":3,"options":["Transfer all of it with a zero-deductible policy","Retain the exposure through a deductible and a funded self-insurance reserve","Avoid the activity by eliminating the fleet","Purchase professional liability coverage"],"correct":1,"explanation":"High-frequency, low-severity losses are poor candidates for insurance because administration and premium loading exceed the expected loss, so retention through a deductible or self-insurance fund is appropriate. A zero-deductible policy pays for predictable small losses at high cost, and professional liability covers negligence claims, not vehicle damage.\n\n高频低严重损失不适合投保，因为管理与附加费用会超过预期损失，因此采用免赔额或自保基金保留更合适。零免赔保单以高成本承担可预测的小额损失；职业责任险承保的是疏忽索赔，而非车辆损坏。","related":[{"n":"11.6","t":"风险财务五大策略"},{"n":"11.8","t":"保险概念"}],"level":"application","topic":"Retention for Frequent Minor Losses"},{"text":"An insurer requires documented verification that 250 statutory safety items are present at each of 12 sites, using a repeatable routine inspection. Which technique is most appropriate?","group":3,"options":["HAZOP","Fault tree analysis","Checklist analysis","Event tree analysis"],"correct":2,"explanation":"A checklist is fast, repeatable, and directly comparable across sites, which is exactly what compliance verification needs. Its limitation is that it only finds hazards on the list, so it should be paired with a technique such as SWIFT where novel hazards are possible. HAZOP, FTA, and ETA answer different questions at much higher resource cost.\n\n检查表快速、可重复、便于跨场地比较，正符合合规核验的需要。其局限是只能发现清单上的项目，因此在可能存在新危害时应配合 SWIFT 等方法。HAZOP、FTA、ETA 回答的是不同问题，资源投入也高得多。","related":[{"n":"11.5","t":"SWIFT、What-If与检查表"}],"level":"application","topic":"Checklist for Compliance"},{"text":"Which HAZOP guideword describes a complete substitution, such as the wrong material flowing instead of the intended feed?","group":3,"options":["Other Than","As Well As","Part Of","Reverse"],"correct":0,"explanation":"Other Than means complete substitution: something else entirely is present, such as the wrong chemical or a maintenance error connecting the wrong line. As Well As adds an extra component, Part Of removes a component, and Reverse means flow or action opposite to design intent.\n\n“其他”表示完全替代——出现了完全不同的东西，如错料或检修接错管线。“以及”是多了额外组分，“部分”是缺少组分，“反向”是与设计意图相反的流向或动作。","related":[{"n":"11.2","t":"HAZOP引导词与参数"}],"level":"recall","topic":"Guideword Other Than"},{"text":"In terms of analysis technique, the left and right sides of a bow-tie diagram correspond respectively to:","group":3,"options":["ETA on the left and FTA on the right","FMEA on the left and HAZOP on the right","HAZOP on the left and FMEA on the right","FTA on the left and ETA on the right"],"correct":3,"explanation":"The left side traces threats and preventive barriers toward the top event, which is deductive cause analysis like FTA. The right side follows mitigative barriers from the top event to consequences, which is inductive outcome analysis like ETA. HAZOP and FMEA are not the structural basis of the diagram.\n\n左侧从威胁与预防性屏障指向顶事件，属于类似 FTA 的演绎原因分析；右侧从顶事件经减缓性屏障推演到后果，属于类似 ETA 的归纳后果分析。HAZOP 与 FMEA 不是该图的结构基础。","related":[{"n":"11.4","t":"蝴蝶结分析"},{"n":"10.7","t":"FMEA/FTA/ETA对比"}],"level":"recall","topic":"Bow-Tie Structure"}]
});
