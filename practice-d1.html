<script>
CSPQuiz.init({
  quizId: 'practice-d1',
  quizTitle: 'D1 安全原理高级应用 强化训练 / Domain 1 Boost',
  quizTopic: 'Domain 1 — Advanced Application of Safety Principles',
  containerId: 'quiz-root',
  questions: [{"text":"A foundry that previously mixed its own molding sand now buys pre-blended sand delivered in sealed totes, so the dusty manual mixing step no longer exists anywhere on site. Which level of the hierarchy of controls has been achieved?","group":1,"options":["Substitution","Engineering control","Elimination","Administrative control"],"correct":2,"explanation":"The mixing task and its dust exposure were removed from the site entirely, so the hazard no longer exists — that is elimination. Substitution still leaves a mixing step that uses a less hazardous material, and ventilation or a written procedure leaves the exposure in place. Elimination is the only level that removes risk completely.\n\n混砂作业及其粉尘暴露被整体从现场移除，危害已不复存在，属于消除。替代只是换用危害更小的材料、混砂工序仍在；通风或书面程序则让暴露继续存在。消除是唯一能完全移除风险的层级。","related":[{"n":"1.2","t":"消除与替代"},{"n":"1.1","t":"控制层级"}],"level":"application","topic":"Elimination vs Substitution"},{"text":"At a press brake the employer installs a light curtain that stops the ram when a hand enters the die area, plus an interlocked gate on the rear opening. A supervisor also adds a monthly refresher talk. How should the light curtain and gate be classified?","group":1,"options":["Engineering controls, because they stop the machine without worker action","Administrative controls, because a supervisor is responsible for them","PPE, because they protect the operator from the die area","Substitution, because the machine hazard is replaced"],"correct":0,"explanation":"A light curtain and an interlocked gate are physical modifications that isolate the operator and act passively — the machine stops whether or not the worker is paying attention. The monthly talk changes worker behavior, so it is administrative. Substitution would require replacing the press or its process, and PPE protects only the individual.\n\n光幕与联锁门是物理改造，能被动隔离操作者——无论工人是否注意，机器都会停止，属工程控制。月度安全讲话改变的是工人行为，属行政控制。替代要求更换压力机或工艺，PPE 只保护个人。","related":[{"n":"1.3","t":"工程控制"}],"level":"application","topic":"Engineering Controls"},{"text":"A dry cleaner replaces perchloroethylene with a silicone-based solvent. The new solvent is far less toxic but is flammable and has a lower flash point than the old one. Which statement about this change is MOST accurate?","group":1,"options":["It is elimination because the carcinogen is no longer present","It is an engineering control because the machine was charged with a different fluid","It is administrative because only the purchasing decision changed","It is substitution, and the flammability of the substitute must be assessed before the change"],"correct":3,"explanation":"Replacing one chemical with another is substitution: the original hazard is reduced or removed but a new one (flammability) is introduced. Substitution must be preceded by a risk assessment of the substitute, which here means flammability controls, bonding and grounding, and possibly a management-of-change review. Elimination would require the cleaning step itself to disappear.\n\n用一种化学品换另一种属于替代：原有危害虽降低或消除，却引入了新危害（易燃性）。替代前必须对替代品做风险评估，本例需评估易燃性控制、跨接接地，并可能触发变更管理。消除要求清洗工序本身消失。","related":[{"n":"1.2","t":"消除与替代"}],"level":"application","topic":"Substitution Risk Assessment"},{"text":"A worker is exposed to 92 dBA for 2 hours and 87 dBA for the remaining 6 hours of an 8-hour shift. Using OSHA's 5-dB exchange rate, with allowed time T = 8 / 2^((L-90)/5), what is the noise dose?","group":1,"options":["75%","82%","100%","118%"],"correct":1,"explanation":"At 92 dBA, T = 8 / 2^0.4 = 6.06 hours, so 2 / 6.06 = 0.33. At 87 dBA, T = 8 / 2^-0.6 = 12.13 hours, so 6 / 12.13 = 0.49. Dose = 100 x (0.33 + 0.49) = 82%, which is below 100% but converts to a shift TWA of about 88.6 dBA — above the 85-dBA action level, so a hearing conservation program is required.\n\n92 dBA 时允许时间为 8 ÷ 2^0.4 = 6.06 小时，实际暴露 2 小时，比值为 0.33；87 dBA 时允许时间为 8 ÷ 2^-0.6 = 12.13 小时，实际暴露 6 小时，比值为 0.49。剂量 = 100 ×（0.33 + 0.49）= 82%，低于 100%，说明尚未超过 8 小时允许剂量。但按剂量换算的 8 小时 TWA 约为 88.6 dBA，仍高于 85 dBA 的行动水平，因此必须建立听力保护计划并继续做工程控制评估。","related":[{"n":"1.5","t":"引用控制层级的OSHA标准"}],"level":"calculation","topic":"Noise Dose Calculation"},{"text":"A design review identifies a missing guardrail. Adding it now, while the drawings are still on paper, is estimated at $2,000. Applying the 1-10-100 escalation used to explain Prevention through Design, what should the safety professional expect the same fix to cost after the unit is commissioned?","group":1,"options":["About $20,000","About $60,000","About $200,000","About $2,000,000"],"correct":2,"explanation":"The 1-10-100 rule scales the cost of correcting a hazard by roughly tenfold at each project stage: about $1 at design, $10 at construction, and $100 after commissioning. A $2,000 design-stage fix therefore becomes about $200,000 if it is deferred until the unit is running. That escalation is the core business case for resolving hazards during design.\n\n1-10-100 法则指纠正危害的成本每推进一个阶段约放大十倍：设计阶段约 1 美元、施工阶段约 10 美元、投产之后约 100 美元。因此设计阶段 2,000 美元的修复若拖到投产之后，约为 200,000 美元。这一放大效应正是设计阶段解决危害的核心商业理由。","related":[{"n":"1.6","t":"预防性设计"}],"level":"calculation","topic":"1-10-100 Rule"},{"text":"A dosimeter worn for a full 8-hour shift reports a noise dose of 200%. Using OSHA's conversion TWA = 90 + 16.61 x log10(dose/100), what is the 8-hour TWA?","group":1,"options":["93.0 dBA","95.0 dBA","97.0 dBA","100.0 dBA"],"correct":1,"explanation":"TWA = 90 + 16.61 x log10(200/100) = 90 + 16.61 x 0.301 = 90 + 5.0 = 95.0 dBA. A 200% dose is twice the allowable exposure, which corresponds to 95 dBA under the 5-dB exchange rate. Because the result exceeds the 90-dBA PEL, feasible engineering and administrative controls are required.\n\n按公式 TWA = 90 + 16.61 × log10(200 ÷ 100) = 90 + 16.61 × 0.301 = 95.0 dBA。200% 的剂量意味着实际暴露量达到允许暴露量的两倍；在 5 dB 交换率下，剂量翻倍正好对应声级提高 5 dB，因此 100% 对应 90 dBA、200% 对应 95 dBA。由于该结果超过 90 dBA 的允许暴露限值，雇主必须先实施可行的工程与行政控制，听力防护只能作为补充。","related":[{"n":"1.5","t":"引用控制层级的OSHA标准"}],"level":"calculation","topic":"Noise TWA from Dose"},{"text":"A distribution center installs flashing warning lights and a mirror, and writes a rule requiring a spotter at a blind corner where forklifts meet pedestrians. No physical barrier is added because the fire code requires the aisle to stay open. What level are these controls, and what is their main weakness?","group":1,"options":["Engineering controls that fail only when the lights burn out","PPE, because they protect only the individual","Elimination, because the collision hazard is removed","Administrative controls that work only while people comply"],"correct":3,"explanation":"Lights, a mirror, a spotter rule, and signage change how people work rather than physically separating them, so they are administrative controls. Their reliability depends on continuous human compliance: a driver who ignores the light or a spotter who leaves the post defeats them. The fire code restriction is what makes a physical barrier infeasible here, so choosing administrative controls is defensible.\n\n警示灯、反光镜、观察员规定与标识改变的是人的作业方式，而非物理隔离，因此属于行政控制。其可靠性取决于持续的人工遵守：司机无视灯光或观察员离岗，控制即失效。正是消防规范的限制使物理隔离在此不可行，因此选择行政控制是合理的。","related":[{"n":"1.4","t":"行政控制与PPE"}],"level":"application","topic":"Administrative Controls"},{"text":"An employer buys respirators, goggles, and gloves for every painter and hands them out at the start of the season, but has never documented a workplace hazard assessment. Which requirement of 29 CFR 1910.132(d) is unmet?","group":1,"options":["The employer must replace PPE every 12 months","The employer must certify the hazard assessment in writing before selecting PPE","The employer must obtain employee consent before issuing PPE","The employer must provide PPE only after a physician's approval"],"correct":1,"explanation":"1910.132(d) requires the employer to assess the workplace for hazards that necessitate PPE and to certify that assessment in writing. Purchasing PPE without that documented assessment leaves no basis for selection or fit, and no evidence that higher-level controls were considered and found infeasible. The standard contains no annual replacement, consent, or physician-approval requirement.\n\n1910.132(d) 要求雇主评估需要 PPE 的工作场所危害，并以书面形式认证该评估。未做书面评估就采购 PPE，既无选型与贴合度的依据，也无法证明已考虑更高层级控制且其不可行。标准中没有年度更换、员工同意或医生批准的要求。","related":[{"n":"1.4","t":"行政控制与PPE"}],"level":"application","topic":"PPE Hazard Assessment"},{"text":"A design team is asked to propose controls for a new carton-packing station where workers currently lift and twist 40-lb cases. Which proposal represents the HIGHEST level of the hierarchy that is still feasible?","group":1,"options":["Install lift-assist arms at each packing position","Rotate packers every 30 minutes and train them in lifting technique","Redesign the line so cases are filled and sealed at floor level","Issue back belts and non-slip gloves to every packer"],"correct":2,"explanation":"Redesigning the line removes the manual handling task entirely, which is elimination and the highest feasible level. Lift-assist arms are an engineering control, rotation and training are administrative controls, and belts and gloves are PPE. Only after documenting that redesign is infeasible should the team settle for a lower level.\n\n重新设计生产线彻底取消了人工搬运，属于消除，是可行的最高层级。助力机械臂是工程控制，轮岗与培训是行政控制，护腰带与手套是 PPE。只有在记录证明重新设计不可行之后，才应退而选择较低层级。","related":[{"n":"1.8","t":"控制措施选择"}],"level":"application","topic":"Selecting Controls"},{"text":"A safety professional is assigned to a project to build a new wastewater treatment building, currently at the conceptual and schematic design stage. What is the MOST useful contribution at this point?","group":1,"options":["Wait for commissioning, then audit the finished building for fall hazards","Prepare a PPE list for the operators who will work there","Draft the lockout procedure for the equipment once it is installed","Review the design so that permanent anchor points, guardrails, and maintenance access are built in"],"correct":3,"explanation":"PtD applies the hierarchy earliest, when design changes are cheapest and elimination or passive protection is still possible. Permanent anchors, parapets, and maintenance access decided on paper cost far less than retrofits and remove the fall hazard instead of managing it. Audits, PPE lists, and procedures are later and lower-level responses.\n\n预防性设计主张在最早阶段应用控制层级，此时改动成本最低，仍可实现消除或被动防护。图纸阶段确定永久锚点、女儿墙与检修通道，成本远低于事后改造，且是从源头消除坠落危害。审计、PPE 清单与程序属于较晚、较低层级的应对。","related":[{"n":"1.6","t":"预防性设计"}],"level":"application","topic":"PtD Timing"},{"text":"Which of the following is the clearest example of Prevention through Design rather than a downstream control?","group":1,"options":["Writing guarding and noise limits into the equipment purchase specification","Adding a guard to a mixer after the first hand injury in the plant","Training operators to keep hands out of the mixer during cleaning","Requiring cut-resistant gloves while cleaning the mixer at night"],"correct":0,"explanation":"Writing safety requirements into the equipment specification moves the control into the design and procurement phase, which is PtD. Retrofitting a guard after an injury, training, and gloves all act only after the hazard has been built into the workplace. PtD is proactive; the other options are reactive or lower-level.\n\n把安全要求写进设备采购规格，等于把控制前移到设计与采购阶段，属于预防性设计。受伤后加装防护罩、培训与手套，都是在危害已进入工作场所之后才采取的措施。预防性设计是主动的，其余选项是事后或较低层级的措施。","related":[{"n":"1.6","t":"预防性设计"}],"level":"recall","topic":"PtD in Procurement"},{"text":"A chemical plant replaces a batch process that held a four-hour inventory of a toxic intermediate in a large surge tank with continuous in-line generation that holds only about ten minutes of inventory. Which inherently safer design strategy is this?","group":1,"options":["Substitute","Minimize (intensification)","Moderate (attenuation)","Simplify (error tolerance)"],"correct":1,"explanation":"Minimize, also called intensification, reduces the quantity of hazardous material present at any moment. Holding ten minutes instead of four hours of a toxic intermediate sharply reduces the inventory that could be released. Moderate would change conditions such as temperature or pressure, and Simplify addresses error potential rather than inventory.\n\n最小化（强化）是减少任一时刻存在的危险物料数量。有毒中间体从 4 小时存量降到约 10 分钟存量，大幅减少了可能泄漏的物料量。缓和是改变温度、压力等条件；简化针对的是出错可能性，而非存量。","related":[{"n":"1.7","t":"本质安全设计"}],"level":"application","topic":"ISD Minimize"},{"text":"An engineer proposes storing anhydrous ammonia as a refrigerated liquid at about atmospheric pressure instead of as a pressurized liquid at 150 psig. Which inherently safer design strategy does this represent?","group":1,"options":["Minimize","Simplify","Moderate (attenuation)","Eliminate"],"correct":2,"explanation":"Moderate, or attenuation, means using less severe process conditions — here a much lower storage pressure. Lower pressure reduces the driving force for a release and the severity if one occurs. Minimize would reduce the quantity, and Simplify would reduce the chance of operator error.\n\n缓和（弱化）指采用更温和的工艺条件——本例是把储存压力大幅降低。压力越低，泄漏的驱动力和后果严重性就越小。最小化是减少数量；简化是减少人为差错的机会。","related":[{"n":"1.7","t":"本质安全设计"}],"level":"application","topic":"ISD Moderate"},{"text":"A bulk chemical terminal installs unique, non-interchangeable couplings and keyed, color-coded connections so that a chlorine line physically cannot be connected to an ammonia line. Which inherently safer design strategy does this illustrate?","group":1,"options":["Moderate","Minimize","Administrative control","Simplify (error tolerance)"],"correct":3,"explanation":"Simplify, also called error tolerance, designs the system so that a mistake is hard or impossible to make — incompatible fittings cannot be mis-connected. This is inherently safer than relying on labels and procedures, which are administrative. Moderate and Minimize concern conditions and quantities, not error-proofing.\n\n简化（容错）让错误难以或不可能发生——不可互换的接头从物理上杜绝了错接。这比依赖标签与程序（行政控制）更本质安全。缓和与最小化分别针对工艺条件和物料数量，与防错无关。","related":[{"n":"1.7","t":"本质安全设计"}],"level":"application","topic":"ISD Simplify"},{"text":"Which pairing of an inherently safer design strategy with its meaning is correct?","group":1,"options":["Minimize — reduce the severity of operating conditions","Moderate — reduce temperature, pressure, or concentration","Simplify — reduce the quantity of hazardous material","Substitute — reduce the number of process steps"],"correct":1,"explanation":"Moderate (attenuation) means making process conditions less severe, for example lower temperature, pressure, or concentration. Minimize reduces quantity, Simplify reduces human-error potential through error-proofing, and Substitute replaces the material with a less hazardous one. Swapping the meanings of Minimize and Moderate is the most common ISD error.\n\n缓和（弱化）指使工艺条件更温和，例如降低温度、压力或浓度。最小化减少数量；简化通过防错降低人为差错；替代是换用危害更小的物质。把最小化与缓和的含义互换是最常见的错误。","related":[{"n":"1.7","t":"本质安全设计"}],"level":"recall","topic":"ISD Strategies"},{"text":"A safety manager wants to build a management-system approach to hazard control rather than a compliance-only program. Which standard is designed for that purpose and explicitly incorporates the hierarchy of controls?","group":1,"options":["ANSI/ASSP Z10.0, the occupational health and safety management systems standard","NFPA 70E, the standard for electrical safety in the workplace","ANSI B11.19, the machine safeguarding standard","29 CFR 1904, the injury and illness recordkeeping rule"],"correct":0,"explanation":"ANSI/ASSP Z10.0 is a consensus management-system standard that requires risk assessment, a hierarchy-based approach to controls, and management review. NFPA 70E and B11.19 are hazard-specific technical standards, and 29 CFR 1904 governs recordkeeping. Z10.0 supplies the framework rather than a specification for one hazard.\n\nANSI/ASSP Z10.0 是管理体系类共识标准，要求风险评估、按控制层级选择措施并开展管理评审。NFPA 70E 与 B11.19 是特定危害的技术标准，29 CFR 1904 是记录保存法规。Z10.0 提供框架，而非针对单一危害的规范。","related":[{"n":"1.1","t":"控制层级"}],"level":"recall","topic":"ANSI/ASSP Z10.0"},{"text":"A stamping room measures 94 dBA TWA. The plant's only response is to hand out earplugs and begin audiometric testing. What is the MOST likely basis for an OSHA citation under 29 CFR 1910.95?","group":1,"options":["Audiometric testing was started without a valid baseline test","Earplugs were issued without individual fit testing of each worker","The employer did not first implement feasible engineering and administrative controls","No written hearing conservation program was established for the plant"],"correct":2,"explanation":"Above the 90-dBA PEL, 1910.95(b)(1) requires the employer to use feasible engineering or administrative controls before relying on hearing protection. The employer did supply protection and testing, which are program elements, but skipped the required hierarchy step — that is the citation. Fit testing and a written program are real requirements, but the hierarchy failure controls here.\n\n超过 90 dBA 的 PEL 时，1910.95(b)(1) 要求雇主先采用可行的工程或行政控制，才能依赖听力防护。该厂确实提供了防护与检测（属于计划的组成部分），但跳过了层级要求的第一步，这正是处罚依据。密合度测试与书面计划确实是要求，但此处核心问题是未按层级控制。","related":[{"n":"1.5","t":"引用控制层级的OSHA标准"}],"level":"application","topic":"Noise Controls Before PPE"},{"text":"Welders are overexposed to manganese fume. A local exhaust system has been designed and is scheduled for installation in ten weeks. In the interim the employer issues half-mask respirators with medical evaluation, fit testing, and training. Is this acceptable under 29 CFR 1910.134?","group":1,"options":["No, respirators may never be used while engineering controls are feasible","No, respirators may only be used after the ventilation system has failed","Yes, but only if employees sign a waiver of the exposure limit","Yes, respirators may be used while engineering controls are being implemented"],"correct":3,"explanation":"1910.134 permits respirators when engineering controls are not feasible or while they are being implemented, provided the written program is in place. A ten-week installation schedule with medical evaluation, fit testing, and training fits that interim allowance. Respirators are never a substitute for controls that are feasible in the long run.\n\n1910.134 允许在工程控制不可行或正在实施期间使用呼吸器，前提是具备完整的书面呼吸防护计划。十周安装期内配合医学评估、密合度测试与培训，符合这一临时许可。但呼吸器永远不能替代长期可行的工程控制。","related":[{"n":"1.5","t":"引用控制层级的OSHA标准"}],"level":"application","topic":"Respirators as Interim Control"},{"text":"A mixer has an interlocked gate that stops rotation when the gate opens, and it is also covered by a written lockout procedure used for blade changes. Why are BOTH controls needed rather than either one alone?","group":1,"options":["Because the interlock protects during operation while lockout controls stored energy during servicing","Because the interlock is administrative and the lockout is engineering","Because OSHA requires three independent controls on every machine","Because the lockout procedure replaces the interlock during production"],"correct":0,"explanation":"The two controls address different modes: the interlock is a passive engineering control for operating and jam-clearing exposure, while LOTO isolates hazardous energy for servicing when guards are bypassed. Layering across hierarchy levels is normal and is the point of defense in depth. Neither control is redundant, because neither covers the other's exposure.\n\n两者针对不同工况：联锁是运行与清堵时被动起效的工程控制；上锁挂牌则在防护装置被旁路、进行维修时隔离危险能量。跨层级叠加是常态，正是纵深防御的意义。它们并不重复，因为谁都不能覆盖对方的暴露场景。","related":[{"n":"1.8","t":"控制措施选择"},{"n":"1.1","t":"控制层级"}],"level":"application","topic":"Defense in Depth"},{"text":"After a near miss, an investigation shows that operators routinely defeat a keyed interlock with a bent paper clip because the interlock stops the machine every time a part jams. What is the BEST recommendation?","group":1,"options":["Discipline the operators who defeated the interlock with the paper clip","Redesign the interlock and the jam-clearing method so bypass is unnecessary","Post a sign stating that defeating interlocks is prohibited in the plant","Add the interlock check to the monthly safety inspection checklist"],"correct":1,"explanation":"The bypass is a symptom: the control conflicts with getting the work done, so workers route around it. The durable fix is an engineering redesign — for example an interlock that permits slow jog during clearing, or a jam-clearing tool that keeps hands out — plus tamper-resistant hardware. Discipline, signage, and inspection leave the underlying conflict in place and are lower-level controls.\n\n旁路只是症状：控制措施与完成作业相冲突，工人自然会绕过。持久解法是工程改造——例如允许清堵时慢速点动的联锁，或使手不进入危险区的清堵工具——并采用防拆硬件。纪律、标识与检查没有消除根本冲突，属于较低层级措施。","related":[{"n":"1.3","t":"工程控制"}],"level":"application","topic":"Interlock Bypass"},{"text":"To control ergonomic risk at a repetitive assembly task, a plant rotates each worker through four jobs every two hours. Which statement about this control is MOST accurate?","group":1,"options":["It eliminates the ergonomic hazard because no worker performs one task all day","It is a PPE-level control and must be documented in the hazard assessment","It reduces the duration of exposure but the hazard at each station remains, so station redesign is still preferred","It removes the need for further controls because rotation is an engineering change"],"correct":2,"explanation":"Rotation redistributes exposure time among workers; it does not remove the awkward postures or forces at any station, and it can spread a musculoskeletal disorder across a larger group. It is an administrative control, so redesigning the workstation remains the higher-level fix. It is not PPE and it does not eliminate the hazard.\n\n轮岗只是在工人之间重新分配暴露时间，并未消除任一工位的别扭姿势或用力，甚至可能把肌肉骨骼疾患扩散到更多人。它属于行政控制，因此工位重新设计仍是更高层级的措施。它既不是 PPE，也不构成消除。","related":[{"n":"1.4","t":"行政控制与PPE"}],"level":"recall","topic":"Job Rotation Limits"},{"text":"Why does the hierarchy of controls rank engineering controls above administrative controls, even when both are properly implemented?","group":1,"options":["Engineering controls are always less expensive over the life of the equipment","Administrative controls are not recognized by OSHA","Engineering controls remove the hazard completely","Engineering controls act passively and do not depend on worker behavior"],"correct":3,"explanation":"Engineering controls work without any action by the worker — a guardrail protects an inattentive worker 24 hours a day. Administrative controls depend on continuing compliance, enforcement, and memory, so they degrade under production pressure. Only elimination removes a hazard completely, so the third option overstates engineering controls.\n\n工程控制无需工人做任何动作即生效——护栏全天候保护一个心不在焉的工人。行政控制依赖持续遵守、监督与记忆，在生产压力下容易退化。只有消除能完全移除危害，因此第三项夸大了工程控制的作用。","related":[{"n":"1.1","t":"控制层级"}],"level":"recall","topic":"Engineering Reliability"},{"text":"During decommissioning of a 1970s tank farm, contractors discover asbestos gaskets and a buried piping run that was never documented. Which PtD principle was most clearly missing in the original project?","group":1,"options":["Lifecycle thinking that includes maintenance, renovation, and decommissioning","Cross-functional design review with the project engineers","Applying the hierarchy of controls during the construction phase","A written hazard assessment completed before PPE selection"],"correct":0,"explanation":"PtD requires considering the full life cycle, including eventual decommissioning — choosing materials, keeping records, and documenting routes so that future workers are not surprised. Undocumented buried piping and hazardous gaskets are lifecycle failures that create hazards decades later. A cross-functional review might have caught it, but the specific defect is failure to design for the end of life.\n\n预防性设计要求考虑全生命周期，包括最终退役——材料选择、记录保存与管线走向都必须为未来作业者留下依据。未记录的埋地管线与危险垫片，正是数十年后才显现的生命周期缺陷。跨职能评审或许能发现它，但具体缺陷在于未为退役阶段设计。","related":[{"n":"1.6","t":"预防性设计"}],"level":"application","topic":"PtD Lifecycle"},{"text":"A capital project team is forming a design review for a new production line. Which membership BEST reflects Prevention through Design?","group":1,"options":["Only the project engineers and the architectural design firm","Engineers plus the safety professional, maintainers, and the operators","Only the safety department and an outside consultant who audits","Only management and the contractor who will build the new line"],"correct":1,"explanation":"PtD calls for cross-functional teams because maintenance and operating experience reveal hazards that designers miss, such as access for lubrication, blade changes, and cleaning. Including the safety professional, maintainers, and operators at design review is the defining practice. Engineer-only or management-only reviews systematically miss lifecycle and usability hazards.\n\n预防性设计强调跨职能团队，因为维修与操作经验能揭示设计者忽略的危害——如润滑、换刀与清洁的通道。把安全专业人员、维修人员与操作者纳入设计评审，是标志性做法。仅工程师或仅管理层的评审会系统性遗漏生命周期与可用性危害。","related":[{"n":"1.6","t":"预防性设计"}],"level":"application","topic":"Cross-Functional Design Review"},{"text":"A sound enclosure for a press line costs $60,000 installed. The current hearing conservation program for those workers costs $14,000 per year. Ignoring other costs and benefits, after how many years does the enclosure become the cheaper option?","group":1,"options":["3 years","4 years","5 years","7 years"],"correct":2,"explanation":"Divide the capital cost by the annual program cost: $60,000 / $14,000 = 4.3 years. At four years the program has cost only $56,000, so the enclosure is not yet cheaper; during year five the cumulative program cost passes $60,000. Payback is therefore about five years, after which the engineering control also removes the noise rather than protecting individuals from it.\n\n用资本成本除以年度计划成本：60,000 ÷ 14,000 = 4.3 年。第四年时计划累计支出仅 56,000 美元，隔音罩尚未更便宜；到第五年累计支出超过 60,000 美元。因此回收期约为五年，此后该工程控制还从源头降低了噪声，而不只是保护个人。","related":[{"n":"1.6","t":"预防性设计"}],"level":"calculation","topic":"Payback of Engineering Control"},{"text":"In which situation is relying on PPE as the primary control MOST defensible?","group":1,"options":["PPE is the least expensive option available in the budget","Workers have requested PPE instead of a process change","PPE protects all workers in the area equally well","Higher-level controls are infeasible and no alternative exists"],"correct":3,"explanation":"The hierarchy allows PPE when higher-level controls are infeasible or while they are being implemented — for example, short-duration emergency response or a task that cannot be engineered differently. Cost alone, worker preference, or a mistaken belief that PPE protects everyone are not acceptable justifications. PPE protects only the wearer and fails if it is not worn correctly.\n\n控制层级允许在更高层级控制不可行或正在实施时使用 PPE——例如短时应急响应，或无法通过工程手段改变的任务。单纯因为成本低、工人偏好，或误以为 PPE 能保护所有人，都不构成正当理由。PPE 只保护佩戴者，且佩戴不当即失效。","related":[{"n":"1.8","t":"控制措施选择"}],"level":"recall","topic":"PPE as Primary Control"},{"text":"A plant decides that enclosing a noisy pump is not feasible because the enclosure would block required maintenance access. What should the safety professional require before accepting hearing protection as the control?","group":1,"options":["Nothing, because the employer's judgment is final under the standard","Documentation that the engineering control is infeasible plus evaluation of alternatives","A signed waiver from each exposed employee in the affected department","Written approval from the manufacturer of the hearing protection device"],"correct":1,"explanation":"The standard requires feasible controls, so the employer must be able to show why the engineering option is infeasible and that it evaluated administrative alternatives such as scheduling. That documentation is what an inspector or auditor will test. Employee waivers and manufacturer approvals have no bearing on the hierarchy obligation.\n\n标准要求采用可行的控制措施，因此雇主必须能说明为何工程方案不可行，并证明已评估轮班等行政替代方案。这份记录正是检查员或审核员核查的对象。员工弃权书与制造商批准与控制层级义务无关。","related":[{"n":"1.8","t":"控制措施选择"}],"level":"recall","topic":"Feasibility Documentation"},{"text":"A plant removes a fixed guard from a conveyor transfer point because all operators have been trained to keep clear. Which principle does this decision violate?","group":1,"options":["Training is administrative and cannot replace a feasible engineering control","Machine guarding is only required for machines built after 1972","Guards may be removed whenever production requires it","Training must be repeated every year to remain valid"],"correct":0,"explanation":"Training relies on behavior and ranks below a feasible guard, so removing the guard trades a passive engineering control for an administrative one. Under 29 CFR 1910.212, guarding must be provided where the point of operation exposes an employee to injury. Production convenience and training status do not justify removal.\n\n培训依赖人的行为，其层级低于可行的防护装置；拆掉防护罩等于用行政控制替换被动工程控制。依据 29 CFR 1910.212，操作点使员工面临伤害风险时必须设防。生产便利与培训状态都不能成为拆除防护罩的理由。","related":[{"n":"1.1","t":"控制层级"},{"n":"1.3","t":"工程控制"}],"level":"application","topic":"Training as Substitute for Guard"},{"text":"What limitation do administrative controls and PPE share?","group":1,"options":["Both are ineffective for airborne exposures","Both are prohibited where engineering controls exist","Both depend on human behavior and fail when people do not comply","Both are considered elimination-level controls"],"correct":2,"explanation":"Both rely on people doing something — following a procedure, or donning and maintaining equipment — so both degrade under time pressure, fatigue, and poor supervision. That shared dependence is why both rank below engineering controls. PPE additionally protects only the wearer, which administrative controls do not necessarily do.\n\n两者都依赖人去执行——遵守程序，或穿戴并维护装备——因此在时间压力、疲劳与监督不足时都会退化。这种对人的共同依赖，正是二者层级都低于工程控制的原因。PPE 还只保护佩戴者个人，行政控制则未必如此。","related":[{"n":"1.4","t":"行政控制与PPE"}],"level":"recall","topic":"Shared Limitation"},{"text":"At a 30% design review for a new distribution center, the safety professional notices that the mezzanine pick module has no designated tie-off points and the only roof access is a portable ladder. What is the MOST appropriate action?","group":1,"options":["Note them for the pre-startup safety review after construction","Include them in the operator training package","Add them to the annual fall protection inspection checklist","Raise them now as design changes for permanent anchors and a fixed access stair"],"correct":3,"explanation":"At 30% design the drawings are still cheap to change, and permanent anchors plus a fixed stair are PtD solutions that remove or passively control the hazard for the life of the building. Deferring to pre-startup review, training, or inspection treats the hazard after it is built and costs far more. The 1-10-100 escalation is exactly why action is needed at this stage.\n\n在 30% 设计阶段修改图纸成本很低，永久锚点与固定楼梯属于预防性设计，能在建筑全寿命期内消除或被动控制危害。拖到启动前审查、培训或检查，等于在危害建成后才处理，成本高得多。1-10-100 的成本放大正是此时行动的理由。","related":[{"n":"1.6","t":"预防性设计"}],"level":"application","topic":"Design Review Action"},{"text":"A facility stores 1,400 lb of chlorine in one process and 11,000 lb of anhydrous ammonia in a separate process. Which statement about OSHA PSM coverage is correct?","group":2,"options":["Neither process is covered because each is below its threshold quantity","Only the ammonia process is covered, because 11,000 lb exceeds the 10,000-lb ammonia threshold","Only the chlorine process is covered, because chlorine is a listed toxic gas","Both processes are covered because the combined quantity exceeds 25,000 lb"],"correct":1,"explanation":"PSM coverage is determined process by process against the threshold quantity for each listed chemical. Ammonia has a 10,000-lb threshold, so 11,000 lb is covered; chlorine's threshold is 1,500 lb, so 1,400 lb is not. Quantities in different processes are not added together to create coverage.\n\nPSM 的适用性按工艺逐一对照各化学品的阈限量判断。氨的阈限量为 10,000 磅，11,000 磅已适用；氯气阈限量为 1,500 磅，1,400 磅不适用。不同工艺的数量不能相加来触发适用性。","related":[{"n":"2.1","t":"PSM概述"}],"level":"application","topic":"PSM Applicability Thresholds"},{"text":"A process holds 1,700 gallons of a flammable liquid with a specific gravity of 0.75. Water weighs 8.34 lb per gallon. Is the process covered by PSM?","group":2,"options":["Yes, because the inventory is about 10,600 lb, above the 10,000-lb threshold","No, because the inventory is about 8,000 lb, below the threshold","No, because the inventory is about 4,400 lb, below the threshold","Yes, but only if the liquid is stored above its normal boiling point"],"correct":0,"explanation":"Mass = 1,700 gal x 8.34 lb/gal x 0.75 = 10,634 lb, which exceeds the 10,000-lb threshold for flammable liquids in one location. Coverage depends on quantity; storage temperature matters only for the separate exception for atmospheric tanks kept below the boiling point. The process is therefore covered.\n\n质量 = 1,700 加仑 × 8.34 磅/加仑 × 0.75 = 10,634 磅，超过单一位置易燃液体 10,000 磅的阈限量。适用性取决于数量；储存温度只与常压储罐低于沸点储存的例外有关。因此该工艺适用 PSM。","related":[{"n":"2.1","t":"PSM概述"}],"level":"calculation","topic":"Flammable Liquid Inventory"},{"text":"A LOPA team estimates an initiating event frequency of 0.1 per year. Two independent protection layers have probability of failure on demand of 0.01 and 0.1. What is the mitigated event frequency?","group":2,"options":["1 x 10^-2 per year","1 x 10^-3 per year","1 x 10^-4 per year","1 x 10^-5 per year"],"correct":2,"explanation":"Multiply the initiating frequency by each independent protection layer's probability of failure on demand: 0.1 x 0.01 x 0.1 = 1 x 10^-4 per year, or once in 10,000 years. LOPA checks whether the number and reliability of independent protection layers reduce risk to the tolerability target. A layer only counts if it is independent of the initiating event and of the other layers.\n\n把初始事件频率乘以各独立保护层的需求失效概率：0.1 × 0.01 × 0.1 = 1×10⁻⁴/年，即约一万年一次。LOPA 用来检验保护层的数量与可靠性是否把风险降到可容忍目标。只有与初始事件及其他保护层相互独立的层才可计入。","related":[{"n":"2.4","t":"PHA与HAZOP"}],"level":"calculation","topic":"LOPA Calculation"},{"text":"A contractor must weld a support bracket onto a pipe that is part of a PSM-covered process. The line has been drained and purged. What does the PSM standard require before the welder starts?","group":2,"options":["Only a verbal approval from the area supervisor before the job","A confined space permit only, because the pipe was entered","Nothing further, because the line was purged before the job","A hot work permit issued before work begins, with the date, object, and duration"],"correct":3,"explanation":"Element 9, the hot work permit, applies to welding, cutting, brazing, grinding, and other spark-producing work on or near a covered process. The permit must be issued before work begins and identify the date, the object being worked on, and the permitted duration. Purging reduces risk but does not replace the permit.\n\n要素 9（动火作业许可证）适用于在适用工艺上或附近进行的焊接、切割、钎焊、打磨等产生火花的作业。许可必须在作业开始前签发，并注明日期、作业对象与有效期。吹扫降低了风险，但不能替代许可证。","related":[{"n":"2.2","t":"PSM十四要素"}],"level":"application","topic":"Hot Work Permit"},{"text":"PSM is described as a management-system standard rather than a specification standard. What does that mean in practice?","group":2,"options":["It specifies exact equipment designs that must be installed","It requires defined management systems but leaves the methods to the employer","It applies only to companies with a corporate safety department","It replaces all other OSHA substance-specific health standards"],"correct":1,"explanation":"A management-system standard tells the employer what systems must exist — hazard analysis, change management, audits — but not exactly how to build them, much like ISO management standards. That flexibility is why citations often turn on whether the system actually functioned rather than on a single specification. It does not prescribe equipment designs and does not replace other standards.\n\n管理体系标准规定必须建立哪些体系——危害分析、变更管理、审核——但不规定具体如何建立，类似 ISO 管理体系标准。因此处罚往往取决于体系是否真正运作，而非某一项规格。它不规定设备设计，也不取代其他标准。","related":[{"n":"2.1","t":"PSM概述"}],"level":"recall","topic":"Management System Standard"},{"text":"A reactor is replaced with a larger vessel of different design, which changes the process safety information. Before the unit is restarted with hazardous chemicals, which PSM requirement applies?","group":2,"options":["Only a management-of-change review, because the change was approved","Only retraining of the operators on the new vessel and its controls","A pre-startup safety review confirming construction, procedures, PHA actions, and training","A new compliance audit of the entire facility before any restart"],"correct":2,"explanation":"A PSSR is required for new facilities and for modified facilities whose modification requires a change in process safety information — exactly this case. The review confirms the equipment meets design specifications, procedures are updated, PHA recommendations are resolved, and training is complete. MOC approves the change; the PSSR is the final check before startup.\n\n新设施以及需要更改工艺安全信息的改造设施都必须做启动前安全审查——本例正是如此。审查要确认设备符合设计规格、程序已更新、PHA 建议已关闭、培训已完成。MOC 负责批准变更，PSSR 是投料开车前的最后检查。","related":[{"n":"2.3","t":"关键PSM概念"}],"level":"application","topic":"Pre-Startup Safety Review"},{"text":"Which statement correctly distinguishes Management of Change from the Pre-Startup Safety Review?","group":2,"options":["MOC authorizes the change beforehand; the PSSR verifies readiness to start afterward","MOC is required every five years; the PSSR is required every three years","MOC applies only to equipment; the PSSR applies only to written procedures","The PSSR replaces MOC whenever the proposed change is major"],"correct":0,"explanation":"MOC is the forward-looking approval process that reviews the technical basis, hazards, and procedure updates before a change is implemented. The PSSR is a backward-looking verification performed after construction and before startup that everything is in place. Both are required for a significant modification, and neither replaces the other.\n\nMOC 是变更实施前的审批流程，审查技术依据、危害与程序更新；PSSR 是改造完成后、开车前的核查，确认各项条件到位。重大改造两者都要做，互不替代。","related":[{"n":"2.3","t":"关键PSM概念"}],"level":"application","topic":"MOC vs PSSR"},{"text":"A maintenance planner proposes replacing a pressure relief valve with a spare that has the same size and connections but a set pressure 25 psi higher. Which PSM requirements are triggered?","group":2,"options":["None, because the valve is a like-for-like replacement of the spare","Only a mechanical integrity inspection of the newly installed valve","Only a hot work permit issued for the maintenance turnaround","A management-of-change review plus an update of the relief design basis in the PSI"],"correct":3,"explanation":"A different set pressure is not a replacement in kind: it changes the relief system design basis, which is required process safety information. MOC must review and authorize the change, and the PSI must be updated to reflect the new design basis. Mechanical integrity then inspects and tests the installed device.\n\n设定压力不同不属于同类替换：它改变了泄压系统设计依据，而设计依据属于必须维护的工艺安全信息。必须通过 MOC 审查批准，并更新 PSI 以反映新的设计依据。之后由机械完整性程序对该装置进行检验与测试。","related":[{"n":"2.3","t":"关键PSM概念"},{"n":"2.5","t":"机械完整性与泄压"}],"level":"application","topic":"Relief Valve Set Pressure Change"},{"text":"Under PSM, when must employees affected by a change be informed of it and trained on it?","group":2,"options":["Within 30 days after the change is implemented","Before the change is started up, after the MOC review is complete","Only if the change alters their job title","At the next scheduled annual refresher"],"correct":1,"explanation":"Affected employees must be informed of and trained on the change before startup, because they will operate the changed process. The sequence is MOC review and authorization, then procedure updates and training, then startup. Waiting until after startup exposes employees to a process they have not been trained on.\n\n受变更影响的员工必须在开车前得到通知并接受培训，因为他们要操作变更后的工艺。顺序是先完成 MOC 审查批准，再更新程序并培训，然后开车。拖到开车后才培训，会让员工在未受训的情况下操作新工艺。","related":[{"n":"2.3","t":"关键PSM概念"}],"level":"recall","topic":"MOC Timing and Training"},{"text":"Which PHA method is deductive, starts from a defined top event such as a vessel rupture, and works downward through AND/OR logic gates to identify combinations of basic causes?","group":2,"options":["Fault tree analysis","HAZOP","What-If analysis","Checklist analysis"],"correct":0,"explanation":"Fault tree analysis is deductive: it begins with the top event, decomposes it through AND/OR gates to basic events, and can be quantified with failure rates. HAZOP is inductive, applying guide words to parameters at nodes. What-If and checklist methods are brainstorming or list-driven and are not logic-gate based.\n\n故障树分析是演绎式的：从顶事件出发，通过 AND/OR 逻辑门分解到基本事件，并可用失效率进行定量计算。HAZOP 是归纳式的，在节点上把引导词应用到工艺参数。What-If 与检查表属于头脑风暴或清单式方法，不使用逻辑门。","related":[{"n":"2.4","t":"PHA与HAZOP"}],"level":"recall","topic":"Fault Tree Analysis"},{"text":"During a HAZOP on a reactor feed line, the team applies the guide word LESS OF to the flow parameter. Which deviation are they examining?","group":2,"options":["Backflow from the reactor into the feed header at the pump","Two-phase flow arriving at the reactor instead of liquid","Flow below the design rate, which may starve the reaction","Extra reactant entering the reactor from the recycle line"],"correct":2,"explanation":"LESS OF applied to flow means flow below the design value, such as a partially blocked line or a degrading pump. The team then evaluates causes, consequences, existing safeguards, and needed actions. Backflow is REVERSE, two-phase flow is PART OF, and extra reactant is MORE OF or MORE THAN.\n\nLESS OF 应用于流量即低于设计流量，例如管线部分堵塞或泵性能下降。团队随后评估原因、后果、现有防护与所需措施。回流属 REVERSE，两相流属 PART OF，多余反应物属 MORE OF / MORE THAN。","related":[{"n":"2.4","t":"PHA与HAZOP"}],"level":"application","topic":"HAZOP Guide Word LESS OF"},{"text":"In HAZOP terminology, what does the guide word PART OF indicate?","group":2,"options":["A missing component, such as an absent catalyst","An additional component, such as contamination","The opposite direction of flow or action","A change in composition or phase, such as two-phase flow"],"correct":3,"explanation":"PART OF means only some of the intended components are present, or the stream's composition or phase differs from design — for example two-phase flow where liquid is expected. A missing component is LESS THAN, an extra one is MORE THAN or contamination. REVERSE covers the opposite direction.\n\nPART OF 表示只有部分预期组分存在，或物流的组成与相态偏离设计——例如本应是液体却出现两相流。缺少组分属 LESS THAN，多出组分属 MORE THAN 或污染。REVERSE 指方向相反。","related":[{"n":"2.4","t":"PHA与HAZOP"}],"level":"recall","topic":"HAZOP Guide Word PART OF"},{"text":"Which team composition satisfies the PSM requirement for a process hazard analysis?","group":2,"options":["Any three employees drawn from the plant safety department, one of whom has audited the unit","A team with engineering and operations expertise, one employee who knows the process, and one who knows the method","A single outside consultant who is certified in the HAZOP method and has ten years of experience","The plant manager plus the maintenance supervisor and the unit process engineer"],"correct":1,"explanation":"The PHA team must combine engineering and process-operations expertise, include at least one employee with specific knowledge and experience of the process being evaluated, and include someone knowledgeable in the selected methodology. A single consultant, or a team without process-specific knowledge, does not meet the requirement. The employee member also supports the employee-participation element.\n\nPHA 团队必须具备工程与工艺操作专长，包含至少一名对被评估工艺有特定知识与经验的员工，以及一名熟悉所选方法的成员。单一顾问或不具备工艺特定知识的团队不符合要求。员工成员同时落实员工参与要素。","related":[{"n":"2.4","t":"PHA与HAZOP"}],"level":"recall","topic":"PHA Team Composition"},{"text":"A new operator is assigned to a PSM-covered process. What does the PSM training element require?","group":2,"options":["Documented training before working in the process, with refreshers every three years","Training within the first 90 days of the assignment","Training only after the first incident involving the process","Training every five years, aligned with the PHA revalidation cycle"],"correct":0,"explanation":"Element 5 requires initial training before the employee works in the process and refresher training at least every three years, with documentation of both. The three-year cycle is separate from the five-year PHA revalidation cycle. Training delivered after an incident is far too late.\n\n要素 5 要求员工在进入工艺作业前完成初始培训，并至少每三年复训一次，且需保留记录。三年复训周期与五年一次的 PHA 复验周期是两回事。等到发生事故后才培训显然太晚。","related":[{"n":"2.2","t":"PSM十四要素"}],"level":"application","topic":"PSM Training"},{"text":"Which PSM element requires written procedures for inspecting and testing pressure vessels, piping, relief devices, and emergency shutdown systems in accordance with recognized good engineering practices?","group":2,"options":["Process hazard analysis","Management of change","Mechanical integrity","Compliance audits"],"correct":2,"explanation":"Mechanical integrity, Element 8, is the systematic preventive maintenance program that keeps covered equipment fit for service, with inspections and tests per RAGAGEP such as API 510, API 570, and API 653. The PHA identifies hazards and MOC manages changes; neither keeps equipment from deteriorating. Compliance audits check the system, not the metal.\n\n机械完整性（要素 8）是使受控设备保持可服役状态的系统性预防性维护计划，检验测试须遵循 RAGAGEP，如 API 510、API 570、API 653。PHA 识别危害，MOC 管理变更，都不能防止设备劣化。合规审核检查的是体系，而非设备本身。","related":[{"n":"2.5","t":"机械完整性与泄压"}],"level":"recall","topic":"Mechanical Integrity"},{"text":"A relief valve's design basis calculations and the record of its last bench test are kept in different files. How should these two items be classified under PSM?","group":2,"options":["Both items are mechanical integrity records kept by maintenance","Both items are process safety information kept by the process engineer","The test record is PSI and the design basis belongs to MI","The design basis is PSI and the test record belongs to mechanical integrity"],"correct":3,"explanation":"The relief system design basis is required process safety information under Element 2, because it documents how the device was sized and for which scenarios. Inspection and test records of the installed device belong to mechanical integrity under Element 8. Filing them separately is common, but both must be retrievable.\n\n泄压系统设计依据属于要素 2 要求的工艺安全信息，用于记录装置如何定尺以及针对哪些情景。已安装装置的检验与测试记录则属于要素 8 的机械完整性。两类文件常分开存放，但都必须可调取。","related":[{"n":"2.5","t":"机械完整性与泄压"},{"n":"2.8","t":"工艺安全信息与流程图"}],"level":"application","topic":"Relief Basis vs Test Record"},{"text":"Which characteristic distinguishes a spring-loaded safety relief valve from a rupture disc?","group":2,"options":["The relief valve responds faster to a pressure surge in the line","The relief valve recloses below the set point; the disc must be replaced after bursting","The relief valve provides a zero-leakage seal during normal operation","The relief valve is used only upstream of a rupture disc in service"],"correct":1,"explanation":"A safety relief valve is spring-loaded and recloses automatically once pressure drops below the set point, so it can protect against repeated events. A rupture disc is non-reclosing and must be replaced after activation, but it responds faster and provides a zero-leakage seal. Discs are often installed upstream of a relief valve to isolate it from corrosive or fouling process fluid.\n\n安全泄压阀靠弹簧加载，压力回落到设定点以下会自动关闭，可重复保护。爆破片不可复位，爆破后必须更换，但响应更快且零泄漏。爆破片常装在泄压阀上游，使阀门与腐蚀性或易结垢的工艺介质隔离。","related":[{"n":"2.5","t":"机械完整性与泄压"}],"level":"recall","topic":"SRV vs Rupture Disc"},{"text":"Why is a rupture disc sometimes installed immediately upstream of a safety relief valve?","group":2,"options":["To isolate the valve from corrosive or fouling fluid and provide a tight seal","To raise the relief valve's set pressure above the vessel design pressure","To allow the relief valve to reclose faster after it has lifted","To eliminate the need for mechanical integrity inspection of the valve"],"correct":0,"explanation":"The disc shields the valve internals from corrosive, polymerizing, or solids-laden fluid and gives a bubble-tight seal, which extends valve life and reduces leakage. The trade-off is that the disc must be replaced after it bursts and the combination must be sized as a system. It does not change the set pressure or remove inspection obligations.\n\n爆破片保护阀门内部免受腐蚀性、易聚合或含固介质影响，并提供严密密封，从而延长阀门寿命、减少泄漏。代价是爆破后必须更换，且组合系统需整体定尺。它不改变设定压力，也不能免除检验义务。","related":[{"n":"2.5","t":"机械完整性与泄压"}],"level":"application","topic":"Rupture Disc Upstream of SRV"},{"text":"A relief system is being sized for a new vessel. Which scenarios should define the design basis?","group":2,"options":["Normal operating pressure and the highest recorded ambient temperature","Only the scenario that the PHA team considers to be the most likely","The worst credible scenarios, such as external fire, blocked outlet, and utility failure","Only the largest single relief load that the plant has ever experienced"],"correct":2,"explanation":"Relief devices must be sized for the worst credible scenario, considering external fire, blocked outlet, runaway reaction, thermal expansion, and utility failure, and the governing case sets the size. Sizing on normal conditions or on the most likely case under-protects the vessel. Past experience alone is not a design basis.\n\n泄压装置必须按最坏可信情景定尺，考虑外部火灾、出口堵塞、失控反应、热膨胀与公用工程失效，并以最严苛工况确定尺寸。按正常工况或最可能工况定尺会导致保护不足。仅凭历史经验也不构成设计依据。","related":[{"n":"2.5","t":"机械完整性与泄压"}],"level":"application","topic":"Relief System Design Basis"},{"text":"A gasket of the same dimensions but a different material is installed during a turnaround, selected because it was in stock. What is the correct PSM response?","group":2,"options":["No action, because the dimensions and the pressure rating are identical","Only a note in the maintenance log for the next turnaround","An incident investigation, because a change was made without prior approval","A management-of-change review, because compatibility may differ and the PSI must be updated"],"correct":3,"explanation":"Changing the material of construction is not a replacement in kind even when dimensions match, because compatibility with the process fluid and the temperature range may differ. MOC must confirm compatibility and update the PSI equipment data. A gasket that degrades in service becomes a leak path on a covered process.\n\n即使尺寸相同，更换构造材料也不属于同类替换，因为与工艺介质及温度范围的相容性可能不同。必须通过 MOC 确认相容性并更新 PSI 设备数据。在役劣化的垫片会成为受控工艺的泄漏通道。","related":[{"n":"2.6","t":"化学相容性与构造材料"}],"level":"application","topic":"Gasket Material Change"},{"text":"A janitorial crew stores sodium hypochlorite bleach next to an acid-based descaler in the same cabinet. What is the primary process-safety concern?","group":2,"options":["Loss of product potency over time in storage","Mixing will release chlorine gas, creating a toxic atmosphere","The two products will neutralize each other and clog the drain","Galvanic corrosion of the metal storage cabinet"],"correct":1,"explanation":"Hypochlorite plus acid releases chlorine gas, a classic incompatible-mixing scenario that can injure or kill in an enclosed space. Compatibility and inadvertent-mixing hazards are part of the PSI hazard information and must be evaluated in the PHA. Segregating incompatible materials is the engineering-level fix.\n\n次氯酸盐遇酸会释放氯气，是典型的禁配混合情景，在封闭空间内可致伤致死。相容性与意外混合危害属于 PSI 危害信息，必须在 PHA 中评估。隔离存放不相容物料是工程层级的解决办法。","related":[{"n":"2.6","t":"化学相容性与构造材料"}],"level":"application","topic":"Chemical Compatibility"},{"text":"Which of the following belongs to the equipment information block of process safety information?","group":2,"options":["Piping and instrumentation diagrams and the area electrical classification","The flash point and boiling point of the process chemical","The maximum intended inventory of the process","The process chemistry and the reaction kinetics"],"correct":0,"explanation":"PSI has three blocks: chemical hazard information, process technology information, and equipment information. P&IDs, materials of construction, electrical classification, relief system design basis, and safety systems belong to the equipment block. Flash point, inventory, and reaction chemistry belong to the chemical and technology blocks.\n\nPSI 分为三块：化学品危害信息、工艺技术信息与设备信息。P&ID、构造材料、电气分类、泄压系统设计依据与安全系统属于设备信息块。闪点、最大预期存量与反应化学属于化学品与工艺技术块。","related":[{"n":"2.8","t":"工艺安全信息与流程图"}],"level":"recall","topic":"PSI Equipment Block"},{"text":"A HAZOP team needs a drawing that shows every instrument, valve, control loop, and relief device in the unit being studied. Which document should be used?","group":2,"options":["The block flow diagram","The process flow diagram","The piping and instrumentation diagram","The facility site plan"],"correct":2,"explanation":"The P&ID is the most detailed diagram and is the standard basis for a HAZOP, because nodes are defined on it and every instrument and valve must be visible. A PFD shows major equipment and flows but omits many instruments, and a block flow diagram is only a conceptual overview. Using the wrong drawing causes the team to miss instrumentation and safeguards.\n\nP&ID 是最详细的图，是 HAZOP 的标准依据，因为节点依它划分，所有仪表与阀门都必须可见。PFD 只显示主要设备与物流，省略许多仪表；方框流程图仅是概念总览。用错图纸会导致团队遗漏仪表与防护设施。","related":[{"n":"2.8","t":"工艺安全信息与流程图"}],"level":"application","topic":"P&ID for HAZOP"},{"text":"What is the essential difference between OSHA PSM and EPA's Risk Management Program?","group":2,"options":["PSM covers only flammable liquids; RMP covers only toxic gases","RMP applies only to facilities with more than 100 employees","PSM requires a worst-case release scenario; RMP does not","PSM protects workers inside the fence line; RMP protects the public outside it"],"correct":3,"explanation":"PSM is an OSHA worker-safety standard for covered processes, while RMP implements the Clean Air Act amendments and addresses off-site consequences for the public and environment. RMP requires registration with EPA, off-site consequence analysis including a worst-case scenario, and coordination with local emergency planners. The prevention elements overlap substantially.\n\nPSM 是 OSHA 的工人安全标准，针对受控工艺；RMP 执行《清洁空气法》修正案，关注对厂外公众与环境的影响。RMP 要求向 EPA 注册、开展含最坏情景的厂外后果分析，并与地方应急计划机构协调。两者的预防要素有大量重叠。","related":[{"n":"2.7","t":"EPA RMP"}],"level":"recall","topic":"PSM vs RMP Scope"},{"text":"A facility is already in full compliance with OSHA PSM. Which additional obligation arises from being an RMP Program 3 facility?","group":2,"options":["Retaining PHA revalidation records for ten years instead of five","Submitting an RMP to EPA with off-site consequence analysis of release scenarios","Training operators every two years instead of every three","Installing additional relief valves on every covered process vessel"],"correct":1,"explanation":"RMP requires registration and submission to EPA of a risk management plan containing off-site consequence analysis, a prevention program, and an emergency response program. The prevention program largely mirrors PSM, so the new work is the consequence analysis, registration, and community coordination. RMP does not shorten PSM training intervals or mandate additional relief devices.\n\nRMP 要求向 EPA 注册并提交风险管理计划，内容包括厂外后果分析、预防计划与应急响应计划。预防计划与 PSM 大体对应，因此新增工作是后果分析、注册与社区协调。RMP 不会缩短 PSM 培训周期，也不强制增设泄压装置。","related":[{"n":"2.7","t":"EPA RMP"}],"level":"application","topic":"RMP Program 3 Obligations"},{"text":"A contractor crew will perform maintenance inside a PSM-covered process area. Which obligation belongs to the host employer under the contractor element?","group":2,"options":["Informing contractors of process hazards and keeping an injury and illness log","Directly supervising each contractor employee's work methods and tools","Providing the contractor's workers' compensation coverage for the job","Training the contractor's employees in their own trade skills"],"correct":0,"explanation":"The host employer must screen contractors, inform them of the process hazards, and maintain a log of contractor injuries and illnesses. The contractor remains responsible for training its own employees on the hazards and on safe work practices. Direct supervision of trade methods and compensation are not host-employer duties under this element.\n\n业主雇主必须筛选承包商、告知工艺危害，并保存承包商伤害与疾病记录。承包商仍负责对其员工进行危害与安全作业培训。直接监督工艺操作方法与提供工伤补偿，不属于本要素下的业主职责。","related":[{"n":"2.2","t":"PSM十四要素"}],"level":"application","topic":"Contractor Element"},{"text":"Which statement about the PSM incident investigation element is correct?","group":2,"options":["Investigations must begin within 24 hours and reports are kept for three years","Only incidents that caused an actual release must be investigated","Investigations must begin within 48 hours, and the report must be retained for five years","The investigation team may not include the operator who was on duty"],"correct":2,"explanation":"Element 11 requires investigation of incidents that resulted in or could reasonably have resulted in a catastrophic release, begun within 48 hours. The report must be retained for five years, and the team must include at least one person knowledgeable in the process, plus a contract employee if a contractor was involved. Incidents with catastrophic potential are therefore covered even without a release.\n\n要素 11 要求调查已导致或合理可能导致灾难性泄漏的事故，并在 48 小时内启动。报告须保存五年；团队必须包含至少一名熟悉该工艺的人员，若涉及承包商还应包括合同员工。因此即使未发生泄漏，具有灾难性后果潜力的事故也须调查。","related":[{"n":"2.2","t":"PSM十四要素"}],"level":"recall","topic":"Incident Investigation"},{"text":"A plant completed its last PSM compliance audit 40 months ago and retained only that report. Which statement identifies the deficiencies?","group":2,"options":["Only the retention is deficient; audits are required every five years","Only the interval is deficient; one report is sufficient","Neither is deficient, because the audit interval matches the PHA revalidation interval","Both are deficient: audits are required at least every three years and the two most recent reports must be kept"],"correct":3,"explanation":"Element 13 requires a compliance audit at least every three years, certified by a team that includes at least one person knowledgeable in the process, and retention of the two most recent audit reports. Forty months exceeds the three-year interval, and keeping only one report fails the retention requirement. The audit interval is independent of the five-year PHA cycle.\n\n要素 13 要求至少每三年做一次合规审核，由包含至少一名熟悉该工艺人员的团队认证，并保留最近两份审核报告。40 个月已超过三年周期，只保留一份报告也不符合保存要求。审核周期与五年一次的 PHA 复验周期相互独立。","related":[{"n":"2.2","t":"PSM十四要素"}],"level":"calculation","topic":"Compliance Audit Interval"},{"text":"An employer claims that certain process chemistry is a trade secret. What does the PSM trade secret element require?","group":2,"options":["Trade secret information may be withheld from everyone except OSHA","All information needed to comply with PSM must be made available to those doing the work","Trade secret information must be posted publicly at the plant entrance","Only corporate counsel may see trade secret information about the process"],"correct":1,"explanation":"Element 14 ensures that trade secret status cannot be used to block the people who must do PSM work from obtaining the information they need. Recipients may be required to sign confidentiality agreements, but access cannot be denied. Withholding information from PHA teams or procedure writers defeats the purpose of the standard.\n\n要素 14 确保不得以商业秘密为由阻止必须开展 PSM 工作的人员获取所需信息。可以要求接收者签署保密协议，但不能拒绝提供。向 PHA 团队或程序编写者隐瞒信息，会使标准的目的落空。","related":[{"n":"2.2","t":"PSM十四要素"}],"level":"recall","topic":"Trade Secrets Element"},{"text":"The PSM emergency planning and response element requires the employer to do which of the following?","group":2,"options":["Establish an emergency action plan per 1910.38(a) and small-release procedures","Rely entirely on the local fire department for all release response","Post the community emergency response plan at each process unit","Conduct a full-scale community evacuation drill every year"],"correct":0,"explanation":"Element 12 requires a plant-wide emergency action plan meeting 1910.38(a) plus specific procedures for handling small releases, and coordination with local emergency responders. Relying entirely on outside responders does not satisfy the element. Community drills and posting community plans are not what the element requires.\n\n要素 12 要求制定符合 1910.38(a) 的全厂应急行动计划，并针对小型泄漏制定具体处置程序，同时与当地应急响应机构协调。完全依赖外部救援不满足该要素。社区演练与张贴社区预案并非本要素的要求。","related":[{"n":"2.2","t":"PSM十四要素"}],"level":"application","topic":"Emergency Planning Element"},{"text":"A worker closes a disconnect on a 480-V panel and the fault produces a pressure wave that knocks him backward, ruptures an eardrum, and throws molten metal. Which electrical hazard produced these injuries?","group":3,"options":["Arc blast","Arc flash","Shock","Static discharge"],"correct":0,"explanation":"Arc blast is the pressure wave created by rapid expansion of superheated gas, and it causes blunt trauma, hearing damage, and flying debris. Arc flash is the radiant heat and light that burns skin and ignites clothing, while shock is current passing through the body. The three hazards are distinct and require different protective measures.\n\n弧爆是过热气体急速膨胀产生的压力波，造成钝性创伤、听力损伤与飞溅碎片。弧闪是辐射热与强光，造成烧伤并点燃衣物；电击是电流通过人体。三者是不同危害，需不同的防护措施。","related":[{"n":"3.1","t":"NFPA 70E电气安全"}],"level":"recall","topic":"Arc Blast Versus Arc Flash"},{"text":"An arc flash study calculates an incident energy of 8.5 cal/cm2 at the working distance for a task. Which PPE category applies?","group":3,"options":["Category 1","Category 2","Category 3","No category applies; the equipment must be de-energized"],"correct":2,"explanation":"Category 1 begins at 1.2 cal/cm2, Category 2 at 4 cal/cm2, Category 3 at 8 cal/cm2, and Category 4 at 25 cal/cm2. An 8.5 cal/cm2 exposure therefore falls in Category 3, which requires an arc-rated suit and hood over Category 2 underlayers. De-energizing is mandatory only above 40 cal/cm2, where no category exists.\n\n类别 1 从 1.2 cal/cm² 起，类别 2 从 4 cal/cm² 起，类别 3 从 8 cal/cm² 起，类别 4 从 25 cal/cm² 起。8.5 cal/cm² 属类别 3，需防弧服外套与头罩，内穿类别 2 内层。只有超过 40 cal/cm²、无对应类别时才必须断电。","related":[{"n":"3.1","t":"NFPA 70E电气安全"}],"level":"calculation","topic":"Arc Flash PPE Category"},{"text":"A study reports 45 cal/cm2 incident energy at a switchgear working distance. What is the correct course of action?","group":3,"options":["Use Category 4 PPE with an arc-rated suit and hood for the task","Do not perform energized work; de-energize, because no PPE category covers it","Use Category 3 PPE with double underlayers under a suit","Perform the task remotely while wearing Category 2 PPE"],"correct":1,"explanation":"Category 4 covers up to 40 cal/cm2, and beyond that level no PPE category exists because the blast pressure and heat would be unsurvivable in a suit. The equipment must be placed in an electrically safe work condition before work proceeds. Adding layers or working remotely in lower-rated PPE does not solve the exposure.\n\n类别 4 最高覆盖 40 cal/cm²，超过该水平不存在 PPE 类别，因为压力波与热量已超出防护服的可生存范围。作业前必须使设备达到电气安全工作条件。增加层数或用较低等级 PPE 远程作业都不能解决该暴露。","related":[{"n":"3.1","t":"NFPA 70E电气安全"}],"level":"calculation","topic":"Incident Energy Above 40"},{"text":"An unqualified employee drops a wrench inside the limited approach boundary of an energized 480-V panel. What does NFPA 70E require for retrieving it?","group":3,"options":["The employee may reach in quickly while wearing leather work gloves if the area is dry","The employee may enter if the panel cover is closed and latched in place","The employee may enter after signing a hold-harmless form approved by the plant","A qualified person must accompany and advise the employee, or the panel must be de-energized"],"correct":3,"explanation":"Unqualified persons may cross the limited approach boundary only when accompanied by a qualified person who advises them of the hazards, and the safer answer is always to de-energize. Ordinary leather gloves are not shock protection, and a closed cover does not remove the hazard when the boundary is crossed. Signed waivers have no standing under the standard.\n\n不合格人员只有在合格人员陪同并被告知危害时才能跨越限制接近边界；更安全的做法始终是断电。普通皮手套不提供电击防护，盖上盖板也不消除跨越边界时的危害。签署免责书在标准中没有效力。","related":[{"n":"3.2","t":"电气安全工作条件"}],"level":"application","topic":"Limited Approach Boundary"},{"text":"An electrician verifies a panel is de-energized by touching the tester to the terminals once and reading zero volts. He does not check the tester against a known live source before or after. What is the deficiency?","group":3,"options":["Nothing; a zero reading confirms the circuit is de-energized","The tester was not proved before and after, so a failed tester shows a false zero","He should have used a non-contact voltage pen instead of a meter","The panel should have been grounded before he tested for voltage"],"correct":1,"explanation":"The prove-test-prove sequence confirms the tester works on a known source, tests the circuit, then re-verifies the tester. Without it, a dead battery or failed lead produces a false zero reading on a live circuit. Temporary protective grounds are installed after absence of voltage is confirmed, not before.\n\n“验证—测试—再验证”要求先在已知带电电源上确认仪表可用，再测试电路，最后再验证仪表。缺少这一步时，电池耗尽或表笔失效会在带电电路上给出虚假的零电压读数。临时保护接地是在确认无电压之后安装，而不是之前。","related":[{"n":"3.2","t":"电气安全工作条件"}],"level":"application","topic":"Prove-Test-Prove"},{"text":"A plant wants to troubleshoot a live 480-V motor control center because shutting down would stop a continuous process for eight hours. Production argues the downtime is too costly. Is energized work justified under NFPA 70E?","group":3,"options":["No; the cost of downtime alone is not a justification for energized work","Yes; any production loss justifies energized work","Yes, provided the electrician wears Category 2 PPE","Yes, if the electrician has more than five years of experience"],"correct":0,"explanation":"NFPA 70E permits energized work only when de-energizing introduces additional or increased hazards, or when the task is infeasible in a de-energized state, such as diagnostic voltage testing. Production cost is not one of the recognized justifications. When energized work is justified, an energized electrical work permit, a risk assessment, and appropriate arc-rated PPE are required.\n\nNFPA 70E 仅在断电会引入额外或更大危害，或任务在断电状态下不可行（如诊断性电压测试）时才允许带电作业。生产损失成本不属于认可的正当理由。确需带电作业时，必须签发带电作业许可证、完成风险评估并穿戴相应等级防弧 PPE。","related":[{"n":"3.2","t":"电气安全工作条件"}],"level":"application","topic":"Energized Work Justification"},{"text":"A construction contractor decides not to use GFCIs on temporary 120-V, 15-A and 20-A receptacles and instead implements an assured equipment grounding conductor program. What does that program require?","group":3,"options":["Monthly visual inspection and annual continuity testing of cords","Continuity testing of every cord set once per year by the supplier","Daily visual inspection plus continuity tests at least every three months","A grounding audit only after an employee reports a shock"],"correct":2,"explanation":"The assured equipment grounding conductor program is the regulatory alternative to GFCIs and requires daily visual inspection of cord sets and plug-connected equipment plus continuity testing at intervals not exceeding three months. It also requires a written description of the program and recorded test results. Monthly or incident-driven testing does not meet the interval.\n\n“确保设备接地导体计划”（AEGCP）是 GFCI 的法规替代方案，要求对电源线组与插接设备每日目视检查，并至少每三个月做一次连续性测试，同时需有书面程序与测试记录。每月测试或事故后才测试不符合周期要求。","related":[{"n":"3.2","t":"电气安全工作条件"}],"level":"application","topic":"Assured Equipment Grounding"},{"text":"A worker with wet skin has a body resistance of about 1,000 ohms and contacts a 120-V source. Using Ohm's law, what current flows through the body?","group":3,"options":["1.2 mA","12 mA","1,200 mA","120 mA"],"correct":3,"explanation":"I = V/R = 120 / 1,000 = 0.12 A, or 120 mA. Currents in this range can cause ventricular fibrillation and are well above the let-go threshold of roughly 10 mA. This is why wet conditions are so dangerous: dry skin resistance of about 100,000 ohms would limit the same voltage to about 1.2 mA.\n\nI = V/R = 120 ÷ 1,000 = 0.12 A，即 120 mA。该量级电流可引起心室颤动，远高于约 10 mA 的摆脱阈值。这正是潮湿环境危险的原因：干燥皮肤电阻约 100,000 Ω，同一电压下电流仅约 1.2 mA。","related":[{"n":"3.2","t":"电气安全工作条件"}],"level":"calculation","topic":"Body Current Calculation"},{"text":"In a general-industry warehouse, a maintenance technician must replace a drive belt on a mezzanine platform whose walking surface is 5 feet above the concrete floor. Is fall protection required?","group":3,"options":["Yes; general industry requires fall protection at 4 feet","Yes, but only because the task lasts more than 15 minutes","No; fall protection is not required below 6 feet","No; mezzanines are exempt from fall protection requirements"],"correct":0,"explanation":"29 CFR 1910.28 requires fall protection for general-industry walking-working surfaces 4 feet or more above a lower level, so 5 feet is covered. The 6-foot trigger applies to construction under 1926.501. The duration of the task does not change the trigger height.\n\n29 CFR 1910.28 规定一般工业行走-工作表面距下层 4 英尺及以上即需坠落防护，因此 5 英尺已适用。6 英尺的触发高度适用于建筑业的 1926.501。作业持续时间不改变触发高度。","related":[{"n":"3.3","t":"坠落防护"}],"level":"application","topic":"General Industry Fall Trigger"},{"text":"Under 29 CFR 1926.760, at what height is conventional fall protection required for steel erection activities, and what special height applies to connectors in a controlled decking zone?","group":3,"options":["10 feet generally, and 15 feet for steel connectors","15 feet generally, and 30 feet for connectors in a CDZ","6 feet generally, and 15 feet for steel connectors","20 feet generally, and 25 feet for steel connectors"],"correct":1,"explanation":"Steel erection general activities require fall protection at 15 feet, and connectors working in a controlled decking zone may work at heights up to 30 feet without a personal fall arrest system. The CDZ must be controlled by a safety monitor and defined by a warning line. The 6-foot and 4-foot triggers for general construction and general industry do not govern steel erection.\n\n钢结构安装的一般活动在 15 英尺需坠落防护；在受控铺板区内作业的连接工可在最高 30 英尺不系个人防坠系统。CDZ 必须由安全监视员管控并以警示线界定。一般建筑与一般工业的 6 英尺、4 英尺触发高度不适用于钢结构安装。","related":[{"n":"3.3","t":"坠落防护"}],"level":"recall","topic":"Steel Erection Triggers"},{"text":"A worker's dorsal D-ring is at 20 feet. The only available anchorage is a beam at 18 feet, and he uses a 6-foot lanyard. What is the free fall distance, and does it comply with the 6-foot limit?","group":3,"options":["6 feet, so the system complies with the limit","4 feet, so the system complies with the limit","2 feet, so the system complies with the limit","8 feet, so the system does not comply with the limit"],"correct":3,"explanation":"Free fall equals the distance from the D-ring down to the anchorage plus the lanyard length: the anchorage is 2 feet below the D-ring, so 2 + 6 = 8 feet. Because 1926.502(d) limits free fall to 6 feet, the system does not comply and the anchorage must be raised to D-ring height or above. A self-retracting lifeline would reduce both free fall and required clearance.\n\n自由坠落距离等于 D 环到锚点的垂直距离加系索长度：锚点低于 D 环 2 英尺，故 2 + 6 = 8 英尺。1926.502(d) 规定自由坠落不超过 6 英尺，因此该布置不合规，必须把锚点提高到 D 环高度或以上。改用自缩式救生索可同时减小自由坠落与所需净空。","related":[{"n":"3.4","t":"坠落间隙与PFAS计算"}],"level":"calculation","topic":"Free Fall Distance"},{"text":"A welder on a steel beam wears a body belt attached to a short lanyard so he can lean back and use both hands while working. Is this acceptable?","group":3,"options":["No; body belts are prohibited in all construction work","No; body belts may only be used with a self-retracting lifeline","Yes, for positioning, provided a separate fall arrest system protects him against a fall","Yes; a body belt may serve as the fall arrest system if the lanyard is 2 feet or shorter"],"correct":2,"explanation":"Body belts are prohibited for fall arrest but may still be used for positioning, which supports a worker with both hands free. Because positioning systems are not designed to arrest a fall, a separate fall arrest system or other fall protection is required. A belt plus a short lanyard alone is not fall protection.\n\n身体腰带禁止用于防坠，但可用于定位，使工人双手自由作业。定位装置并非为制动坠落而设计，因此必须另有防坠系统或其他坠落防护。仅靠腰带加短系索不构成防坠落保护。","related":[{"n":"3.3","t":"坠落防护"},{"n":"3.4","t":"坠落间隙与PFAS计算"}],"level":"application","topic":"Body Belt for Positioning"},{"text":"A 24-foot extension ladder is set against a wall to reach a landing. Using the 4:1 rule, how far should the base be from the wall?","group":3,"options":["6 feet","4 feet","8 feet","12 feet"],"correct":0,"explanation":"The 4:1 rule sets one foot of base distance for every four feet of working height, so 24 / 4 = 6 feet. Setting the ladder too steeply risks tipping backward; too shallow risks the base sliding out. The side rails must also extend at least 3 feet above the landing.\n\n4:1 法则要求每 4 英尺工作高度外移 1 英尺，因此 24 ÷ 4 = 6 英尺。过陡易向后翻倒，过缓则底部易滑出。侧轨还须伸出着陆面至少 3 英尺。","related":[{"n":"3.6","t":"脚手架与梯子"}],"level":"calculation","topic":"Ladder Setup Angle"},{"text":"What is the maximum permitted uniform spacing of rungs on a portable ladder?","group":3,"options":["12 inches","14 inches","16 inches","18 inches"],"correct":1,"explanation":"OSHA requires uniformly spaced rungs at 14 inches or less on portable ladders, commonly stated as a range of 10 to 14 inches. Wider spacing makes climbing awkward and increases the chance of a slip. Rungs must also be skid-resistant and free of damage.\n\nOSHA 要求便携梯梯级等距且间距不超过 14 英寸，常见表述为 10 至 14 英寸。间距过大使攀爬吃力并增加滑落风险。梯级还须防滑且无损坏。","related":[{"n":"3.6","t":"脚手架与梯子"}],"level":"recall","topic":"Ladder Rung Spacing"},{"text":"A supported scaffold platform is being erected for masons. Which combination of dimensions meets OSHA requirements for platform width and distance from the work face?","group":3,"options":["At least 12 inches wide and within 24 inches of the face","At least 18 inches wide and within 24 inches of the face","At least 12 inches wide and within 14 inches of the face","At least 18 inches wide and within 14 inches of the face"],"correct":3,"explanation":"Scaffold platforms must be at least 18 inches wide unless a narrower platform is justified for a specific trade, and the platform must be no more than 14 inches horizontally from the work face (30 inches if outriggers are used). Greater gaps invite falls and dropped tools. Planks must also be fully decked with gaps no more than 1 inch.\n\n脚手架平台宽度至少 18 英寸（特定工种可使用更窄平台），且距作业面水平距离不超过 14 英寸（使用悬挑架时为 30 英寸）。间隙过大易导致坠落与落物。脚手板还须满铺，板间缝隙不超过 1 英寸。","related":[{"n":"3.6","t":"脚手架与梯子"}],"level":"recall","topic":"Scaffold Platform Dimensions"},{"text":"A scaffold plank spans 10 feet between supports. Using the 1/60 of span deflection limit, what is the maximum permitted deflection?","group":3,"options":["0.5 inch","1 inch","2 inches","3 inches"],"correct":2,"explanation":"The limit is span divided by 60: 120 inches / 60 = 2 inches. Deflection beyond that indicates the plank is under-strength or overloaded and may fail or trip workers. Planks must also be rated for the intended load and inspected for damage before each shift.\n\n限值为跨度除以 60：120 英寸 ÷ 60 = 2 英寸。超过该挠度说明脚手板强度不足或超载，可能断裂或绊倒工人。脚手板还必须按预期荷载定级，并在每班前检查有无损坏。","related":[{"n":"3.6","t":"脚手架与梯子"}],"level":"calculation","topic":"Scaffold Plank Deflection"},{"text":"An inspector measures a new guardrail: the top rail is 46 inches above the walking surface and the vertical members are spaced 24 inches apart. What is the correct finding?","group":3,"options":["Both are noncompliant: the rail must be 42 +/- 3 inches and members no more than 19 inches apart","Only the top rail height of 46 inches is noncompliant with the 42-inch requirement","Only the 24-inch spacing of the vertical members is noncompliant with the 19-inch limit","Both dimensions comply with the guardrail requirements of 29 CFR 1926.502"],"correct":0,"explanation":"1926.502 requires a top rail 42 inches plus or minus 3 inches above the walking surface, so 46 inches is outside the tolerance, and intermediate vertical members must be no more than 19 inches apart, so 24 inches fails. The rail must also withstand a 200-lb force applied within 2 inches of the top edge without deflecting below 39 inches. Both defects must be corrected before acceptance.\n\n1926.502 要求顶栏高出行走面 42 英寸 ±3 英寸，46 英寸超出公差；中间垂直构件间距不得超过 19 英寸，24 英寸不合格。顶栏还须在顶部边缘 2 英寸内承受 200 磅力而挠度不低于 39 英寸。两项缺陷都必须整改后才能验收。","related":[{"n":"3.3","t":"坠落防护"}],"level":"application","topic":"Guardrail As-Built Dimensions"},{"text":"A controlled decking zone is being laid out for steel decking. What are the permitted width limits and the required marking?","group":3,"options":["At least 6 feet wide and no more than 60 feet wide, marked with a solid barricade","At least 2 feet wide and no more than 90 feet wide, with a warning line at the boundary","At least 10 feet wide and no more than 45 feet wide, marked with caution tape","Any width, provided a safety monitor is present"],"correct":1,"explanation":"A CDZ must be at least 2 feet wide and no more than 90 feet wide, defined by a warning line at the boundary, with a safety monitor controlling access. Within the zone, steel deckers may work without a personal fall arrest system. Outside those limits the zone is invalid and conventional fall protection is required.\n\nCDZ 宽度至少 2 英尺、不超过 90 英尺，边界设警示线，并由安全监视员控制进入。区内钢结构铺板工可不系个人防坠系统作业。超出该尺寸则区域不成立，必须采用常规坠落防护。","related":[{"n":"3.5","t":"附加坠落防护要求"}],"level":"recall","topic":"Controlled Decking Zone"},{"text":"A 30-inch by 30-inch floor opening is covered with plywood so material can be moved across it, and workers step on the cover. What is required?","group":3,"options":["The cover may be loose as long as it is painted yellow and marked","The cover must be marked but need not be secured against movement","The cover must be secured but need not be marked as an
