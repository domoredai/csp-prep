 opening","The cover must support twice the load, be secured, and be marked HOLE or COVER"],"correct":3,"explanation":"Hole covers must support twice the weight of the employees, equipment, and materials imposed on them, must be secured to prevent accidental displacement, and must be color-coded or marked with the word HOLE or COVER. An unsecured cover is a classic fall-through and struck-by hazard. Marking alone does not substitute for strength and security.\n\n孔洞盖板必须能承受员工、设备与材料重量之和的两倍，必须固定以防意外移位，并以颜色标识或标注 HOLE/COVER。未固定的盖板是典型的坠穿与落物危害。仅做标识不能替代强度与固定。","related":[{"n":"3.5","t":"附加坠落防护要求"}],"level":"application","topic":"Hole Cover Requirements"},{"text":"A worker's personal fall arrest system arrests his fall and he is left hanging in his harness. Why must rescue be prompt?","group":3,"options":["Because harness straps loosen over time under load","Because the lanyard must be replaced after any fall","Because suspension trauma can develop in under 15 minutes","Because the anchorage may fail under sustained loading"],"correct":2,"explanation":"Motionless suspension in a harness causes blood to pool in the legs and can lead to loss of consciousness and death in a short time, commonly cited as under 15 minutes. Employers must therefore plan for prompt rescue, and self-rescue or assisted rescue equipment should be available. Lanyard replacement and anchorage capacity are separate concerns.\n\n在安全带中静止悬挂会使血液滞留于下肢，短时间内即可导致意识丧失甚至死亡，通常引述为 15 分钟以内。因此雇主必须预先安排及时救援，并配备自救或辅助救援装备。系索更换与锚点承载力属于另外的问题。","related":[{"n":"3.5","t":"附加坠落防护要求"}],"level":"application","topic":"Suspension Trauma"},{"text":"A worker wearing a loose long-sleeved shirt is pulled into the nip point of unguarded rotating rollers on a conveyor. How is this hazard classified, and what is the primary control?","group":3,"options":["Caught-in/between; a fixed guard covering the nip point","Struck-by; a hard hat and safety glasses","Fall; a guardrail along the conveyor","Electrical; GFCI protection on the conveyor motor"],"correct":0,"explanation":"Being pulled into and crushed by machine parts is a caught-in/between hazard, one of OSHA's Fatal Four in construction. The primary control is an engineering guard covering the nip point, supplemented by rules against loose clothing. PPE does not prevent entanglement.\n\n被机器部件卷入并挤压属于卷入/挤压危害，是 OSHA 建筑施工“致命四项”之一。主要控制是覆盖夹入点的工程防护罩，辅以禁止穿着宽松衣物的规定。PPE 无法防止缠绕。","related":[{"n":"3.9","t":"常见工作场所危害"}],"level":"recall","topic":"Caught-In Hazard"},{"text":"A crane is slewing a steel beam over an area where employees are tying rebar. What combination BEST controls the struck-by hazard?","group":3,"options":["Requiring hard hats and warning the crew by radio during the lift","Excluding employees from the swing radius, using tag lines, and posting a signal person","Increasing the lift speed so the load passes over the crew quickly","Having the operator sound the horn continuously throughout the lift"],"correct":1,"explanation":"Swinging loads are a struck-by hazard, and the effective controls are an exclusion zone under and around the load path plus tag lines to keep the load from rotating, with a signal person coordinating the lift. Hard hats and horns are supplementary warnings, not the primary control. Faster lifting increases the hazard.\n\n摆动荷载属于物体撞击危害，有效措施是在吊运路径下方及周边设禁入区、用牵引绳控制荷载旋转，并由信号员统一指挥。安全帽与鸣笛只是辅助警示，不是主要控制。加快吊运反而增大风险。","related":[{"n":"3.9","t":"常见工作场所危害"}],"level":"application","topic":"Crane Swing Radius"},{"text":"A forklift's data plate rates the truck at 5,000 lb at a 24-inch load center. An operator must lift a 4,200-lb load whose center is 36 inches from the fork face, to a height of 18 feet. What should the safety professional advise?","group":3,"options":["The lift is acceptable because 4,200 lb is below the 5,000-lb rating","The lift is acceptable if the load is tilted fully back on the forks","The lift is acceptable if a spotter walks in front of the truck","Capacity drops as the load center moves out and as height increases; check the load chart"],"correct":3,"explanation":"Rated capacity applies at a stated load center and often at a stated height; moving the center of gravity outward or lifting higher reduces the capacity. The operator must consult the load chart for the actual configuration rather than compare weight to the plate rating. A spotter addresses visibility, not stability.\n\n额定载重是在规定的荷载中心（常常还有规定高度）下的数值；重心外移或举升更高都会降低实际承载能力。操作者必须针对实际工况查阅载荷表，而不能只把重量与铭牌数字比较。观察员解决的是视野问题，不是稳定性问题。","related":[{"n":"4.8","t":"物料搬运与储存"}],"level":"application","topic":"Forklift Load Center"},{"text":"A forklift operator must move a load that blocks his forward view. What is the correct practice?","group":3,"options":["Raise the load above eye level so he can see underneath it","Travel forward slowly with a spotter walking backward","Travel in reverse with the load tilted back and carried low, or use a spotter","Move the load in two smaller trips only if it is convenient"],"correct":2,"explanation":"When the load obstructs forward view, the operator should travel in reverse, keeping the load tilted back and as low as practical. Raising the load to see under it shifts the center of gravity and destabilizes the truck. A spotter may assist, but reverse travel is the standard practice.\n\n当荷载遮挡前视时，操作者应倒车行驶，保持荷载后倾并尽量降低。把荷载升高以便从下方看路会抬高重心、使叉车失稳。观察员可以协助，但标准做法是倒车行驶。","related":[{"n":"4.8","t":"物料搬运与储存"}],"level":"application","topic":"Forklift Travel Practice"},{"text":"A crane operator cannot see the load during part of a blind lift around a building corner. What is required?","group":3,"options":["A qualified signal person must direct the lift","The operator may proceed slowly using mirrors","The lift may proceed if the load weighs under 2,000 lb","Radio contact with any employee on the far side is sufficient"],"correct":0,"explanation":"A signal person is required whenever the operator cannot see the load throughout the lift, and the signal person must be qualified through a third-party or employer evaluator. The signal person must also be competent in the signals used. Unqualified employees relaying radio messages do not satisfy the requirement.\n\n只要操作员无法在整个吊运过程中看到荷载，就必须配备信号员，且信号员须经第三方或雇主评估员认定合格。信号员还必须熟练掌握所用信号。由不合格员工用无线电转述不满足要求。","related":[{"n":"4.8","t":"物料搬运与储存"}],"level":"application","topic":"Crane Signal Person"},{"text":"A crane will operate near an energized overhead power line rated at 45 kV. What minimum clearance must be maintained?","group":3,"options":["6 feet","10 feet","15 feet","20 feet"],"correct":1,"explanation":"For lines of 50 kV or less, the minimum clearance is 10 feet, and the required distance increases with voltage above 50 kV. The clearance applies to the crane, the load, and the rigging, and a dedicated spotter or proximity alarm is often required. Moving closer requires the line to be de-energized or controlled by the utility.\n\n50 kV 及以下线路的最小接近距离为 10 英尺；超过 50 kV 时距离随电压升高而增加。该距离适用于起重机、荷载与索具，通常还需专职观察员或近电报警器。若需更近，必须由电力部门停电或采取控制措施。","related":[{"n":"4.8","t":"物料搬运与储存"}],"level":"recall","topic":"Crane Power Line Clearance"},{"text":"During a pre-shift inspection, a wire rope sling shows a broken safety latch on the hook and about 12% abrasion loss on one leg. What is the correct action?","group":3,"options":["Return it to service if the load is less than half the rated capacity","Repair the latch with wire and continue using the sling today","Use the sling but shorten it to avoid the worn section of rope","Remove it from service; a damaged latch and wear beyond criteria require withdrawal"],"correct":3,"explanation":"Rigging hardware must be inspected before each shift and removed from service for cracks, deformation, missing or damaged safety latches, or wear beyond the removal criteria, commonly about 10% loss of the original dimension. A broken latch allows the load to slip off the hook. Field repairs and derating are not acceptable substitutes for removal.\n\n索具硬件必须在每班前检查，出现裂纹、变形、安全锁扣缺失或损坏、或磨损超过报废标准（通常为原始尺寸损失约 10%）时须停用。锁扣损坏会使荷载从吊钩滑脱。现场修补或降级使用都不能替代停用。","related":[{"n":"4.8","t":"物料搬运与储存"}],"level":"application","topic":"Sling Removal Criteria"},{"text":"Who must inspect a personal fall arrest harness and lanyard, and how often?","group":3,"options":["The manufacturer, every six months without exception","A third-party inspector, every 12 months only","The user before each use, plus periodic competent person inspection","The site superintendent, once per project at closeout"],"correct":2,"explanation":"OSHA requires the equipment to be inspected by the user before each use, and a periodic inspection by a competent person is widely accepted as best practice. Damaged equipment, or equipment that has arrested a fall, must be removed from service immediately. Annual third-party inspection is a manufacturer or program requirement, not the OSHA baseline.\n\nOSHA 要求使用者每次使用前检查，定期由合格人员检查则被广泛视为最佳实践。损坏的或已经历过坠落的装备必须立即停用。年度第三方检查属于制造商或项目计划的要求，并非 OSHA 的基本要求。","related":[{"n":"3.5","t":"附加坠落防护要求"}],"level":"recall","topic":"PFAS Inspection"},{"text":"A worker must tie off to a structural steel beam, and the lanyard will contact the beam's edge during a fall. What must the safety professional verify?","group":3,"options":["That the lanyard is rated for sharp edges, or an edge protector is used","That the lanyard is made of wire rope instead of webbing","That the worker uses a body belt rather than a harness","That the anchorage is at least 12 feet above the D-ring"],"correct":0,"explanation":"Standard webbing can be cut by a sharp edge under fall loads, so the connector must be certified for sharp-edge conditions or protected with an abrasion-resistant cover. Wire rope is not automatically acceptable, and body belts are prohibited for fall arrest. Anchorage height affects free fall and clearance, not edge protection.\n\n普通织带在坠落荷载下可能被锐边割断，因此连接器必须通过锐边条件认证，或加装耐磨护套。钢丝绳并不自动符合要求，身体腰带则禁止用于防坠。锚点高度影响自由坠落与净空，与锐边防护无关。","related":[{"n":"3.4","t":"坠落间隙与PFAS计算"}],"level":"application","topic":"Sharp Edge Protection"},{"text":"A scaffold has been erected and will be used for a week of work. What inspection requirement applies?","group":3,"options":["A one-time inspection at erection, documented in the project file","Inspection by a competent person before each shift and after any event","Inspection by the manufacturer's representative every third day","Inspection only if a worker reports a structural concern"],"correct":1,"explanation":"A competent person must inspect the scaffold and its components before each work shift and after any event — high wind, impact, modification — that could affect structural integrity. The competent person also determines whether it is safe to use. A single erection inspection does not cover a week of changing conditions.\n\n合格人员必须在每个工作班次前，以及大风、碰撞、改动等任何可能影响结构完整性的情况发生后检查脚手架及其构件。合格人员还负责判定其是否可安全使用。一次性的搭设验收无法覆盖一周内变化的工况。","related":[{"n":"3.6","t":"脚手架与梯子"}],"level":"application","topic":"Scaffold Inspection"},{"text":"A permit space has an oxygen-deficient atmosphere that is corrected only by continuous forced-air ventilation. May the employer reclassify it as a non-permit confined space for the entry?","group":4,"options":["Yes, because the atmosphere is now acceptable for entry","Yes, if the entrant wears a personal oxygen monitor","No; ventilation controls the hazard rather than eliminating it","Yes, provided the entry lasts less than one hour"],"correct":2,"explanation":"A permit space may be reclassified as non-permit only when all hazards are eliminated, not merely controlled. Forced-air ventilation keeps oxygen in range, but the deficiency returns if the ventilation stops, so the hazard is controlled rather than eliminated. Acceptable test results likewise do not by themselves eliminate the atmospheric hazard.\n\n只有当所有危害被消除（而非仅仅被控制）时，许可空间才可重新划分为非许可空间。强制通风虽能把氧含量维持在范围内，但一旦停风缺氧就会重现，因此危害只是被控制而非消除。检测结果合格本身也不等于消除大气危害。","related":[{"n":"4.1","t":"密闭空间"}],"level":"application","topic":"Space Reclassification"},{"text":"A combustible gas has a lower explosive limit of 4.0% by volume in air. A calibrated meter reads 8% LEL in a confined space. What is the actual gas concentration?","group":4,"options":["0.32% by volume","0.50% by volume","2.00% by volume","8.00% by volume"],"correct":0,"explanation":"A reading of 8% LEL means the concentration is 8% of the lower explosive limit: 0.08 x 4.0% = 0.32% by volume. Entry is allowed below 10% LEL, so this space passes the flammability test, but oxygen and toxics must also be tested. A meter reading expressed in % LEL is not the same as % by volume.\n\n8% LEL 表示浓度达到爆炸下限的 8%：0.08 × 4.0% = 0.32%（体积分数）。低于 10% LEL 允许进入，因此该空间在可燃性上合格，但仍须检测氧气与有毒气体。以 %LEL 表示的读数并不等于体积百分比。","related":[{"n":"4.2","t":"大气检测与监测"}],"level":"calculation","topic":"LEL Percent Conversion"},{"text":"A 12-foot-deep trench in Type C soil must have a 5-foot-wide bottom to fit a pipe and its bedding. Using the required 1.5:1 slope, what is the cutback on each side, and what is the total width at the top?","group":4,"options":["12 feet per side; 29 feet total","18 feet per side; 23 feet total","8 feet per side; 21 feet total","18 feet per side; 41 feet total"],"correct":3,"explanation":"A 1.5:1 slope means 1.5 feet horizontal for each foot of depth, so the cutback is 12 x 1.5 = 18 feet per side. Total top width = 5 + 18 + 18 = 41 feet. The 23-foot distractor comes from adding only one side's cutback to the bottom width, which understates the excavation by 18 feet.\n\n1.5:1 放坡即每 1 英尺深度外放 1.5 英尺，因此每侧外放 12 × 1.5 = 18 英尺。顶部总宽 = 5 + 18 + 18 = 41 英尺。23 英尺这一干扰项只把单侧外放量加到坑底宽度上，少算了 18 英尺。","related":[{"n":"4.6","t":"挖掘与沟槽"}],"level":"calculation","topic":"Type C Sloping Calculation"},{"text":"An 8-foot-deep excavation in stable Type A clay will be sloped. How far back must each side be cut, and what slope ratio applies?","group":4,"options":["6 feet back at 1:1","6 feet back at 0.75:1","12 feet back at 1.5:1","4 feet back at 0.5:1"],"correct":1,"explanation":"Type A soil permits the steepest slope, 0.75:1, so the cutback is 8 x 0.75 = 6 feet per side. Type A must be cohesive with an unconfined compressive strength of at least 1.5 tons per square foot, and cannot be fissured, subject to vibration, or previously disturbed. If any of those apply, the soil must be downgraded and the slope flattened.\n\nA 型土允许最陡坡度 0.75:1，因此外放 8 × 0.75 = 6 英尺/侧。A 型土必须是黏性土，无侧限抗压强度至少 1.5 吨/平方英尺，且不得有裂缝、受振动影响或曾被扰动。若存在上述情况须降级并放缓坡度。","related":[{"n":"4.6","t":"挖掘与沟槽"}],"level":"calculation","topic":"Type A Sloping Calculation"},{"text":"A mechanical press is locked out. It has a rotating flywheel, a charged hydraulic accumulator, and a die block raised on its own weight. Before a technician reaches into the die area, what must be done?","group":4,"options":["Nothing further; the lock and tag isolate all of the energy","Only the electrical disconnect must be verified as open","Release, block, or dissipate the stored energy, then verify isolation","The technician should work quickly while the flywheel turns"],"correct":2,"explanation":"Lockout isolates the supply but does not remove stored energy. Step 6 of the LOTO procedure requires releasing, blocking, or dissipating residual energy — bleeding hydraulic pressure, blocking the raised die, and letting the flywheel stop — and then verifying isolation by attempting a start. Ignoring stored energy is a common cause of amputations and fatalities.\n\n上锁隔离了能量来源，但并未移除储存能量。LOTO 程序的第 6 步要求释放、阻断或消散残余能量——泄掉液压压力、支撑抬起的安全块、等待飞轮停转——然后尝试启动以验证隔离。忽视储存能量是造成截肢与死亡事故的常见原因。","related":[{"n":"4.4","t":"上锁挂牌"}],"level":"application","topic":"Stored Energy After Lockout"},{"text":"Who must perform the periodic inspection of a LOTO energy control procedure, and what must be documented?","group":4,"options":["An authorized employee other than the one using the procedure, with a certification","The plant manager, with a memo sent to corporate safety for filing","The equipment manufacturer, with a warranty statement for the device","Any affected employee who works in the area, with a note in the shift log"],"correct":0,"explanation":"1910.147(c)(6) requires inspection at least annually by an authorized employee other than the one using the procedure, to correct deviations and review responsibilities. The certification must identify the machine or equipment, the date of inspection, the employees included, and the person performing the inspection. Self-inspection defeats the purpose.\n\n1910.147(c)(6) 要求至少每年由非使用该程序的授权员工进行检查，以纠正偏差并复核职责。认证记录须注明机器或设备、检查日期、涉及的员工以及检查人。由使用者自查则失去意义。","related":[{"n":"4.5","t":"LOTO职责与程序"}],"level":"recall","topic":"LOTO Periodic Inspection"},{"text":"A repair on a locked-out conveyor is complete. What is the correct sequence for returning it to service?","group":4,"options":["Remove the locks, then notify affected employees, then walk the area","Notify affected employees, then remove the locks, then inspect the area","Remove the locks and start the conveyor to confirm the repair worked","Inspect the area, have each employee remove their own lock, then notify"],"correct":3,"explanation":"Before re-energizing, the area must be inspected to confirm tools are removed and guards replaced, all employees must be clear of the equipment, and each authorized employee removes their own lock and tag. Only then are affected employees notified that the equipment may be restarted. Starting the equipment to confirm the repair is exactly the exposure LOTO exists to prevent.\n\n重新送电前必须检查现场，确认工具已撤出、防护装置已复位、所有员工已远离设备，并由每名授权员工摘除自己的锁具与标签。之后才通知受影响员工设备可以重启。用试启动来“确认修好”，恰恰是 LOTO 要防止的暴露。","related":[{"n":"4.5","t":"LOTO职责与程序"}],"level":"application","topic":"Return to Service"},{"text":"A 20-foot-deep vault must be tested before entry. The meter shows acceptable readings when sampled at the top. What must the attendant and entrant do next?","group":4,"options":["Proceed, because the top reading is representative","Test at the middle and bottom as well, because gases can stratify by density","Wait 30 minutes and re-test only the top","Test only the bottom, since the top has already passed"],"correct":1,"explanation":"Atmospheres stratify: hydrogen sulfide and carbon dioxide are heavier than air, while methane and hydrogen are lighter, so a single top sample can miss a hazardous layer. Pre-entry testing must cover the top, middle, and bottom of the space, and continuous monitoring of the breathing zone is required where the atmosphere may change. A clean reading at one level is not a clean space.\n\n气体会分层：硫化氢与二氧化碳比空气重，甲烷与氢比空气轻，因此只测顶部可能漏掉危险层。进入前检测必须覆盖空间顶部、中部与底部；气氛可能变化时还须对呼吸区连续监测。某一层读数合格并不代表整个空间合格。","related":[{"n":"4.2","t":"大气检测与监测"}],"level":"application","topic":"Stratified Atmosphere Testing"},{"text":"Pre-entry testing of a tank that was just purged with oxygen shows 24.5% O2, 0% LEL, and no toxics. What is the correct interpretation?","group":4,"options":["The space is safe because oxygen is well above the 19.5% minimum","The space is safe if the entrants wear a respirator during entry","The space is oxygen-enriched, which sharply increases the fire risk","The space is acceptable if the entry is kept short in duration"],"correct":2,"explanation":"The acceptable oxygen range is 19.5% to 23.5%, so 24.5% is oxygen-enriched, and elevated oxygen makes clothing and materials burn violently. Entry must not proceed until the enrichment is corrected by ventilation and the space is re-tested. A high oxygen reading is never extra safe.\n\n可接受的氧含量范围为 19.5% 至 23.5%，24.5% 属于富氧，会使衣物与材料剧烈燃烧。必须通过通风并复测把氧含量纠正后才能进入。氧含量高绝不等于更安全。","related":[{"n":"4.2","t":"大气检测与监测"}],"level":"application","topic":"Oxygen Enrichment"},{"text":"Continuous monitoring of an occupied permit space shows the combustible gas reading rising from 8% to 12% LEL. What does the standard require?","group":4,"options":["Entrants must leave the space, because entry is not permitted at or above 10% LEL","Entrants may continue but must re-test every hour","Entrants may continue if they wear respiratory protection","Entrants may continue until the reading reaches 25% LEL"],"correct":0,"explanation":"The entry threshold is below 10% LEL; a reading of 10% to 25% LEL permits continued monitoring but no entry, and at or above 25% LEL the atmosphere is immediately dangerous to life or health. At 12% LEL the entrants must evacuate, and the space must be re-evaluated and ventilated before re-entry. Respiratory protection does not make a flammable atmosphere acceptable.\n\n进入阈值为低于 10% LEL；10% 至 25% LEL 可继续监测但禁止进入；达到或超过 25% LEL 即为立即危及生命或健康。读数 12% LEL 时进入者必须撤离，重新评估并通风后才能再次进入。呼吸防护不能使可燃气氛变得可接受。","related":[{"n":"4.2","t":"大气检测与监测"}],"level":"application","topic":"Rising LEL Reading"},{"text":"What is the minimum required frequency for a permit-space rescue team to practice actual permit space rescues?","group":4,"options":["Once every three months","Once every six months","Once every two years","At least once every 12 months"],"correct":3,"explanation":"1910.146(k)(2)(iv) requires rescue team members to practice permit space rescues at least once every 12 months, using the actual configuration and equipment. Practice must simulate a real rescue rather than a walkthrough. Non-entry rescue with a retrieval system is preferred whenever it is feasible.\n\n1910.146(k)(2)(iv) 要求救援队成员至少每 12 个月进行一次许可空间救援演练，并使用实际的空间配置与装备。演练必须模拟真实救援，而不是走流程。在可行时应优先采用救援绳系统的非进入救援。","related":[{"n":"4.3","t":"进入程序与救援"}],"level":"recall","topic":"Rescue Team Practice"},{"text":"An attendant is monitoring two entrants in a manhole when a supervisor asks him to help move a barricade 50 feet away. What should the attendant do?","group":4,"options":["Help quickly, because the entrants are only 20 feet down","Refuse and stay at the entry, because monitoring duties cannot be shared","Ask one entrant to come out and watch the entry instead","Leave an untrained worker in place and monitor by radio"],"correct":1,"explanation":"The attendant must remain outside the space, maintain an accurate count of entrants, and have no other duties that could interfere with monitoring. Leaving the post, even briefly, removes the only person who can summon rescue or order evacuation. An untrained replacement is not acceptable.\n\n监护员必须留在空间外、准确掌握进入人数，且不得承担任何可能干扰监护的其他职责。哪怕短暂离岗，也会使唯一能呼救或下令撤离的人缺位。用未受训人员顶替也不可接受。","related":[{"n":"4.1","t":"密闭空间"},{"n":"4.3","t":"进入程序与救援"}],"level":"application","topic":"Attendant Duties"},{"text":"A utility crew plans a 6-foot-deep trench in Type B soil. The competent person says no protective system is needed because the soil looks solid. What is the correct determination?","group":4,"options":["The competent person is correct if no water is present","A protective system is required only above 8 feet","A protective system is required at 5 feet or deeper, unless in stable rock","Shoring is required, but sloping is never permitted in Type B soil"],"correct":2,"explanation":"1926.652 requires a protective system for excavations 5 feet or deeper unless the excavation is made entirely in stable rock. Type B soil permits sloping at 1:1, benching, shoring, or a trench box, so several options exist but one is mandatory. Below 5 feet, a protective system is still required if the competent person finds a potential cave-in hazard.\n\n1926.652 要求深度 5 英尺及以上的挖掘必须设防护系统，除非整个开挖位于稳定岩层中。B 型土可采用 1:1 放坡、台阶式开挖、支撑或沟槽箱，选择多样但必须选一种。深度不足 5 英尺时，若合格人员判定存在坍塌可能，仍须设防护系统。","related":[{"n":"4.6","t":"挖掘与沟槽"}],"level":"application","topic":"Protective System Requirement"},{"text":"Excavated soil is being stockpiled beside a 7-foot-deep trench. Where must the spoil be placed?","group":4,"options":["At least 2 feet back from the edge of the excavation","At least 6 inches back from the edge","Directly at the edge so it can be used for backfill quickly","On the opposite side of the trench from the access ladder only"],"correct":0,"explanation":"Spoil piles, equipment, and materials must be kept at least 2 feet from the edge of the excavation, because the surcharge load can trigger a collapse. The added weight and vibration are especially dangerous in Type C soil. Keeping the spoil close for convenience is a recognized contributing cause of trench fatalities.\n\n弃土、设备与材料必须距挖掘边缘至少 2 英尺，因为附加荷载可能诱发坍塌。在 C 型土中，附加重量与振动尤其危险。为图方便把弃土堆在坑边，是沟槽死亡事故的公认诱因之一。","related":[{"n":"4.7","t":"关键挖掘要求"}],"level":"recall","topic":"Spoil Pile Setback"},{"text":"A trench is 7 feet deep. A portable ladder will be used for egress. What minimum ladder length above the trench floor satisfies the requirement?","group":4,"options":["7 feet","8 feet","9 feet","10 feet"],"correct":3,"explanation":"Ladders used for access must extend at least 3 feet above the landing, so a 7-foot-deep trench needs a ladder reaching at least 10 feet above the trench floor. A ladder flush with the top gives no handhold and is a common citation. Trenches over 4 feet deep also require egress within 25 feet of lateral travel.\n\n用于进出的梯子必须伸出落脚面至少 3 英尺，因此 7 英尺深的沟槽需要梯子高出沟底至少 10 英尺。梯子与坑口齐平则没有抓手，是常见的违规项。深度超过 4 英尺的沟槽还要求横向 25 英尺内可进出。","related":[{"n":"4.7","t":"关键挖掘要求"}],"level":"calculation","topic":"Trench Ladder Length"},{"text":"A competent person is walking an open trench at the start of the shift. Which areas must that inspection cover?","group":4,"options":["Only the trench walls and the protective system installed against them","The excavation, the adjacent areas around it, and the protective systems","Only the section of the trench where workers will stand that day","Only the spoil pile and the access ladder"],"correct":1,"explanation":"1926.651(k)(1) requires the competent person to inspect the excavation, the adjacent areas, and the protective systems before work begins each day and after any event that could increase the hazard. Adjacent areas matter because surcharge loads, cracked pavement, or a leaking utility can undermine the walls even when the trench itself looks sound. Inspecting only the walls misses the conditions that most often cause collapse.\n\n1926.651(k)(1) 要求合格人员在每日开工前以及任何可能增加危害的情况发生后，检查挖掘区域、相邻区域与防护系统。相邻区域之所以重要，是因为附加荷载、开裂的路面或渗漏的管线都可能削弱坑壁，即使沟槽本身看起来完好。只检查坑壁会漏掉最常导致坍塌的那些条件。","related":[{"n":"4.6","t":"挖掘与沟槽"}],"level":"recall","topic":"Scope of Excavation Inspection"},{"text":"A contractor proposes benching the walls of a 10-foot-deep excavation in Type C sand. What is the correct response?","group":4,"options":["Benching is acceptable if each bench is under 4 feet high","Benching is acceptable if a competent person approves it","Benching is barred in Type C soil; slope at 1.5:1, shore, or use a trench box","Benching is preferred in Type C soil because it removes less soil"],"correct":2,"explanation":"Benching is prohibited in Type C soil because the material will not stand at a bench; 1926.652 requires sloping at 1.5:1, shoring, shielding, or another approved system. Sand, gravel, submerged soil, and soil from which water seeps are Type C. Treating Type C as stable is a recurring cause of fatal cave-ins.\n\nC 型土禁止台阶式开挖，因为该土体无法在台阶上自立；1926.652 要求按 1.5:1 放坡、支撑、防护箱或其他认可系统。砂、砾石、淹没土以及渗水的土均属 C 型。把 C 型土当作稳定土体，是反复出现的坍塌致死原因。","related":[{"n":"4.6","t":"挖掘与沟槽"}],"level":"application","topic":"Type C Benching Prohibited"},{"text":"A job analysis yields a recommended weight limit of 30 lb for a lift, but the tote being handled actually weighs 45 lb. What is the lifting index, and how is it interpreted?","group":4,"options":["LI = 1.5, indicating increased risk of lifting-related injury","LI = 0.67, indicating the lift is acceptable","LI = 15, indicating the load must be lifted by two people","LI = 1.5, indicating the lift is acceptable because the index is below 3.0"],"correct":0,"explanation":"Lifting index = load weight / RWL = 45 / 30 = 1.5. An LI above 1.0 indicates increased risk, and above 3.0 indicates significant risk for a substantial portion of the workforce. The fix is to reduce the load, improve the coupling, or bring the load closer to the body so the RWL increases.\n\n提举指数 = 荷载重量 ÷ RWL = 45 ÷ 30 = 1.5。LI 超过 1.0 表示风险升高，超过 3.0 表示对相当一部分劳动者构成重大风险。改进方向是减轻荷载、改善抓握条件，或让荷载靠近身体以提高 RWL。","related":[{"n":"4.8","t":"物料搬运与储存"}],"level":"calculation","topic":"Lifting Index"},{"text":"Before excavating for a new storm drain, what must be done about underground utilities?","group":4,"options":["Nothing, if the drawings are less than 10 years old","Call 811 only if the excavation will exceed 5 feet","Ask the utility company to be on site during the dig","Locate and mark all underground installations before digging"],"correct":3,"explanation":"1926.651(b) requires the estimated location of underground installations to be determined before digging, typically through the 811 one-call system, and the exact locations to be found by safe and acceptable means while the excavation is open. Stale drawings are not a substitute. Contact with a gas or electric line can be immediately fatal.\n\n1926.651(b) 要求开挖前查明地下设施的预估位置（通常通过 811 一键呼叫系统），并在开挖过程中用安全可靠的方法确认确切位置。过期图纸不能替代。挖破燃气或电力管线可能立即致命。","related":[{"n":"4.7","t":"关键挖掘要求"}],"level":"application","topic":"Underground Utilities"},{"text":"A trench box is being lowered into a 9-foot-deep trench. Which installation requirement applies?","group":4,"options":["The box may sit up to 4 feet below the bottom of the trench","The box must extend 18 inches above the top, and no more than 2 feet below the bottom","The box must be removed and reinstalled each time a worker enters","The box must be backfilled in place at the end of each shift"],"correct":1,"explanation":"A shield must extend at least 18 inches above the trench wall top where vertical travel is involved, to keep spoil from spilling in, and no more than 2 feet below the bottom unless designed otherwise by a registered professional engineer. Workers must remain inside the shield while it is in place. Shields protect occupants but do not prevent the cave-in itself.\n\n涉及垂直移动时，防护箱必须高出沟壁顶部至少 18 英寸以防弃土落入；底部不得低于沟底 2 英尺以上，除非由注册专业工程师另行设计。工人在箱体就位期间必须始终留在箱内。防护箱保护箱内人员，但并不阻止坍塌本身。","related":[{"n":"4.6","t":"挖掘与沟槽"}],"level":"recall","topic":"Trench Box Requirements"},{"text":"A 4-foot-wide trench crosses a walkway that employees use to reach a warehouse. What is required?","group":4,"options":["Nothing, because the trench is less than 5 feet deep","Only a warning sign at each end","Adequate bridges or walkways with standard guardrails","A competent person stationed at the crossing during shifts"],"correct":2,"explanation":"Where employees or equipment must cross over an excavation, adequate bridges or walkways with standard guardrails must be provided. Depth does not excuse the requirement, because a fall into a 4-foot trench still causes serious injury. Barricades and signs are required for excavations that are not readily seen, but they do not replace a crossing structure.\n\n当员工或设备必须跨越挖掘区域时，必须提供带标准护栏的足够桥梁或走道。深度不能免除该要求，因为跌入 4 英尺深的沟槽同样会造成严重伤害。不易被发现的挖掘需设路障与标识，但不能替代跨越结构。","related":[{"n":"4.7","t":"关键挖掘要求"}],"level":"application","topic":"Surface Crossing"},{"text":"A confined space entry permit was issued at 07:00 for a tank cleaning expected to take four hours. At 14:00 the crew is still inside and conditions have changed. What must happen?","group":4,"options":["Stop the entry and re-evaluate, because the permit expires when conditions change","The permit remains valid until midnight of the issue date","The permit may be extended verbally by the attendant on duty","A new permit is required only if an instrument detects a hazard"],"correct":0,"explanation":"The permit is valid only for the stated operation and conditions; it expires when the work is done or when a new condition arises, and re-entry requires re-evaluation and possibly a new permit. Changes in conditions also require re-testing before anyone re-enters. Verbal extensions and clock-based validity are not permitted.\n\n许可仅对所述作业与条件有效；作业完成或出现新条件时即失效，再次进入需重新评估，可能还需新许可。条件变化时还须重新检测后才能进入。口头延期或按日期自动有效都不允许。","related":[{"n":"4.3","t":"进入程序与救援"}],"level":"application","topic":"Entry Permit Validity"},{"text":"An employer must provide rescue capability for permit space entries through a top manhole. What is the preferred arrangement?","group":4,"options":["A trained attendant who will enter the space and drag the entrant out","A call to 911 with no on-site retrieval equipment available","A rescue team standing by at the plant gate during the entry","A retrieval system with a harness, line, and tripod allowing non-entry rescue"],"correct":3,"explanation":"Non-entry rescue using a retrieval system is preferred whenever entry is through a top opening and the equipment would not increase the entrant's risk. It removes the entrant without exposing a rescuer to the space's atmosphere. Attendants must not enter to attempt rescue, and outside responders alone cannot satisfy the timely response requirement.\n\n从顶部开口进入且设备不会增加进入者风险时，应优先采用救援绳系统实施非进入救援。它无需救援者进入空间即可把进入者拉出。监护员不得进入空间施救，仅依靠外部救援机构也无法满足“及时”响应的要求。","related":[{"n":"4.3","t":"进入程序与救援"}],"level":"application","topic":"Non-Entry Rescue"},{"text":"A facility uses red padlocks for LOTO, but the same padlocks are also used to secure tool cribs. Which LOTO device requirement is violated?","group":4,"options":["Durable: the lock must withstand the environment for the duration of exposure","Singular purpose: the devices may not be used for anything other than controlling energy","Substantial: the tag must be non-reusable and self-locking","Identifiable: the device must show the identity of the employee who applied it"],"correct":1,"explanation":"1910.147(c)(5)(i)(E) requires lockout and tagout devices to be used only for controlling hazardous energy, so dual use for storage security is prohibited. Devices must also be durable, standardized within the facility, substantial, and identifiable as to the employee who applied them. Mixing purposes creates confusion about whether equipment is truly locked out.\n\n1910.147(c)(5)(i)(E) 要求上锁挂牌装置只能用于控制危险能量，因此兼作储物柜锁属于违规。装置还必须耐用、在设施内标准化、牢固，并能识别施加者。用途混用会造成设备是否真正已上锁的混淆。","related":[{"n":"4.5","t":"LOTO职责与程序"}],"level":"application","topic":"Device Single Purpose"},{"text":"An affected employee notices that a jammed conveyor has a lock and tag applied by a maintenance technician. Production is falling behind. What may the affected employee do?","group":4,"options":["Remove the tag if the technician is at lunch and production is waiting","Restart the conveyor after announcing it over the plant radio","Not remove the lock or tag and not attempt to start the equipment","Remove the lock and reapply it after the jam has been cleared"],"correct":2,"explanation":"Affected employees must never attempt to restart or re-energize locked or tagged equipment, and only the authorized employee who applied a lock may remove it. The narrow exception is a documented procedure allowing removal when the owner cannot be located, after verification. Removing a lock to clear a jam is exactly the exposure LOTO exists to prevent.\n\n受影响员工绝不得尝试重启或重新送电已上锁挂牌的设备；只有施加锁具的授权员工才能摘除。唯一的窄例外是在无法联系到锁主时，经核实并按书面程序摘除。为清堵而摘锁，正是 LOTO 要防止的暴露。","related":[{"n":"4.4","t":"上锁挂牌"},{"n":"4.5","t":"LOTO职责与程序"}],"level":"application","topic":"Affected Employee Duties"},{"text":"A sample of soil from the bottom of a trench is being classified. It is cohesive enough to stand briefly. What does the standard require?","group":4,"options":["Soil at the bottom of a trench is assumed to be Type C unless tested","Any cohesive soil is classified as Type A without testing","Soil classification is not required below 5 feet of depth","The contractor may classify the soil by visual inspection alone"],"correct":0,"explanation":"Soil that is submerged, or that is at the bottom of a trench and has been disturbed, is assumed to be Type C unless the competent person makes a determination based on the required tests and observations. Classification drives the slope ratio, and assuming better soil than actually exists is a frequent cause of collapse. Visual inspection alone is not sufficient for a Type A or B determination.\n\n淹没土、沟槽底部的土或已被扰动的土，除非合格人员依据规定的测试与观察作出判定，否则假定为 C 型。土壤分类决定放坡比例，把土质估计得比实际好是坍塌的常见原因。仅凭目视观察不足以判定 A 型或 B 型。","related":[{"n":"4.6","t":"挖掘与沟槽"}],"level":"application","topic":"Soil Classification Assumption"},{"text":"A 6-foot-deep sump with a 24-inch opening must be entered monthly to change a pump screen. Workers are inside about 20 minutes, the space is not ventilated, and hydrogen sulfide has been detected there before. How should it be classified?","group":4,"options":["Not a confined space, because employees enter it regularly","A non-permit confined space, because the entries are routine","A confined space but not permit-required, because entries are short","A permit-required space, because of limited access and a hazardous atmosphere"],"correct":3,"explanation":"All three defining criteria are met — large enough to enter, limited means of entry and exit, and not designed for continuous occupancy — so it is a confined space. A potential hazardous atmosphere makes it permit-required regardless of entry duration or frequency. Routine entry does not downgrade the classification.\n\n三项定义标准全部满足——可身体进入、进出受限、非为连续占用设计——因此属于密闭空间。只要可能存在危险气氛，无论进入时长或频次如何，都属于许可要求的密闭空间。例行进入不会降低其分类。","related":[{"n":"4.1","t":"密闭空间"}],"level":"application","topic":"Confined Space Classification"},{"text":"An excavation in a remote area of a large site is 6 feet deep and not readily visible from the access road. What protection is required in addition to the wall protective system?","group":4,"options":["Nothing; the wall protective system covers all excavation hazards","Guardrails, fences, or barricades to prevent employees and vehicles from entering","Reflective cones placed at the corners of the excavation","A competent person stationed at the excavation at all times"],"correct":1,"explanation":"1926.651 requires guardrails, fences, or barricades where excavations are not readily seen, are in remote locations, or where adjacent traffic creates a hazard. Cones alone do not physically prevent a fall or stop a vehicle. This requirement is separate from, and additional to, the wall protective system.\n\n1926.651 要求当挖掘不易被看到、位于偏远区域，或邻近交通构成危害时，设置护栏、围栏或路障。仅放锥桶无法真正阻止人员坠落或车辆驶入。该要求与坑壁防护系统相互独立，需同时满足。","related":[{"n":"4.7","t":"关键挖掘要求"}],"level":"application","topic":"Excavation Barricades"},{"text":"Which statement best describes the authority of the competent person on an excavation site?","group":4,"options":["The competent person may only advise the superintendent, who decides","The competent person must be a registered professional engineer","The competent person can identify hazards and has authority to take corrective action","The competent person is responsible only for classifying the soil"],"correct":2,"explanation":"A competent person is defined by the ability to identify existing and predictable hazards and by the authorization to take prompt corrective action, including removing workers from danger. The role is not advisory only, and a professional engineer is not required for the designation. Soil classification is one of the duties, not the whole role.\n\n合格人员的定义是：能够识别现存与可预见的危害，并有权采取及时纠正措施，包括让工人撤离危险区域。该角色不是仅提供建议，也不要求具备注册专业工程师资格。土壤分类只是其职责之一，而非全部。","related":[{"n":"4.6","t":"挖掘与沟槽"}],"level":"recall","topic":"Competent Person Authority"},{"text":"Before entering a vessel that has a feed line from another unit, what isolation method does 1910.146 require?","group":4,"options":["Blank or blind the line, or disconnect and cap it, rather than relying on a valve","Close the nearest valve and lock the handle in the closed position","Rely on the upstream pressure indicator reading zero pressure","Post a sign on the valve handle warning of the connected unit"],"correct":0,"explanation":"A closed valve can leak, so lines that could introduce hazardous material must be physically blanked, blinded, or disconnected and capped. Locking a valve handle improves control but does not provide a positive barrier. Isolation by blanking is the engineering-level protection that makes the subsequent atmospheric testing meaningful.\n\n关闭的阀门可能内漏，因此可能引入危险物料的管线必须物理盲板隔离、断开并加装堵头。锁住阀柄提升了控制水平，但不构成可靠的物理隔离。盲板隔离这一工程措施，才使随后的气体检测具有意义。","related":[{"n":"4.3","t":"进入程序与救援"},{"n":"4.1","t":"密闭空间"}],"level":"application","topic":"Pre-Entry Isolation"}]
});
