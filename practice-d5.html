<script>
CSPQuiz.init({
  quizId: 'practice-d5',
  quizTitle: 'D5 环境管理 强化训练 / Domain 5 Boost',
  quizTopic: 'Domain 5 — Environmental Management',
  containerId: 'quiz-root',
  questions: [{"text":"Which statement correctly distinguishes the F-list from the K-list of hazardous wastes?","group":1,"options":["F-list wastes are characteristic wastes, while K-list wastes are acutely hazardous","F-list wastes are discarded commercial chemical products, while K-list wastes are container residues","F-list wastes come from non-specific industrial sources, while K-list wastes come from specific industries","F-list wastes are universal wastes, while K-list wastes are underground storage tank wastes"],"correct":2,"explanation":"F-listed wastes arise from non-specific sources common to many industries, such as spent halogenated solvents, while K-listed wastes arise from specific industry sectors such as petroleum refining or pesticide manufacturing. Characteristic wastes carry D codes rather than F or K codes, and discarded commercial chemical products are the P and U lists. Universal waste and UST waste are governed by entirely separate rules.\n\nF名录废物来自许多行业共有的非特定来源（如废卤代溶剂），而K名录废物来自石油炼制、农药制造等特定行业。特征性废物使用D代码而非F或K代码；废弃商业化学品属于P名录和U名录。通用废物与地下储罐废物由完全不同的规则管理。","related":[{"n":"14.5","t":"资源保护与回收法案"}],"level":"recall","topic":"RCRA Listed Wastes"},{"text":"A maintenance crew places a drum of calcium carbide machining residue in the general waste pile. The material fizzes and releases a flammable gas when it contacts water. Which RCRA characteristic applies?","group":1,"options":["Reactivity, waste code D003","Ignitability, waste code D001","Corrosivity, waste code D002","Toxicity, waste code D004 through D043"],"correct":0,"explanation":"A waste is reactive (D003) when it is unstable, reacts violently with water, forms potentially explosive mixtures, or generates toxic gases. Materials that release flammable gas on contact with water are the classic example. Ignitability (D001) concerns flash point, corrosivity (D002) concerns pH or steel corrosion rate, and toxicity (D004 and above) is determined by the TCLP leach test.\n\n当废物不稳定、遇水剧烈反应、形成潜在爆炸性混合物或产生有毒气体时，即具有反应性（D003）。遇水释放易燃气体的物质是典型例子。可燃性（D001）涉及闪点，腐蚀性（D002）涉及pH或钢材腐蚀速率，毒性（D004及以上）由TCLP浸出试验判定。","related":[{"n":"14.5","t":"资源保护与回收法案"}],"level":"application","topic":"Reactivity Characteristic"},{"text":"A wastewater treatment sludge measures pH 12.8 on a calibrated meter. For RCRA purposes, how should the sludge be classified?","group":1,"options":["Ignitable, because alkaline sludges can flash","Corrosive, because the pH is at or above 12.5","Reactive, because it will generate gas in the lagoon","Non-hazardous, because only acidic wastes are corrosive"],"correct":1,"explanation":"The corrosivity characteristic (D002) is met by aqueous wastes with pH less than or equal to 2, or greater than or equal to 12.5, or that corrode steel faster than 6.35 mm per year. A pH of 12.8 falls in the highly alkaline corrosive range. Ignitability is a flash-point or oxidizer property, reactivity covers instability and violent reaction, and corrosivity applies at both ends of the pH scale, not only to acids.\n\n腐蚀性特征（D002）适用于pH小于等于2或大于等于12.5的水性废物，或腐蚀钢材速率超过每年6.35毫米的废物。pH 12.8属于强碱性腐蚀范围。可燃性指闪点或氧化性，反应性指不稳定与剧烈反应，而腐蚀性在pH两端都适用，并非只针对酸性物质。","related":[{"n":"14.5","t":"资源保护与回收法案"}],"level":"recall","topic":"Corrosivity Characteristic"},{"text":"Which set of RCRA subtitles correctly matches the waste or storage category it governs?","group":1,"options":["Subtitle C for solid waste, Subtitle D for hazardous waste, Subtitle I for underground tanks","Subtitle C for underground tanks, Subtitle D for hazardous waste, Subtitle I for solid waste","Subtitle C for hazardous waste, Subtitle D for underground tanks, Subtitle I for solid waste","Subtitle C for hazardous waste, Subtitle D for non-hazardous solid waste, Subtitle I for underground storage tanks"],"correct":3,"explanation":"RCRA Subtitle C establishes the cradle-to-grave hazardous waste program, Subtitle D governs non-hazardous solid waste such as municipal landfills, and Subtitle I governs underground storage tanks. This structure explains why a hazardous waste facility permit is a Subtitle C permit while a used-oil or gasoline UST falls under Subtitle I. The other options swap the subtitles and would send a facility to the wrong regulatory program.\n\nRCRA C子章确立了危险废物“从摇篮到坟墓”的管理制度，D子章管辖城市垃圾填埋场等非危险固体废物，I子章管辖地下储罐。这一结构解释了为什么危险废物设施许可属于C子章许可，而废油或汽油地下储罐属于I子章。其他选项把子章对调，会把设施引向错误的监管体系。","related":[{"n":"14.5","t":"资源保护与回收法案"}],"level":"recall","topic":"RCRA Subtitles"},{"text":"Under 40 CFR 273, how long may a handler accumulate universal waste on site before it must be shipped?","group":1,"options":["90 days from the date of generation","180 days from the date of generation","One year from the date of generation or receipt","Three years, matching the RCRA recordkeeping period"],"correct":2,"explanation":"Universal waste handlers may accumulate waste for up to one year from the date it was generated or received, and the accumulation start date must be marked on the container. The 90-day and 180-day figures belong to the hazardous waste generator accumulation rules for LQGs and SQGs, not to universal waste. Three years is the recordkeeping retention period, not an accumulation limit.\n\n通用废物处理者自废物产生或接收之日起最多可累积一年，且必须在容器上标明累积开始日期。90天和180天属于危险废物产生者（LQG与SQG）的累积规则，而非通用废物。三年是记录保存期限，不是累积期限。","related":[{"n":"15.2","t":"通用废物"}],"level":"recall","topic":"Universal Waste Time Limit"},{"text":"At what accumulated quantity does a universal waste handler become a large quantity handler subject to additional notification and reporting duties?","group":1,"options":["1,000 kg at any one time","5,000 kg at any one time","10,000 kg at any one time","25,000 kg at any one time"],"correct":1,"explanation":"A universal waste handler is a small quantity handler below 5,000 kg of universal waste accumulated at any one time, and a large quantity handler at 5,000 kg or more. Large quantity handlers must notify EPA and obtain an identification number and keep more detailed records. The 1,000 kg figure belongs to the RCRA generator thresholds, and 10,000 kg is the SPCC self-certification aggregate capacity, not a universal waste threshold.\n\n通用废物处理者若任何时候累积量低于5,000公斤为小量处理者，达到或超过5,000公斤即为大量处理者。大量处理者必须通知EPA、取得识别号并保存更详细的记录。1,000公斤属于RCRA产生者阈值，10,000加仑是SPCC自认证的总容量条件，都不是通用废物阈值。","related":[{"n":"15.2","t":"通用废物"}],"level":"recall","topic":"Universal Waste Handlers"},{"text":"How must a container of spent fluorescent lamps be marked while it is accumulated under the universal waste rule?","group":1,"options":["With the words Universal Waste and the specific type, plus the date accumulation began","With the hazardous waste manifest number and the EPA identification number","With the generator's name and the DOT hazard class label only","No marking is required if the container is closed and stored indoors"],"correct":0,"explanation":"Universal waste containers must be closed, structurally sound, compatible with the contents, and labeled with the words Universal Waste plus the specific type (for example lamps or batteries) and the date accumulation began. Universal waste shipments travel on a bill of lading rather than a hazardous waste manifest, so a manifest number is not applicable. Unmarked containers are a common citation even when the waste itself is properly recycled.\n\n通用废物容器必须封闭、结构完好、与内容物相容，并标有“通用废物”字样、具体类型（如灯管或电池）以及累积开始日期。通用废物运输使用货运提单而非危险废物转运清单，因此不存在清单编号。即使废物最终得到妥善回收，未标识容器也是常见的违规项。","related":[{"n":"15.2","t":"通用废物"}],"level":"recall","topic":"Universal Waste Labeling"},{"text":"A 1978 bare-steel gasoline tank is still in service at a fleet garage. It has no cathodic protection and no release detection. What does RCRA Subtitle I require?","group":1,"options":["Nothing, because tanks installed before 1988 are grandfathered","Only annual tightness testing while the tank remains in use","Upgrade with corrosion protection and release detection, or properly close the tank","Immediate removal of the tank within 30 days regardless of condition"],"correct":2,"explanation":"RCRA Subtitle I requires regulated USTs to have corrosion protection, spill and overfill prevention, and release detection; an older bare-steel tank without these must be upgraded or permanently closed, with closure including emptying, cleaning, and a site assessment. There is no grandfathering for tanks merely because of their installation date. Annual testing alone does not provide the required corrosion protection, and immediate removal is not the only compliant option.\n\nRCRA I子章要求受管地下储罐具备腐蚀防护、防溢流与防过充装置以及泄漏检测；没有这些措施的老旧裸钢罐必须升级改造或永久关闭，关闭包括清空、清洗和场地评估。不会仅因安装年代久远而获得豁免。仅做年度密闭性测试并不能提供所需的腐蚀防护，而立即拆除也并非唯一合规选择。","related":[{"n":"15.8","t":"地下储罐与废油"}],"level":"application","topic":"UST Corrosion Protection"},{"text":"Monthly inventory reconciliation for a 10,000-gallon gasoline tank shows an unexplained loss of about 800 gallons over two months, well beyond the allowed threshold. There is no visible spill or obvious cause. What is the correct response?","group":1,"options":["Record the variance and continue monitoring for another two quarters","Assume the metering equipment is wrong and recalibrate it before doing anything else","Investigate the discrepancy as a suspected release and report if a release is confirmed","Drain and abandon the tank without notifying the state"],"correct":2,"explanation":"An unexplained inventory loss beyond the allowed threshold is a suspected release that must be investigated, typically through tightness testing or another approved method, and a confirmed release must be reported to the state regulatory agency. Simply recording the variance or blaming the meter leaves a possible leak migrating toward groundwater. Draining and abandoning the tank without notification would itself violate UST closure requirements.\n\n超出允许阈值的无法解释的库存损失属于可疑泄漏，必须开展调查（通常采用密闭性测试或其他批准方法）；一旦确认泄漏，必须向州监管机构报告。仅记录差异或归咎于计量设备，会使可能的泄漏继续向地下水扩散。未通报即排空弃用储罐，本身就违反地下储罐关闭规定。","related":[{"n":"15.8","t":"地下储罐与废油"}],"level":"application","topic":"Suspected UST Release"},{"text":"Which of the following tanks is exempt from RCRA Subtitle I underground storage tank requirements?","group":1,"options":["A 12,000-gallon gasoline tank at a retail service station","A 1,000-gallon gasoline tank on a farm used only for non-commercial motor fuel","A 5,000-gallon diesel tank at a trucking fleet terminal","A 2,000-gallon solvent tank with 20 percent of its volume underground at a factory"],"correct":1,"explanation":"Subtitle I exempts farm and residential tanks of 1,100 gallons or less that store motor fuel for non-commercial use, along with heating-oil tanks used on the premises. The 1,000-gallon farm tank therefore falls within the exemption. Retail station tanks, fleet diesel tanks, and solvent tanks with at least 10 percent of their volume underground are all regulated, and the solvent tank is also a CERCLA hazardous substance.\n\nI子章豁免容量不超过1,100加仑、储存非商业用途机动燃料的农场和住宅储罐，以及现场使用的燃油供暖罐。因此1,000加仑的农场储罐属于豁免范围。加油站储罐、车队柴油罐以及至少10%体积在地下的溶剂罐都受管制，且该溶剂罐还储存CERCLA危险物质。","related":[{"n":"15.8","t":"地下储罐与废油"}],"level":"recall","topic":"UST Exemptions"},{"text":"A facility stores 6,000 gallons of oil aboveground in containers no larger than 800 gallons each, has never had a reportable discharge, and has no direct pathway to navigable waters. The owner wants to avoid hiring a Professional Engineer. What is allowed?","group":1,"options":["No SPCC plan of any kind is needed at this capacity","A Professional Engineer is always required, regardless of capacity","The plan may be self-certified by the owner or operator if it still meets 40 CFR 112 requirements","The plan may be replaced by a one-page spill response card approved by the fire department"],"correct":2,"explanation":"SPCC self-certification is available to facilities with an aggregate aboveground oil storage capacity of 10,000 gallons or less, no single discharge greater than 1,000 gallons to navigable waters, and no discharge to navigable waters in the preceding three years. At 6,000 gallons with no discharge history the facility qualifies, but the plan must still address containment, inspections, and countermeasures as 40 CFR 112 requires. Capacity above 1,320 gallons still triggers SPCC, so no plan at all is not an option.\n\nSPCC自认证适用于地上储油总容量不超过10,000加仑、单次向通航水域排放不超过1,000加仑、且此前三年内未向通航水域排放的设施。该设施总容量6,000加仑且无排放历史，符合自认证条件，但计划仍须按40 CFR 112满足围堵、检查与应急对策要求。容量超过1,320加仑仍会触发SPCC，因此“完全不需要计划”不成立。","related":[{"n":"14.1","t":"泄漏预防与控制对策"}],"level":"recall","topic":"SPCC Self-Certification"},{"text":"A facility stores 2,500 gallons of diesel in a single aboveground tank located inside a sealed concrete room with no floor drain. The site is three miles from any waterway and has no storm sewer connection or overland drainage pathway. Must the facility prepare an SPCC plan?","group":1,"options":["No, because a discharge could not reasonably be expected to reach navigable waters","Yes, because any aboveground oil storage over 1,320 gallons always requires a plan","Yes, because diesel is a CERCLA hazardous substance at any quantity","No, because the tank is smaller than 5,000 gallons"],"correct":0,"explanation":"SPCC applies where a facility could reasonably be expected to discharge oil into navigable waters or adjoining shorelines; if there is no direct or indirect pathway, such as a sealed room with no drain and no overland route, a plan may not be required. The 1,320-gallon threshold is the capacity trigger, but it does not override the pathway analysis. The tank size is irrelevant to the rule once above 1,320 gallons, and the diesel quantity is far below any CERCLA reportable quantity basis for the plan.\n\nSPCC适用于可能合理预期会将油类排入通航水域或邻近岸线的设施；如果不存在直接或间接通道（例如无排水口的密闭房间且无地面径流路径），则可能无需制定计划。1,320加仑是容量触发值，但并不能取代通道分析。一旦超过1,320加仑，储罐大小与该规则的适用性无关，而该柴油量也远未达到CERCLA报告量的依据。","related":[{"n":"14.1","t":"泄漏预防与控制对策"}],"level":"application","topic":"SPCC Applicability"},{"text":"A 5,000-gallon vertical tank sits inside a rectangular containment berm measuring 30 ft by 20 ft. The facility designs containment to 110 percent of the largest tank volume. What effective berm depth is required, ignoring freeboard?","group":1,"options":["0.9 ft","1.1 ft","1.2 ft","2.4 ft"],"correct":2,"explanation":"Required volume is 5,000 gallons times 1.10, or 5,500 gallons, which equals 5,500 divided by 7.48, or about 735 cubic feet. Dividing by the berm floor area of 30 times 20, or 600 square feet, gives about 1.2 feet of effective depth. The 1.1-foot value comes from using 100 percent of the tank volume, and 2.4 feet results from arithmetic or conversion errors.\n\n所需容积为5,000加仑 × 1.10 = 5,500加仑，换算为5,500 ÷ 7.48 ≈ 735立方英尺。再除以围堤底面积30 × 20 = 600平方英尺，得到约1.2英尺的有效深度。1.1英尺来自按储罐容积的100%计算，2.4英尺则源于计算或单位换算错误。","related":[{"n":"14.8","t":"二次围堵容积"}],"level":"calculation","topic":"Containment Depth Calculation"},{"text":"A cold storage facility keeps more than the threshold quantity of anhydrous ammonia in its refrigeration system. Which Clean Air Act requirement applies?","group":1,"options":["A Title V operating permit only, with no separate risk program","A Risk Management Program with hazard assessment, prevention, and emergency response elements submitted to EPA","A Premanufacture Notice to EPA before the ammonia is first delivered","Registration under RCRA Subtitle I as an underground storage tank"],"correct":1,"explanation":"Section 112(r) of the Clean Air Act and 40 CFR 68 require facilities holding more than a threshold quantity of a regulated substance such as anhydrous ammonia to develop a Risk Management Program covering hazard assessment including worst-case release analysis, a prevention program, and an emergency response program, and to submit it to EPA with periodic updates. A Title V permit addresses air emissions rather than accidental release prevention. The Premanufacture Notice belongs to TSCA for new chemicals, and Subtitle I applies to underground storage tanks.\n\n《清洁空气法》第112(r)条与40 CFR 68要求，持有超过阈值数量的受管物质（如无水氨）的设施必须建立风险管理计划，包括危害评估（含最坏情形泄漏分析）、预防计划和应急响应计划，并提交EPA且定期更新。第五章运营许可证针对的是大气排放，而非事故性泄漏预防。制造前通知属于TSCA对新化学品的要求，I子章适用于地下储罐。","related":[{"n":"15.4","t":"清洁空气法与清洁水法"}],"level":"application","topic":"Risk Management Program"},{"text":"A factory is a major source of air pollutants and holds a Title V operating permit. What is the maximum term of that permit before renewal?","group":1,"options":["1 year","3 years","10 years","5 years"],"correct":3,"explanation":"Title V operating permits are issued for a maximum of five years and must be renewed, with the facility submitting a timely and complete renewal application to keep operating. The permit consolidates all applicable Clean Air Act requirements, including monitoring, recordkeeping, and reporting, into a single document. One-year and three-year terms belong to other permit or testing cycles, and ten years exceeds the statutory maximum.\n\n第五章运营许可证最长有效期为五年，到期须续期，设施需提交及时且完整的续期申请方可继续运行。该许可证把所有适用的《清洁空气法》要求（包括监测、记录和报告）整合为单一文件。一年和三年属于其他许可或检测周期，十年则超出法定上限。","related":[{"n":"15.4","t":"清洁空气法与清洁水法"}],"level":"recall","topic":"Title V Permits"},{"text":"Which Clean Air Act control approach applies to major sources of hazardous air pollutants?","group":1,"options":["Maximum Achievable Control Technology standards under the NESHAP program","National Ambient Air Quality Standards for each listed pollutant","Total Maximum Daily Load limits assigned to the receiving water body","Best Management Practices under an NPDES stormwater permit"],"correct":0,"explanation":"Hazardous air pollutants from major sources are regulated through National Emission Standards for Hazardous Air Pollutants, which are based on Maximum Achievable Control Technology for the source category. NAAQS apply to the six criteria pollutants, not to the hundreds of listed HAPs. TMDLs are a Clean Water Act tool for impaired water bodies, and NPDES BMPs address stormwater discharges rather than air toxics.\n\n主要源的有害空气污染物通过《有害空气污染物国家排放标准》（NESHAP）监管，其基础是按源类别确定的最大可达控制技术（MACT）。NAAQS适用于六种标准污染物，而非数百种列名HAPs。TMDL是《清洁水法》针对受损水体的工具，NPDES的BMP针对雨水排放，与大气毒物无关。","related":[{"n":"15.4","t":"清洁空气法与清洁水法"}],"level":"recall","topic":"MACT Standards"},{"text":"Which statement best describes what ISO 14001 requires of an organization?","group":1,"options":["It sets uniform numeric emission limits that every certified site must meet","It requires third-party monitoring data to be submitted to the government","It requires a management system for identifying aspects, meeting compliance obligations, and continual improvement","It certifies that a product is environmentally preferable over its life cycle"],"correct":2,"explanation":"ISO 14001 specifies requirements for an environmental management system: environmental policy, identification of aspects and impacts, compliance obligations, objectives and programs, operational control, monitoring, internal audit, and management review, all within a continual improvement cycle. It does not set absolute emission or performance limits, which come from permits and regulations. Certification is of the management system, not of a product's life-cycle superiority, and ISO 14001 does not create government reporting duties.\n\nISO 14001规定的是环境管理体系要求：环境方针、环境因素与影响识别、合规义务、目标与方案、运行控制、监测、内部审核与管理评审，均处于持续改进循环中。它不设定绝对的排放或绩效限值，那些由许可证和法规确定。认证针对的是管理体系，而非产品生命周期优劣，ISO 14001也不产生政府报告义务。","related":[{"n":"15.7","t":"环境管理体系"}],"level":"recall","topic":"ISO 14001 Scope"},{"text":"While building its ISO 14001 aspect register, a team lists four items for a paint booth. Which item is an environmental ASPECT rather than an environmental impact?","group":1,"options":["Formation of regional smog downwind of the plant","Volatile organic compound emissions from the spray guns","Decline in fish populations in the receiving stream","Degradation of groundwater quality beneath the site"],"correct":1,"explanation":"An environmental aspect is the element of an organization's activities, products, or services that interacts with the environment, such as VOC emissions from spray guns or fuel consumption by a boiler. The resulting change to the environment, such as smog formation, fish population decline, or groundwater degradation, is the impact. Keeping aspects and impacts separate is essential because operational controls act on aspects, while significance is judged by impacts.\n\n环境因素是组织的活动、产品或服务中与环境相互作用的要素，例如喷枪排放的VOC或锅炉的燃料消耗。由此导致的环境变化（如雾霾形成、鱼类种群减少、地下水恶化）才是环境影响。区分因素与影响十分关键，因为运行控制作用于因素，而重要性则依据影响判定。","related":[{"n":"15.7","t":"环境管理体系"}],"level":"application","topic":"Aspects vs Impacts"},{"text":"A shop pours two gallons of spent chlorinated solvent into its used-oil drum so the solvent can be burned for energy recovery with the oil. How is the resulting mixture regulated?","group":1,"options":["As used oil under 40 CFR 279, because the oil is the larger fraction","As universal waste, because solvents are commonly recycled","As non-hazardous waste, because energy recovery destroys the solvent","As hazardous waste, because the mixture contains a hazardous waste"],"correct":3,"explanation":"Used oil that is mixed with a hazardous waste, such as a listed spent solvent, is regulated as hazardous waste rather than under the used-oil rule, and the whole mixture carries that status. Deliberately mixing waste streams to avoid hazardous waste requirements is also prohibited treatment by dilution. Used oil stays in the 40 CFR 279 stream only if it is not mixed with hazardous waste and does not exhibit a characteristic.\n\n废油若与危险废物（如列名废溶剂）混合，则按危险废物而非废油规则管理，且整个混合物都带有该属性。为规避危险废物要求而故意混合废物流，还构成被禁止的稀释处理。只有当废油未与危险废物混合且不具有危险特性时，才留在40 CFR 279的废油管理流程中。","related":[{"n":"15.8","t":"地下储罐与废油"}],"level":"application","topic":"Used Oil Mixtures"},{"text":"A facility permanently takes a 12,000-gallon diesel underground tank out of service. Which set of actions is required for proper closure under RCRA Subtitle I?","group":1,"options":["Notify the state, empty and clean the tank, remove it or fill it with inert material, and assess the site for contamination","Fill the tank with water and leave the fill pipe in place as a marker","Notify the state only if contamination is later discovered nearby","Abandon the tank in place after pumping out the free product"],"correct":0,"explanation":"Permanent UST closure requires notification to the implementing agency, removal of all liquids and sludge, cleaning, and either removal of the tank or filling it with an inert solid material, followed by site assessment to determine whether a release occurred. Filling with water or simply pumping out product leaves residual contamination and does not satisfy closure. Notification is required at the time of closure, not only after contamination is discovered elsewhere.\n\n地下储罐永久关闭要求：通知实施机构、清除全部液体与污泥、清洗，并将储罐拆除或以惰性固体材料填充，随后进行场地评估以判断是否发生泄漏。注水或仅抽出产品会留下残留污染，不构成合规关闭。通知必须在关闭时进行，而不是等别处发现污染后才做。","related":[{"n":"15.8","t":"地下储罐与废油"}],"level":"application","topic":"UST Closure"}]
