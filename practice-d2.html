<script>
CSPQuiz.init({
  quizId: 'practice-d2',
  quizTitle: 'D2 项目管理 强化训练 / Domain 2 Boost',
  quizTopic: 'Domain 2 — Program Management',
  containerId: 'quiz-root',
  questions: [{"text":"A 400-person fabrication plant conducts internal OH&S audits only after a recordable injury occurs; there is no audit schedule and no criteria for which areas get audited. Which ISO 45001 requirement is most clearly unmet?","group":1,"options":["Internal audits must be planned at set intervals, with a risk-based programme","Audits must be performed by an accredited certification body each year","Audit findings must be reported directly to OSHA within 24 hours","Audit criteria must be limited to the terms of the customer contract"],"correct":0,"explanation":"ISO 45001 Clause 9.2 requires internal audits at planned intervals to determine whether the OH&S management system conforms and is effectively implemented. The programme must be planned with consideration of the importance of the processes and the results of previous audits, which is exactly what a purely reactive, event-triggered audit pattern lacks. Certification bodies are optional and third-party certification is not an internal audit requirement; reporting findings to OSHA is not an ISO 45001 obligation.\n\nISO 45001 第9.2条要求按策划的时间间隔开展内部审核，审核方案的制定要考虑受审过程的重要性以及以往审核的结果。只在上报可记录伤害后才审核、且无审核计划与准则的做法，说明体系缺少主动的、基于风险的审核安排。第三方认证并非内部审核的要求，向OSHA报告发现也不是ISO 45001的义务。","related":[{"n":"5.1","t":"ISO 45001 体系"}],"level":"application","topic":"Internal Audit Programme"},{"text":"ISO 45001 Clause 4 requires the organization to determine the external and internal issues that affect its OH&S management system. Which of the following is an EXTERNAL issue?","group":1,"options":["Worker morale and absenteeism trends inside the plant","New customer and supply-chain expectations for supplier OH&S performance","The maturity of the site safety culture","Competence gaps among the site maintenance technicians"],"correct":1,"explanation":"External issues arise from the outside environment: legal, technological, market, cultural, social and economic conditions, including the expectations of customers and supply chains. Morale, culture maturity and internal competence gaps are all internal characteristics of the organization. Clause 4.1 requires both sets to be determined and then used to establish the scope and the risk planning in Clause 6.\n\n外部问题来自组织外部环境：法律、技术、市场、文化、社会与经济状况，以及顾客和供应链的期望。员工士气、安全文化成熟度和内部能力差距都属于组织内部问题。第4.1条要求同时确定内外部问题，并据此界定体系范围与第6条的风险策划。","related":[{"n":"5.1","t":"ISO 45001 体系"}],"level":"recall","topic":"Context of the Organization"},{"text":"A corporate auditor is assigned to audit the LOTO programme at her own plant, which she has managed for the past three years. What is the MOST significant concern with this assignment?","group":1,"options":["The audit will probably take longer than the scheduled two days","She may not have the technical competence to evaluate energy isolation","The audit criteria have not been agreed in advance with the auditee","Independence is compromised because she would be auditing her own work"],"correct":3,"explanation":"The independence principle in ISO 19011 requires auditors to be free of bias and conflict of interest, and specifically states that auditors should not audit their own work. An auditor who designed and ran the programme cannot objectively judge its conformity or effectiveness. Competence and schedule are legitimate logistical issues, but they are secondary and do not invalidate the audit the way compromised independence does.\n\nISO 19011 的独立性原则要求审核员不受偏见与利益冲突影响，并明确规定审核员不应审核自己的工作。由设计和运行该项目的审核员评价其符合性和有效性，无法保持客观。审核时长与专业能力是合理的执行问题，但不会像独立性受损那样使审核结论失效。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"application","topic":"Auditor Independence"},{"text":"During an audit, training records show that all 40 maintenance workers completed LOTO training, but interviews reveal that 12 of them cannot describe the energy-isolation sequence. What should the auditor do FIRST?","group":1,"options":["Record an opportunity for improvement about the training material","Accept the records, because documentation is the audit criterion","Conclude that the training clause conforms and mention the gap verbally at the closing meeting","Verify the gap with additional workers and with the training content, then document a nonconformity"],"correct":3,"explanation":"Audit conclusions must rest on verifiable objective evidence, and conflicting evidence must be resolved before a finding is written. Additional interviews and a review of the training content confirm whether the records reflect real competence or only attendance. Records alone do not prove competence (Clause 7.2 requires competence, not attendance), and a verbal observation leaves no traceable corrective action.\n\n审核结论必须建立在可验证的客观证据之上，出现相互矛盾的证据时应先核实再形成发现。追加访谈并核查培训内容，可以判断记录反映的是真实能力还是仅仅签到。记录本身不能证明能力（第7.2条要求的是能力而非出勤），口头提出而不留下可追溯的纠正措施也无法闭环。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"application","topic":"Audit Evidence Conflicts"},{"text":"In ISO 19011 terms, which document sets out the objectives, scope, criteria, dates and audit team for one specific audit?","group":1,"options":["The audit programme","The audit plan","The audit checklist","The audit report"],"correct":1,"explanation":"The audit programme is the set of arrangements for one or more audits planned over a period, while the audit plan describes the activities and arrangements for a single audit. The checklist is a working document derived from the plan, and the report is the output produced after the audit is conducted. Confusing programme with plan is a common exam trap when the question specifies 'one specific audit'.\n\n审核方案（audit programme）是针对一段时间内一项或多项审核的安排，而审核计划（audit plan）描述单次审核的活动与安排。检查表是由计划派生的工具文件，报告是审核实施后的输出。题干限定“某一次具体审核”时，正确答案是审核计划。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"recall","topic":"Audit Programme vs Audit Plan"},{"text":"An auditor samples 60 of 240 training files and finds that 9 files are missing the annual refresher record. If the sample is representative, what is the sample nonconformity rate and the projected number of deficient files in the full population?","group":1,"options":["6 percent, about 14 files","9 percent, about 22 files","15 percent, about 36 files","25 percent, about 60 files"],"correct":2,"explanation":"The sample rate is 9 divided by 60, which equals 0.15 or 15 percent. Projecting to the population: 0.15 times 240 equals 36 deficient files. Nine percent is the raw count reported as a percentage, and 25 percent is the fraction of the population sampled, not the error rate.\n\n样本不符合率 = 9 ÷ 60 = 0.15，即15%；推算总体 = 0.15 × 240 = 36 份。9% 是把发现数量直接当百分比，25% 是抽样比例而非错误率。抽样结论只有在样本具有代表性时才能外推，这一点应在报告中说明。","related":[{"n":"5.4","t":"审核类型"}],"level":"calculation","topic":"Audit Sampling"},{"text":"A manufacturer was certified to ISO 45001 by an accredited certification body three years ago and has maintained the certificate. What audit activity should it expect from the certification body?","group":1,"options":["Nothing until the certificate expires, because certification is valid for the full period","An OSHA compliance inspection each year in place of surveillance","A single re-audit by the company internal audit team","Surveillance audits at least annually, with a recertification audit before the end of the three-year cycle"],"correct":3,"explanation":"Under the certification body rules (ISO/IEC 17021-1), a certificate cycle is three years and the body conducts surveillance audits at least once a year, plus a recertification audit before expiry. Certification is not a one-time event, and internal audits do not substitute for the certification body's activity. OSHA inspections are a separate regulatory process and are not a certification activity.\n\n依据认证机构规则（ISO/IEC 17021-1），认证周期为三年，认证机构每年至少实施一次监督审核，并在证书到期前进行再认证审核。认证不是一次性事件，内部审核不能替代认证机构的活动。OSHA 检查属于执法程序，与认证无关。","related":[{"n":"5.4","t":"审核类型"}],"level":"application","topic":"Certification Surveillance"},{"text":"Top management holds an annual management review, views a slide deck of injury statistics, and adjourns without recording any decisions; the identical deck is presented the following year. Which requirement is MOST clearly unmet?","group":1,"options":["Review outputs: decisions on changes and resources are absent","Monitoring and measurement of OH&S performance data","Consultation and participation of all workers","Competence, training and awareness of the workforce"],"correct":0,"explanation":"Clause 9.3 requires the management review to produce decisions related to improvement opportunities, any need for changes to the system, and resource needs, together with conclusions on suitability, adequacy and effectiveness. A review that produces no decisions and no follow-up on prior actions has failed at the output stage, which is why the same data is recycled. Performance data and worker input may exist, but the missing element is the decision output and its documented record.\n\n第9.3条要求管理评审输出关于改进机遇、体系变更需求和资源需求的决策，并就适宜性、充分性和有效性给出结论。只放幻灯片、不做任何决策、也不跟踪上次评审措施，说明输出环节失效，所以第二年只能重复同样的数据。绩效数据与员工输入可能都存在，真正缺失的是决策输出及其记录。","related":[{"n":"5.5","t":"管理评审"}],"level":"application","topic":"Management Review Outputs"},{"text":"Management review must evaluate the continuing ___ of the OH&S management system. Which set of three criteria completes the requirement?","group":1,"options":["compliance, certification and profitability","efficiency, economy and elegance","suitability, adequacy and effectiveness","scope, severity and frequency"],"correct":2,"explanation":"ISO 45001 Clause 9.3 and ANSI/ASSP Z10.0 both require top management to evaluate continuing suitability (still appropriate for the organization and its context), adequacy (sufficient in coverage and resources) and effectiveness (achieving intended results). Compliance and certification are separate conformity matters, while scope, severity and frequency are risk-assessment terms. These three words are the standard's own language and are frequently tested verbatim.\n\nISO 45001 第9.3条与 ANSI/ASSP Z10.0 都要求最高管理层评价体系的持续适宜性（是否仍适合组织及其环境）、充分性（范围与资源是否足够）和有效性（是否达成预期结果）。合规与认证属于另外的符合性问题，范围、严重度和频率则是风险评估术语。这三个词是标准原文表述，常被直接考查。","related":[{"n":"5.5","t":"管理评审"}],"level":"recall","topic":"Management Review Criteria"},{"text":"A shift supervisor walks the production line at the start of every shift with a checklist that verifies guard presence, housekeeping and eyewash access. This activity is BEST classified as:","group":1,"options":["A third-party audit","A management review","A certification audit","An inspection"],"correct":3,"explanation":"An inspection is a walk-through verification of physical conditions and practices against a checklist, and it is normally performed by line personnel as part of routine operations. An audit is a systematic, documented, independent evaluation of conformity against defined criteria, and it produces findings against management system requirements. Management review is a top-management evaluation of the system, and certification audits are performed by external bodies.\n\n检查（inspection）是依据检查表对现场物理条件和作业实践进行的巡视核实，通常由直线人员作为日常运营的一部分实施。审核（audit）是针对既定准则、系统化并有文件记录的独立符合性评价，产出针对体系要求的发现。管理评审是最高管理层对体系的评价，认证审核则由外部机构实施。","related":[{"n":"5.6","t":"审核与检查"}],"level":"application","topic":"Audit vs Inspection"},{"text":"A U.S. employer wants an accredited third party to certify its occupational health and safety management system. Which standard can be certified?","group":1,"options":["ANSI/ASSP Z10.0","ISO 45001:2018","Both ANSI/ASSP Z10.0 and ISO 45001","OSHA 29 CFR 1910.119"],"correct":1,"explanation":"ISO 45001 is a certifiable requirements standard, so accredited certification bodies can audit an organization against it. ANSI/ASSP Z10.0 is a voluntary U.S. consensus standard written as guidance for a management system and is not used for accredited certification. OSHA 29 CFR 1910.119 is a regulation enforced by government inspectors, not a certifiable management system standard.\n\nISO 45001 是可认证的要求类标准，所以经认可的认证机构可以依据它对组织实施审核认证。ANSI/ASSP Z10.0 是美国的自愿性共识标准，属于管理体系指南，不用于认可认证。OSHA 29 CFR 1910.119 是由政府检查员执行的法规，不是可认证的管理体系标准。","related":[{"n":"5.2","t":"Z10.0 标准"}],"level":"application","topic":"Certifiable Standards"},{"text":"Which statement about ANSI/ASSP Z10.0 is accurate?","group":1,"options":["It is a federal regulation that OSHA enforces through citations","It uses the Annex SL ten-clause structure shared with ISO 9001","It replaced OHSAS 18001 as the international OH&S management standard","It is a voluntary U.S. consensus standard organized in sections 1 through 7"],"correct":3,"explanation":"Z10.0 is a voluntary national consensus standard developed by ANSI and ASSP; it is organized in sections 1 through 7 rather than the Annex SL clause structure. It is not a regulation enforceable by OSHA, and the standard that replaced OHSAS 18001 internationally is ISO 45001. The distinguishing feature of Z10.0 is its explicit requirement to use the hierarchy of controls as the primary risk-reduction approach.\n\nZ10.0 是由 ANSI 与 ASSP 制定的自愿性国家共识标准，按第1至第7节组织，而不是 Annex SL 的十条款结构。它不是 OSHA 可据以开罚单的法规，国际上取代 OHSAS 18001 的是 ISO 45001。Z10.0 的标志性特征是明确要求把控制层级作为降低风险的主要方法。","related":[{"n":"5.2","t":"Z10.0 标准"}],"level":"recall","topic":"Z10.0 Structure"},{"text":"A refinery hires a contractor to clean sludge from storage tanks during a turnaround. Under ISO 45001 Clause 8.1.4, what must the refinery do?","group":1,"options":["Rely entirely on the contractor's own OH&S system, without host involvement","Place every contractor worker under direct host supervision for all tasks","Remove all contractor activities from the scope of the OH&S system","Coordinate procurement with the contractor's OH&S requirements and verify competence"],"correct":3,"explanation":"Clause 8.1.4 requires the organization to coordinate its procurement processes with contractors, establish OH&S criteria for selecting contractors, and verify that contractors and their workers meet those criteria. The host retains responsibility for coordinating activities and for the risks its operations create; it cannot simply delegate them. Direct supervision of all contractor tasks is neither required nor practical, and contractors working under the organization's control cannot be scoped out of the system.\n\n第8.1.4条要求组织把采购与承包过程同承包方的职业健康安全要求相协调，建立选择承包方的职业健康安全准则，并核实承包方及其人员满足这些准则。发包方仍对协调作业活动及其自身运营产生的风险负责，不能简单转移。要求对承包方所有作业直接监督既不必要也不现实，受组织控制的承包方作业也不能被排除在体系范围之外。","related":[{"n":"5.1","t":"ISO 45001 体系"}],"level":"application","topic":"Contractor Control"},{"text":"A LOTO procedure was revised last month, but the previous version is still laminated and posted at six machines, and two crews are working from it. Which requirement has failed?","group":1,"options":["Control of documented information: obsolete documents stayed in use","Competence: the crews were never trained on the revision","Management review: top management did not review the revision","Monitoring and measurement: the procedure was not measured"],"correct":0,"explanation":"Clause 7.5 requires documented information to be controlled so that it is available where needed and protected from loss of integrity, including preventing the unintended use of obsolete documents. The crews may well be competent; the failure is that the superseded version remained in service at the point of use. The practical fix is retrieval and destruction of the old copies plus a documented distribution check, not retraining alone.\n\n第7.5条要求对文件化信息进行控制，使其在需要的地点和时机可获得，并防止作废文件被非预期使用。作业人员可能完全胜任，问题在于旧版本仍在使用现场。可行的整改是回收并销毁旧版、记录分发核查，而不仅是重新培训。","related":[{"n":"5.1","t":"ISO 45001 体系"}],"level":"application","topic":"Documented Information Control"},{"text":"Management finalizes a mandatory cut-resistant glove policy and announces it the day it takes effect. Workers had no input and report that the gloves interfere with dexterity at the assembly fixture. Which ISO 45001 requirement was missed?","group":1,"options":["Clause 5.4 consultation and participation of workers","Clause 7.2 competence","Clause 8.1.2 management of change","Clause 9.1 monitoring, measurement, analysis and evaluation"],"correct":0,"explanation":"Clause 5.4 requires the organization to establish processes for consultation and participation of workers at all applicable levels, including in the development and review of OH&S policies and in decisions on controls. Selecting PPE that workers must wear without consulting them on fit and task interference is the classic failure this clause targets. A change to PPE can also involve management of change, but the specific requirement violated here is consultation and participation.\n\n第5.4条要求组织建立员工协商与参与的机制，覆盖各相关层级，包括职业健康安全方针的制定与评审以及控制措施的决策。在未就贴合度与作业干扰征求意见的情况下强制推行手套，正是该条款针对的典型失误。更换PPE也可能涉及变更管理，但此处被违反的具体要求是协商与参与。","related":[{"n":"5.1","t":"ISO 45001 体系"}],"level":"application","topic":"Worker Consultation"},{"text":"Under ISO 45001 Clause 6.1.2, the hazard identification process must consider which of the following?","group":1,"options":["Only hazards that are addressed by a specific OSHA standard","Only hazards that have already caused an injury at this site","Routine and non-routine activities, including work organization and emergencies","Only hazards identified by the workers' compensation insurer"],"correct":2,"explanation":"Clause 6.1.2 requires identification of hazards arising from routine and non-routine activities, including hazards from the work organization, from emergency situations, and from factors such as infrastructure, equipment, materials and the social environment. Limiting the analysis to regulated hazards or to previously injured cases leaves foreseeable risks uncontrolled. Insurer input can be one data source, but it is not the criterion for what must be identified.\n\n第6.1.2条要求识别常规与非常规活动产生的危害，包括作业组织方式、紧急情况以及基础设施、设备、材料和社会环境等因素带来的危害。只关注有法规条目或曾经造成伤害的危害，会遗漏可预见的风险。保险公司的意见可以作为数据来源之一，但不是识别范围的判定准则。","related":[{"n":"5.1","t":"ISO 45001 体系"}],"level":"recall","topic":"Hazard Identification"},{"text":"An audit team is instructed: evaluate conformance of the machine shop to ISO 45001 Clause 8 and site procedure LOTO-04 between 1 and 5 June. In ISO 19011 terms, which element is the audit CRITERIA?","group":1,"options":["ISO 45001 Clause 8 and site procedure LOTO-04","The machine shop and its adjacent support areas","The audit dates of 1 through 5 June","The audit team and its lead auditor"],"correct":0,"explanation":"Audit criteria are the set of requirements used as a reference against which objective evidence is compared, here ISO 45001 Clause 8 and the LOTO procedure. The machine shop defines the audit scope (boundaries), the dates are scheduling, and the team is a resource. Keeping scope, criteria and objectives distinct is essential because a finding is always a statement that evidence fails to meet a specific criterion.\n\n审核准则（criteria）是用作对比参照的一组要求，此处即 ISO 45001 第8条和上锁挂牌程序 LOTO-04。机加工车间界定的是审核范围（边界），日期属于日程安排，审核组是资源。区分范围、准则与目标十分关键，因为任何不符合都是“证据未满足某条具体准则”的陈述。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"application","topic":"Audit Scope and Criteria"},{"text":"At the closing meeting of an internal audit, the lead auditor should:","group":1,"options":["Present only the findings that line management has already agreed to accept","Identify the individual managers responsible for each nonconformity","Hand over the working papers so the auditee can rewrite the report","Present findings and conclusions and agree correction and corrective-action timeframes"],"correct":3,"explanation":"The closing meeting presents the audit findings and conclusions to the auditee, ensures a common understanding of the evidence, and establishes the timeframe for correction and corrective action. Findings are not negotiable on the basis of acceptance, and the report is the auditor's product, not the auditee's. Audits examine processes and system causes, not individual blame.\n\n末次会议向受审核方陈述审核发现与结论，确保对证据的理解一致，并确定纠正与纠正措施的时限。发现不能以“是否愿意接受”来协商，报告是审核员的成果而非受审核方的作品。审核针对过程与体系原因，不针对个人责任。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"application","topic":"Closing Meeting"},{"text":"An internal audit is performed entirely by reviewing documents in a conference room, with no observation of work and no worker interviews. The MOST significant limitation is that the audit cannot:","group":1,"options":["be used as an input to the management review","verify that documented controls are actually implemented","satisfy the confidentiality principle of ISO 19011","be classified as a first-party internal audit"],"correct":1,"explanation":"Document review shows what the system says should happen; only observation and interviews show what actually happens. An audit without verification at the point of work can confirm that procedures exist but cannot confirm implementation or effectiveness, which is the core of Clause 9.2. It remains a legitimate first-party audit and remains valid input to management review, and confidentiality is not compromised by document review.\n\n文件评审说明体系规定应当发生什么，只有现场观察与访谈才能说明实际发生了什么。缺少作业现场验证的审核可以确认程序是否存在，却无法确认其实施与有效性，而这正是第9.2条的核心。它仍是合法的第一方审核，也仍可作为管理评审输入，保密性也不因文件评审而受损。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"application","topic":"Evidence-Based Auditing"},{"text":"A site recorded 48 audit findings during the year. Thirty-six were closed within the agreed 30-day timeframe and 8 were closed late; 4 remain open at year end. What is the on-time closure rate?","group":1,"options":["44 percent","75 percent","80 percent","92 percent"],"correct":1,"explanation":"On-time closure rate equals findings closed on time divided by total findings: 36 divided by 48 equals 0.75, or 75 percent. Ninety-two percent is the rate of findings closed at all (44 of 48) regardless of timeliness, and 80 percent would treat the 8 late closures as on time relative to the 44 closed. This metric is a leading indicator of how well corrective-action commitments are managed.\n\n按期关闭率 = 按期关闭数 ÷ 发现总数 = 36 ÷ 48 = 0.75，即75%。92% 是“最终已关闭”的比例（44/48），不考核时效；80% 则把8项延期关闭当作按期。该指标衡量纠正措施承诺的管理水平，属于领先指标。","related":[{"n":"5.4","t":"审核类型"}],"level":"calculation","topic":"Audit Finding Closure Rate"},{"text":"The safety manager prepares and signs the annual management review, then circulates it to the plant manager for information. Which statement is correct?","group":1,"options":["Acceptable, because the safety manager owns the OH&S programme","Acceptable, provided the review is repeated every year","Not acceptable, because management review must be conducted by top management","Not acceptable, because management review must be conducted by external auditors"],"correct":2,"explanation":"Clause 9.3 assigns management review to top management, which evaluates suitability, adequacy and effectiveness and commits resources. The safety professional prepares inputs and analysis but cannot substitute for top management's decision-making role. Annual frequency is good practice, but frequency does not fix the ownership problem, and external auditors have no role in the organization's management review.\n\n第9.3条把管理评审交给最高管理层，由其评价适宜性、充分性和有效性并作出资源承诺。安全专业人员负责准备输入与分析，但不能替代最高管理层的决策角色。每年开展是好做法，但频率无法弥补主体错位；外部审核员在管理评审中没有任何角色。","related":[{"n":"5.5","t":"管理评审"}],"level":"application","topic":"Management Review Ownership"},{"text":"A compliance audit differs from a conformance audit primarily because a compliance audit evaluates:","group":1,"options":["adherence to legal requirements rather than internal criteria","financial records rather than safety and health records","worker behaviour rather than the documented procedures","supplier performance rather than internal performance"],"correct":0,"explanation":"A compliance audit tests the organization against external legal requirements such as OSHA standards, while a conformance audit tests it against the requirements of its own management system or a voluntary standard. Both use the same evidence-gathering methods and both can be performed internally or externally. The distinction is the criteria used, not the type of records or the population examined.\n\n合规审核以外部法律法规要求（如OSHA标准）为准则，而符合性审核以组织自身管理体系或自愿性标准的要求为准则。两者使用相同的取证方法，也都可由内部或外部人员实施。区别在于所用准则，而不在于记录类型或检查对象。","related":[{"n":"5.4","t":"审核类型"}],"level":"recall","topic":"Compliance Audit"},{"text":"A company integrates ISO 9001, ISO 14001 and ISO 45001 into a single management system. Which element is unique to the OH&S standard and cannot be satisfied by the quality system alone?","group":1,"options":["Document control and record retention","Internal audit and management review","Competence and training records","Consultation and participation of workers"],"correct":3,"explanation":"Clause 5.4 of ISO 45001 requires consultation and participation of workers in OH&S decision-making, a requirement with no counterpart in ISO 9001. Document control, internal audit and management review are common Annex SL elements that can be integrated into one process serving all three standards. Integration works precisely because the shared elements are identical, while the discipline-specific requirements are kept distinct.\n\nISO 45001 第5.4条要求员工在职业健康安全决策中协商与参与，这在 ISO 9001 中没有对应要求。文件控制、内部审核和管理评审都是 Annex SL 的共同要素，可以通过同一套过程服务三项标准。整合之所以可行，正是因为共同要素文本一致，而各学科特有的要求仍保持独立。","related":[{"n":"5.7","t":"ISO 14000 整合体系"}],"level":"application","topic":"Integrated Management Systems"},{"text":"Which ISO 45001 clause requires the organization to continually improve the suitability, adequacy and effectiveness of the OH&S management system?","group":1,"options":["Clause 6.2","Clause 8.1","Clause 9.1","Clause 10.3"],"correct":3,"explanation":"Clause 10.3 is the continual improvement clause and is the Act phase of the PDCA cycle. Clause 9.1 covers monitoring and measurement, Clause 8.1 covers operational planning and control, and Clause 6.2 covers OH&S objectives and planning to achieve them. The improvement clause links back to Clause 4 context and Clause 6 planning, closing the loop.\n\n第10.3条是持续改进条款，对应 PDCA 中的处置（Act）阶段。第9.1条是监视与测量，第8.1条是运行策划与控制，第6.2条是职业健康安全目标及其实现策划。改进条款回接第4条的组织环境与第6条的策划，形成闭环。","related":[{"n":"5.1","t":"ISO 45001 体系"}],"level":"recall","topic":"Continual Improvement Clause"},{"text":"A manufacturer outsources abrasive blasting to a nearby job shop. Under ISO 45001, the manufacturer must:","group":1,"options":["ensure the outsourced process is controlled through the outsourcing agreement","treat the outsourced process as outside the OH&S system scope","require the job shop to obtain ISO 45001 certification first","transfer all OH&S legal responsibility to the job shop by contract"],"correct":0,"explanation":"Clause 8.1.4.3 requires the organization to ensure that outsourced processes are controlled, which means specifying OH&S requirements in the agreement and monitoring the work. Certification is one possible selection criterion but is not a requirement of the standard, and legal responsibility for the organization's own activities cannot be transferred by contract. Outsourcing changes who performs the work, not the duty to control the risk.\n\n第8.1.4.3条要求组织确保外包过程得到控制，即在协议中规定职业健康安全要求并监督其执行。认证可以作为选择承包方的条件之一，但不是标准的要求；组织自身活动的法律责任也不能通过合同转移。外包改变的是由谁作业，而不是控制风险的义务。","related":[{"n":"5.1","t":"ISO 45001 体系"}],"level":"application","topic":"Outsourced Processes"},{"text":"An audit programme manager has only 60 auditor-days available for 14 departments. Which approach BEST reflects the risk-based approach in ISO 19011?","group":1,"options":["Audit every department on a fixed three-year rotation regardless of performance","Audit the departments that management asks about most often","Audit only departments that recorded an injury in the past year","Audit higher-risk and poorer-performing departments more frequently and lower-risk departments less often"],"correct":3,"explanation":"The risk-based approach directs audit resources toward areas with the greatest OH&S risk and the weakest performance, which is also what Clause 9.2 requires when setting the audit programme. A fixed rotation ignores risk, management requests are not a risk criterion, and injuries alone are a lagging signal that misses high-risk areas with no history yet. The rationale for the schedule should be documented so it can be defended.\n\n基于风险的方法要求把审核资源投向风险最高、绩效最差的领域，这也是第9.2条在制定审核方案时的要求。固定轮换忽视风险，管理层的关注不等于风险准则，仅凭伤害记录属于滞后信号，会漏掉尚无事故的高风险区域。排期理由应形成文件以便解释。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"application","topic":"Risk-Based Audit Scheduling"},{"text":"An audit team assigned to an ammonia refrigeration facility has no experience with ammonia systems. Under ISO 19011, the BEST solution is to:","group":1,"options":["add a technical expert to advise the team while the auditor retains responsibility for the audit","cancel the audit until a permanently employed auditor with that expertise is hired","let the refrigeration supervisor explain the process and sign off on the findings","limit the audit to a document review of the process safety management manuals"],"correct":0,"explanation":"ISO 19011 allows technical experts to support an audit team with specialized knowledge while the auditors remain responsible for the audit and its conclusions. The supervisor being audited cannot validate findings, and cancelling or narrowing the audit to documents defeats its purpose. Selecting the team must consider the competence needed for the specific scope, not just general auditing skill.\n\nISO 19011 允许技术专家为审核组提供专门知识，而审核员仍对审核及其结论负责。受审核的车间主管不能为自己的区域确认发现，取消审核或把审核缩成文件评审也失去了审核的意义。组队时必须考虑具体范围所需的能力，而不仅是通用审核技能。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"application","topic":"Technical Experts"},{"text":"Which pair correctly distinguishes management review from internal audit?","group":1,"options":["Management review is performed by auditors; audit is performed by top management","Management review verifies conformity; internal audit allocates resources","Management review is voluntary; internal audit is required by federal law","Management review judges suitability and resources; audit verifies conformity to criteria"],"correct":3,"explanation":"Management review is a top-management evaluation of whether the system remains suitable, adequate and effective, and it produces decisions and resource commitments. Internal audit is an independent, evidence-based check of conformity to defined criteria and produces findings. Both are required by ISO 45001 Clause 9, but they answer different questions and are performed by different parties.\n\n管理评审是最高管理层对体系是否仍然适宜、充分和有效的评价，并产出决策与资源承诺。内部审核是独立的、基于证据的符合性检查，产出审核发现。两者都由 ISO 45001 第9条要求，但回答不同的问题，也由不同主体实施。","related":[{"n":"5.5","t":"管理评审"}],"level":"recall","topic":"Review versus Audit"},{"text":"An auditor finds that corrective actions for a serious fall hazard were recorded as complete, but fall protection is still missing at three of the five locations named in the original finding. How should this be classified?","group":1,"options":["An opportunity for improvement","A minor nonconformity, because a corrective-action record exists","A conformity, because the corrective-action process was followed","A major nonconformity, because the corrective-action process failed systematically"],"correct":3,"explanation":"A finding is classified by its effect on the system, and here the corrective-action process accepted unverified closure on a serious hazard across most of the affected locations. That is a systemic failure affecting the system's ability to control risk, which makes it major rather than minor. The existence of a record proves paperwork, not closure, and the hazard remains.\n\n不符合的严重程度取决于其对体系的影响。此处纠正措施流程在严重坠落危害上接受了未经核实的关闭，且涉及多数受影响位置，属于影响体系控制风险能力的系统性失效，应判为严重不符合。有记录只能证明有纸面流程，不能证明危害已消除。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"application","topic":"Nonconformity Classification"},{"text":"A nonconformity about missing machine guards was closed after guards were installed on the two machines cited. Six months later a guard is missing on a third machine of the same model. What does this indicate?","group":1,"options":["The correction was made, but the systemic cause was never addressed or verified","The correction was appropriate and the case should remain closed","The finding should have been classified as an opportunity for improvement","The audit scope was too narrow for the audit to be validly conducted"],"correct":0,"explanation":"Installing guards on the two cited machines is a correction; a corrective action would have asked why guards were missing on that machine model and fixed the inspection, procurement or design cause. Clause 10.2 also requires reviewing the effectiveness of corrective action, which would have caught the recurrence. A recurrence on a third unit is evidence of an unresolved systemic cause, not evidence that the original closure was adequate.\n\n给两台被点名的设备安装防护罩属于纠正（correction）；纠正措施则应追问为什么该型号设备会缺失防护罩，并从检查、采购或设计环节消除原因。第10.2条还要求评审纠正措施的有效性，这一环节本可以发现复发。第三台设备再次出现同类问题，说明系统原因尚未解决，而非原关闭足够充分。","related":[{"n":"5.3","t":"ISO 19011 审核"}],"level":"application","topic":"Corrective Action Effectiveness"},{"text":"A distribution center employs 1,200 workers who each worked 2,000 hours last year. The site recorded 48 OSHA-recordable cases. What is the site TRIR?","group":2,"options":["0.4","2.0","4.0","40.0"],"correct":2,"explanation":"Total hours worked equals 1,200 workers times 2,000 hours, or 2,400,000 hours. TRIR equals (48 times 200,000) divided by 2,400,000, which is 9,600,000 divided by 2,400,000, or 4.0. The value 2.0 comes from using the wrong multiplier and 40.0 from a decimal slip.\n\n总工时 = 1,200 人 × 2,000 小时 = 2,400,000 小时。TRIR =（48 × 200,000）÷ 2,400,000 = 9,600,000 ÷ 2,400,000 = 4.0。2.0 来自乘数用错，40.0 则是小数点错位。","related":[{"n":"6.2","t":"TRIR/DART 公式"}],"level":"calculation","topic":"TRIR from Headcount Hours"},{"text":"A warehouse worked 1,500,000 hours last year and recorded 9 cases involving days away from work, restricted duty or job transfer. What is the DART rate?","group":2,"options":["0.6","0.9","1.2","3.0"],"correct":2,"explanation":"DART equals (9 times 200,000) divided by 1,500,000, which is 1,800,000 divided by 1,500,000, or 1.2. The 0.9 value results from dividing by 2,000,000 hours, and 3.0 from using a 500,000-hour denominator. DART uses the same 200,000-hour base as TRIR, so the two rates are directly comparable.\n\nDART =（9 × 200,000）÷ 1,500,000 = 1,800,000 ÷ 1,500,000 = 1.2。0.9 是把分母当成 2,000,000 小时，3.0 是误用 500,000 小时作分母。DART 与 TRIR 使用同一 200,000 小时基数，因此两者可以直接比较。","related":[{"n":"6.2","t":"TRIR/DART 公式"}],"level":"calculation","topic":"DART Rate"},{"text":"A plant recorded 4 lost-time injuries while working 500,000 hours. Using the international convention for lost time injury frequency rate, what is the LTIFR?","group":2,"options":["1.6","4.0","8.0","16.0"],"correct":2,"explanation":"LTIFR equals (4 times 1,000,000) divided by 500,000, which equals 8.0. The value 1.6 comes from mistakenly using the 200,000-hour base, which would give a lost-time injury rate on the OSHA scale rather than an LTIFR. The 1,000,000-hour base represents roughly 500 full-time workers and is the international convention.\n\nLTIFR =（4 × 1,000,000）÷ 500,000 = 8.0。1.6 是误用 200,000 小时基数得到的 OSHA 尺度损失工时率，而非 LTIFR。1,000,000 小时基数约等于 500 名全职工人，是国际通行做法。","related":[{"n":"6.2","t":"TRIR/DART 公式"}],"level":"calculation","topic":"LTIFR Base"},{"text":"A site accrued 90 lost workdays from 5 lost-time cases while working 320,000 hours. What is the severity rate per 200,000 hours?","group":2,"options":["18.0","28.1","56.3","90.0"],"correct":2,"explanation":"Severity rate equals (90 lost workdays times 200,000) divided by 320,000 hours, which is 18,000,000 divided by 320,000, or 56.25, rounded to 56.3. The value 18.0 is the average days per case, not the rate, and 28.1 comes from dividing by 640,000 hours. Severity describes how many days are lost per unit of exposure, not how often cases occur.\n\n严重度率 =（90 损失工作日 × 200,000）÷ 320,000 = 18,000,000 ÷ 320,000 = 56.25，约 56.3。18.0 是每例平均天数而不是率，28.1 来自用 640,000 小时作分母。严重度描述单位暴露量造成的损失天数，而不是发生频率。","related":[{"n":"6.2","t":"TRIR/DART 公式"}],"level":"calculation","topic":"Severity Rate"},{"text":"The same site accrued 90 lost workdays from 5 lost-time cases over 320,000 hours. What is the average severity per lost-time case?","group":2,"options":["4.5 days","9.0 days","12.0 days","18.0 days"],"correct":3,"explanation":"Average severity equals total lost workdays divided by the number of lost-time cases: 90 divided by 5 equals 18 days per case. This measure is not normalized to hours worked, so it answers a different question from the severity rate. Average severity shows how damaging a typical lost-time case is, which helps target return-to-work and case-management efforts.\n\n平均严重度 = 总损失工作日 ÷ 损失工时案例数 = 90 ÷ 5 = 18 天/例。该指标不以工时为分母，因此回答的问题与严重度率不同。它反映典型损失工时案例的破坏程度，有助于针对性地开展复工与个案管理。","related":[{"n":"6.2","t":"TRIR/DART 公式"}],"level":"calculation","topic":"Average Severity per Case"},{"text":"Through the first six months of the year a site worked 260,000 hours and recorded 3 OSHA-recordable cases. Assuming the same exposure and case pattern continues, what is the annualized TRIR?","group":2,"options":["1.15","2.31","4.62","6.00"],"correct":1,"explanation":"Annualizing doubles both the hours (520,000) and the cases (6), so TRIR equals (6 times 200,000) divided by 520,000, which is 2.31. Note that doubling both numerator and denominator leaves the rate unchanged from the half-year rate of (3 times 200,000) divided by 260,000. The 4.62 value incorrectly doubles the cases without the hours.\n\n年化处理同时把工时与案例各翻一倍（520,000 小时与 6 例），TRIR =（6 × 200,000）÷ 520,000 = 2.31。分子分母同时翻倍时比率与半年值（3 × 200,000 ÷ 260,000）相同。4.62 错在只把案例翻倍而未同步调整工时。","related":[{"n":"6.2","t":"TRIR/DART 公式"}],"level":"calculation","topic":"Annualizing Mid-Year Data"},{"text":"A hygienist collects 49 personal noise dosimetry samples with a mean of 88.0 dBA. The population standard deviation is known to be 3.5 dBA. What is the 95 percent confidence interval for the true mean?","group":2,"options":["88.0 plus or minus 0.50 dBA","88.0 plus or minus 0.98 dBA","88.0 plus or minus 1.96 dBA","88.0 plus or minus 3.50 dBA"],"correct":1,"explanation":"With a known population standard deviation, use the Z interval: CI equals mean plus or minus Z times sigma divided by the square root of n. The standard error is 3.5 divided by 7, or 0.5, and 1.96 times 0.5 equals 0.98, so the interval is 87.02 to 88.98 dBA. The 0.50 value is the standard error rather than the margin of error, and 1.96 ignores the sample size.\n\n总体标准差已知时用 Z 区间：CI = 均值 ± Z × σ/√n。标准误 = 3.5 ÷ 7 = 0.5，1.96 × 0.5 = 0.98，区间为 87.02～88.98 dBA。0.50 只是标准误而非误差幅度，1.96 则忽略了样本量。","related":[{"n":"6.7","t":"置信区间"}],"level":"calculation","topic":"Confidence Interval Known Sigma"},{"text":"Thirty-six air samples for a solvent show a mean of 12.0 ppm with a known population standard deviation of 2.4 ppm. What is the 90 percent confidence interval for the mean?","group":2,"options":["12.0 plus or minus 0.40 ppm","12.0 plus or minus 0.66 ppm","12.0 plus or minus 0.78 ppm","12.0 plus or minus 0.98 ppm"],"correct":1,"explanation":"The standard error is 2.4 divided by the square root of 36, or 0.40, and Z for 90 percent confidence is 1.645. The margin is 1.645 times 0.40, or 0.658, so the interval is 11.34 to 12.66 ppm. The 0.40 value is the standard error, and 0.78 would come from using Z equal to 1.96.\n\n标准误 = 2.4 ÷ √36 = 0.40，90% 置信水平对应 Z = 1.645。误差幅度 = 1.645 × 0.40 = 0.658，区间为 11.34～12.66 ppm。0.40 是标准误，0.78 则是误用 Z = 1.96 的结果。","related":[{"n":"6.7","t":"置信区间"}],"level":"calculation","topic":"Ninety Percent Interval"},{"text":"Eight monthly hand-injury counts are 2, 4, 4, 4, 5, 5, 7, 9. What is the sample standard deviation?","group":2,"options":["2.00","2.14","4.00","4.57"],"correct":1,"explanation":"The mean is 40 divided by 8, or 5. The squared deviations sum to 9+1+1+1+0+0+4+16, which is 32, and the sample variance divides by n minus 1, or 7, giving 4.571. The sample standard deviation is the square root, 2.14. The 4.57 value is the variance and 2.00 would result from dividing by n instead of n minus 1.\n\n均值 = 40 ÷ 8 = 5；偏差平方和为 9+1+1+1+0+0+4+16 = 32，样本方差除以 n−1（即 7）得 4.571。样本标准差为其平方根 2.14。4.57 是方差；若除以 n 则得到约 2.00。","related":[{"n":"6.6","t":"统计基础"}],"level":"calculation","topic":"Sample Standard Deviation"},{"text":"A 95 percent confidence interval based on 25 measurements has a margin of error of plus or minus 4.2 ppm. If the sample size is increased to 100 with the same population standard deviation, the new margin of error will be approximately:","group":2,"options":["1.05 ppm","2.10 ppm","4.20 ppm","8.40 ppm"],"correct":1,"explanation":"The margin of error is inversely proportional to the square root of n, so quadrupling the sample halves the margin: 4.2 divided by 2 equals 2.1 ppm. The 1.05 value would require a sixteen-fold increase in sample size. This square-root relationship is why large gains in precision become progressively more expensive in sampling effort.\n\n误差幅度与 √n 成反比，样本量扩大四倍时误差幅度减半：4.2 ÷ 2 = 2.1 ppm。要得到 1.05 需要把样本量扩大十六倍。正是这种平方根关系，使精度提升的边际成本越来越高。","related":[{"n":"6.7","t":"置信区间"}],"level":"calculation","topic":"Interval Width versus Sample Size"},{"text":"A sampling survey of 64 workers yields a mean exposure of 30 ppm with a population standard deviation of 12 ppm. What is the standard error of the mean?","group":2,"options":["0.19 ppm","1.50 ppm","3.00 ppm","12.0 ppm"],"correct":1,"explanation":"The standard error of the mean equals sigma divided by the square root of n: 12 divided by 8 equals 1.5 ppm. The 3.00 value would come from dividing by the square root of 16, and 0.19 from dividing 12 by 64. The standard error describes how much a sample mean would vary from sample to sample, and it is the building block of the confidence interval.\n\n均值标准误 = σ ÷ √n = 12 ÷ 8 = 1.5 ppm。3.00 来自除以 √16，0.19 则是把 12 除以 64。标准误描述样本均值在不同抽样之间的波动程度，是构建置信区间的基础。","related":[{"n":"6.6","t":"统计基础"}],"level":"calculation","topic":"Standard Error"},{"text":"Injury counts by cause are: falls 45, strains 25, lacerations 15, chemical exposure 10, struck-by 5. Using Pareto logic, how many cause categories must be addressed to cover at least 80 percent of the injuries?","group":2,"options":["Two","Three","Four","Five"],"correct":1,"explanation":"Ranked descending, the cumulative percentages are 45, 70, 85, 95 and 100. The third category is the first to push the cumulative total above 80 percent, so the vital few are falls, strains and lacerations. Two categories cover only 70 percent, which falls short, and addressing all five would ignore the prioritization logic that makes Pareto useful.\n\n按频数降序，累计百分比为 45、70、85、95、100。第三个类别首次使累计值超过 80%，因此“关键少数”是跌倒、拉伤和割伤三类。两类只覆盖 70%，不足 80%；五类全抓则失去了帕累托排序的意义。","related":[{"n":"6.8","t":"帕累托分析"}],"level":"calculation","topic":"Pareto Vital Few"},{"text":"Monthly recordable counts for eight months are 3, 4, 4, 6, 7, 9, 11, 14. What is the median?","group":2,"options":["5.0","6.0","6.5","7.0"],"correct":2,"explanation":"With an even number of values the median is the average of the two middle values, here the fourth and fifth: (6 + 7) divided by 2 equals 6.5. The 6.0 and 7.0 values are the individual middle values rather than their average. The median is preferred over the mean when a few large values would distort the average.\n\n数值个数为偶数时，中位数是中间两个值（第4、第5个）的平均：（6 + 7）÷ 2 = 6.5。6.0 与 7.0 只是中间两个原始值而非其平均。当少数极端值会拉动均值时，中位数比均值更稳健。","related":[{"n":"6.6","t":"统计基础"}],"level":"calculation","topic":"Median with Even Count"},{"text":"Two sites report noise exposure data. Site A has a mean of 20 dBA above baseline with a standard deviation of 4; Site B has a mean of 50 with a standard deviation of 8. What is Site A's coefficient of variation?","group":2,"options":["5 percent","20 percent","25 percent","80 percent"],"correct":1,"explanation":"The coefficient of variation equals the standard deviation divided by the mean, times 100: 4 divided by 20 equals 0.20, or 20 percent. Site B's coefficient is 8 divided by 50, or 16 percent, so Site A is actually more variable relative to its mean despite the smaller absolute standard deviation. This is why CV is used to compare variability across groups with different means.\n\n变异系数 = 标准差 ÷ 均值 × 100 = 4 ÷ 20 = 20%。B 场地的变异系数为 8 ÷ 50 = 16%，所以尽管 A 的绝对标准差更小，其相对离散程度反而更高。这正是用变异系数比较均值不同的群体变异性的原因。","related":[{"n":"6.6","t":"统计基础"}],"level":"calculation","topic":"Coefficient of Variation"},{"text":"A site TRIR fell from 5.2 to 3.9 over three years. What is the percentage reduction?","group":2,"options":["13.3 percent","25.0 percent","33.3 percent","75.0 percent"],"correct":1,"explanation":"The reduction is 5.2 minus 3.9, or 1.3, divided by the original 5.2, which equals 0.25 or 25 percent. The 13.3 percent figure comes from dividing the change by the new value instead of the baseline, and 75 percent is the ratio of the new rate to the old. Always divide by the baseline when reporting a percentage change.\n\n降幅 =（5.2 − 3.9）÷ 5.2 = 1.3 ÷ 5.2 = 0.25，即 25%。13.3% 是把变化量除以新值而非基线，75% 则是新率占旧率的比例。报告百分比变化时务必以基线作分母。","related":[{"n":"6.2","t":"TRIR/DART 公式"}],"level":"calculation","topic":"Percent Reduction"},{"text":"A site injury profile over five years is dominated by lacerations during manual deburring at fixed stations. Which is the BEST leading indicator for this specific problem?","group":2,"options":["Number of lacerations recorded per month","Percentage of deburring stations with guards in use","Site DART rate and its twelve-month trend","Workers' compensation claim cost per case"],"correct":1,"explanation":"A useful leading indicator measures the control activities that prevent the loss, and here that is the presence and use of guarding or fixtures at the specific stations driving the injuries. Laceration counts, DART and claim cost are all lagging measures of harm already done. The indicator must also be specific to the exposure, which is why a generic activity count such as number of safety meetings would be weaker than this one.\n\n有效的领先指标应衡量能防止损失的受控活动，此处即具体产伤工位是否安装并实际使用防护装置或夹具。割伤次数、DART 和赔付成本都是伤害发生后的滞后度量。指标还必须与暴露直接相关，所以“安全会议次数”这类通用活动计数要弱得多。","related":[{"n":"6.1","t":"领先与滞后指标"}],"level":"application","topic":"Leading Indicator Selection"},{"text":"A quarterly safety review presents three measures: near-miss reports per 100 workers, audit findings closed on time, and TRIR. Which of these are leading indicators?","group":2,"options":["Near-miss reports per 100 workers and on-time closure of audit findings only","Near-miss reports and TRIR only","On-time closure of audit findings and TRIR only","TRIR also qualifies, because it reflects the current year of experience"],"correct":0,"explanation":"Near-miss reporting and timely closure of audit findings measure preventive activity and control strength before harm occurs, so both are leading. TRIR counts injuries that have already happened, which makes it lagging. Combining both types is good practice, but the classification of each measure does not change with how it is presented.\n\n未遂事件报告率和审核发现按期关闭率衡量的是伤害发生前的预防活动与控制强度，属于领先指标。TRIR 统计的是已经发生的伤害，属于滞后指标。两类指标结合使用是好做法，但单个指标的属性不因呈现方式而改变。","related":[{"n":"6.1","t":"领先与滞后指标"}],"level":"application","topic":"Classifying Indicators"},{"text":"Recordable injuries at a plant have been flat for two years, but near-miss reports tripled after a no-blame reporting campaign. What is the BEST interpretation?","group":2,"options":["The plant itself has become substantially more dangerous","The near-miss data are inflated and should be excluded from review","Reporting culture improved, so hidden risk is now visible","TRIR will certainly rise next year by the same factor"],"correct":2,"explanation":"A rising near-miss count with flat injuries usually signals improved reporting rather than deteriorating conditions, and it gives the organization its first look at previously invisible risk. The value comes only if reported conditions are investigated and corrected. The correct response is to mine the reports for patterns, not to distrust or discard the data, and no automatic rise in TRIR follows.\n\n伤害数持平而未遂报告增至三倍，通常说明报告文化改善、原先隐形的风险开始可见，这为组织提供了第一次看清风险的机会。其价值只有在对报告的条件进行调查和整改后才能实现。正确做法是挖掘报告中的规律，而不是怀疑或丢弃数据；TRIR 也不会因此自动上升。","related":[{"n":"6.1","t":"领先与滞后指标"}],"level":"application","topic":"Near-Miss Reporting Shift"},{"text":"Site A has a TRIR of 6.0 based on 40,000 hours and one recordable case. Site B has a TRIR of 3.0 based on 2,000,000 hours and 30 cases. Which conclusion is BEST supported?","group":2,"options":["Site A is definitely about twice as hazardous as Site B","Site B is definitely about twice as hazardous as Site A","Site A's rate rests on one case and is statistically unstable","Neither rate is valid because both denominators are too small"],"correct":2,"explanation":"The 200,000-hour base produces very unstable rates when the numerator is one case, so a single event can move the site rate by 6.0 points. Site B's 30 cases give a far more reliable estimate. The standard practice is to aggregate multiple years, use confidence intervals, or compare case counts rather than point rates when exposure is small.\n\n当分子只有 1 例时，200,000 小时基数会产生极不稳定的率，单一事件就能让场地率变动 6.0。B 场地 30 例的估计可靠得多。规范做法是合并多年数据、使用置信区间，或在暴露量很小时直接比较案例数而非点估计率。","related":[{"n":"6.4","t":"基准比较"}],"level":"application","topic":"Small-Sample Rates"},{"text":"A consultant's draft report shows a client site with a TRIR of 2.4 and a DART of 3.1. What is the MOST likely explanation?","group":2,"options":["The site has an unusually severe injury profile","DART may legitimately exceed TRIR when cases are severe","DART uses a 1,000,000-hour base while TRIR uses 200,000","One rate is miscalculated, since DART is a subset of TRIR"],"correct":3,"explanation":"Every DART case is by definition also an OSHA-recordable case, so with the same denominator DART can never exceed TRIR. A DART above TRIR therefore signals a calculation or transcription error in one of the two rates. Changing the base would alter both rates consistently and cannot produce this inversion.\n\n按定义，每一个 DART 案例同时都是 OSHA 可记录案例，在分母相同的前提下 DART 永远不可能高于 TRIR。DART 高于 TRIR 只能说明其中一个率计算或转录有误。改变基数会同步影响两个率，因此不可能造成这种倒挂。","related":[{"n":"6.2","t":"TRIR/DART 公式"}],"level":"application","topic":"DART versus TRIR"},{"text":"A control chart of monthly recordable counts shows one point above the upper control limit, after which the process returns to its previous pattern. What is the MOST appropriate action?","group":2,"options":["Investigate that month for a special cause","Recalculate the control limits to include the high point","Treat the point as common-cause variation and take no action","Suspend the safety programme until the chart is stable again"],"correct":0,"explanation":"A point outside the control limits is the classic signal of special-cause variation, and the correct response is to investigate what was different about that period. Removing the point to recalculate limits would hide the signal, and treating it as common cause ignores the chart's own rule. Control limits are usually set at plus or minus three standard deviations, so a point beyond them is unlikely to occur by chance.\n\n控制图上的点超出控制限是特殊原因变异的经典信号，正确响应是调查该时段有何不同。删除该点重算控制限会掩盖信号，把它当作普通原因则无视了控制图自身的判异规则。控制限通常设在 ±3σ，点落在其外纯属偶然的概率很低。","related":[{"n":"6.8","t":"帕累托分析"}],"level":"application","topic":"Control Chart Signals"},{"text":"A safety manager wants to examine whether monthly training hours per worker is associated with the recordable injury rate across 18 departments. Which display is MOST appropriate?","group":2,"options":["Pareto chart","Pie chart","Scatter plot","Histogram"],"correct":2,"explanation":"A scatter plot displays the relationship between two continuous variables, here training hours and injury rate, and reveals direction, strength and outliers. A Pareto chart ranks categorical causes, a pie chart shows parts of a whole, and a histogram shows the distribution of a single continuous variable. For a two-variable relationship the scatter plot is the standard choice.\n\n散点图展示两个连续变量之间的关系，此处是培训时数与伤害率，可显示方向、强度与异常点。帕累托图用于对分类原因排序，饼图展示部分与整体的关系，直方图展示单个连续变量的分布。研究两变量关系时，散点图是标准选择。","related":[{"n":"6.8","t":"帕累托分析"}],"level":"application","topic":"Scatter Plot Use"},{"text":"A safety manager must benchmark the site TRIR against comparable U.S. operations in the same industry. Which source is MOST appropriate?","group":2,"options":["Recent OSHA citation records issued in the region","A vendor's promotional brochure on safety results","The site's own workers' compensation loss runs","BLS injury and illness survey data for the site's NAICS code"],"correct":3,"explanation":"The BLS Survey of Occupational Injuries and Illnesses publishes incidence rates by NAICS industry code using the same 200,000-hour base, which makes it the standard external benchmark. OSHA citation records show enforcement activity, not industry injury rates. Internal loss runs are useful for trend analysis but cannot provide an external comparison.\n\nBLS 的《职业伤害与疾病调查》按 NAICS 行业代码发布发生率，且使用同样的 200,000 小时基数，因此是标准的外部基准来源。OSHA 的处罚记录反映执法活动而非行业伤害率。内部赔付数据适合做趋势分析，但无法提供外部比较。","related":[{"n":"6.4","t":"基准比较"}],"level":"application","topic":"Industry Benchmark Source"},{"text":"A site reports a TRIR of 2.1 against an industry average of 3.0, but the site denominator excludes about 30 percent of the hours worked at the facility because those hours belong to contractors. How should this comparison be viewed?","group":2,"options":["The site is clearly better than the industry average","Contractor hours are always excluded, so the comparison is exact","The comparison may be misleading, because exposure is understated","The site rate should be multiplied by the industry average first"],"correct":2,"explanation":"A rate is only comparable when the numerator and denominator cover the same population; dropping contractor hours while contractor injuries still occur at the site distorts the result. Best practice is to define the boundary consistently and disclose it, or to report contractor and employee rates separately. No adjustment factor converts one population into another after the fact.\n\n只有当分子与分母覆盖同一人群时，率才具有可比性；把承包方工时剔除、却仍在该场所发生承包方伤害，会扭曲结果。最佳做法是统一界定边界并予以披露，或分别报告雇员与承包方的率。事后没有任何调整系数能把一个人群换算成另一个人群。","related":[{"n":"6.4","t":"基准比较"}],"level":"application","topic":"Benchmark Comparability"},{"text":"An employee strains his back lifting a box at work and is placed on restricted duty for four days, then returns to full duty without medical treatment beyond first aid. How must this case be handled under 29 CFR 1904?","group":2,"options":["It is not recordable because only first aid was provided","It is reportable to OSHA within 24 hours","It is recordable only if the employee files a workers' compensation claim","It is recordable as a case with days of restricted work activity"],"correct":3,"explanation":"Restricted work activity is one of the general recording criteria in 1904.7, even when the treatment provided is only first aid, so the case must be entered on the 300 Log with the number of restricted duty days. A workers' compensation claim is irrelevant to recordability, and the 24-hour reporting requirement applies to fatalities and to amputations, inpatient hospitalizations or loss of an eye, not to an ordinary restricted-duty case.\n\n受限工作（restricted work）是 1904.7 规定的一般记录标准之一，即使所给处理仅为急救，也必须记入 300 日志并填写受限工作日数。是否申报工伤赔付与可记录性无关；24 小时报告要求适用于死亡以及截肢、住院或失明，不适用于普通的受限工作案例。","related":[{"n":"6.3","t":"OSHA 记录判定"}],"level":"recall","topic":"Restricted Duty Recordability"},{"text":"Within what time must an employer report a work-related amputation to OSHA?","group":2,"options":["7 calendar days","8 hours","15 working days","24 hours"],"correct":3,"explanation":"Under 29 CFR 1904.39, fatalities must be reported within 8 hours, while amputations, in-patient hospitalizations and losses of an eye must be reported within 24 hours. The 7-day period is the deadline for entering a case on the 300 Log, not for reporting to OSHA. The 15-working-day period applies to contesting a citation and to employee access to exposure records.\n\n依据 29 CFR 1904.39，死亡须在 8 小时内报告，而截肢、住院治疗和失明须在 24 小时内报告。7 天是记入 300 日志的时限，不是向 OSHA 报告的时限。15 个工作日适用于对罚单提出异议以及员工查阅暴露记录。","related":[{"n":"6.3","t":"OSHA 记录判定"}],"level":"recall","topic":"Twenty-Four Hour Reporting"},{"text":"A plant wants to measure safety culture rather than safety outcomes. Which approach gives the most defensible picture?","group":2,"options":["Report the TRIR and DART trend for the past three years","Count the number of safety meetings held each month","Combine a perception survey, observations and reporting data","Ask the plant manager to rate the culture on a one-to-ten scale"],"correct":2,"explanation":"Culture is about shared beliefs and behaviors, so it is best triangulated from what people say (survey), what they do (observations) and how they respond (reporting rates). Injury rates describe outcomes that are influenced by reporting and exposure, and meeting counts measure activity, not culture. A single manager rating is one subjective opinion and is vulnerable to bias.\n\n文化关乎共享的信念与行为，因此最好通过“人们怎么说”（问卷）、“人们怎么做”（行为观察）和“人们如何响应”（报告率）三方面交叉验证。伤害率描述的是受报告习惯与暴露量影响的结果，会议次数衡量的是活动量而非文化。单一管理者的评分只是主观意见，容易有偏差。","related":[{"n":"6.5","t":"安全文化测量"}],"level":"application","topic":"Culture Measurement"},{"text":"A construction safety manager wants one monthly number that will show whether field controls are weakening before injuries appear. Which candidate measure is the WEAKEST choice for that purpose?","group":2,"options":["Percentage of identified hazards closed within 14 days","Number of safety meetings held per month","Percentage of workers with current fall-protection training","Number of pre-task plans reviewed by a supervisor before work starts"],"correct":1,"explanation":"Counting meetings measures activity, not whether the meetings changed conditions or behavior, so it can rise while risk stays flat. Closure of identified hazards, current training and verified pre-task planning are all tied to specific controls that prevent injury. A leading indicator should be measurable, actionable and linked to the risk it is meant to control.\n\n只统计会议次数衡量的是活动量，而不是会议是否改变了现场条件或行为，因此它可能在风险毫无下降时继续上升。隐患关闭率、培训有效性和作业前计划核查都直接绑定具体控制措施。领先指标应当可测量、可行动，并与它所要控制的危害相关。","related":[{"n":"6.1","t":"领先与滞后指标"}],"level":"application","topic":"Weak Leading Indicators"},{"text":"A corporate safety scorecard tracks TRIR, DART and severity rate only. What is the principal weakness of this scorecard?","group":2,"options":["It uses too many different measures for managers to follow","It mixes incidence and severity measures in a single view","It is all lagging, so it reports harm only after the fact","It cannot be compared across business units or years"],"correct":2,"explanation":"All three measures count outcomes that have already occurred, so the scorecard cannot show whether controls are weakening until injuries appear. Leading indicators such as audit closure, training currency and near-miss trends provide that earlier signal. The measures are in fact comparable across units, and combining incidence with severity is a strength rather than the weakness.\n\n这三项指标统计的都是已经发生的结果，因此在控制措施弱化时无法提前预警，只能等伤害出现后才知道。审核关闭率、培训时效和未遂趋势等领先指标可以提供更早的信号。这三项指标其实可以跨单位比较，而把发生率与严重度放在同一视图恰恰是优点。","related":[{"n":"6.1","t":"领先与滞后指标"}],"level":"application","topic":"Lagging-Only Scorecard"},{"text":"A case is recordable only if it is work-related, is a new case, and meets one of the general recording criteria. Which of the following is NOT one of those criteria?","group":2,"options":["Medical treatment beyond first aid","Days away from work, restricted work or job transfer","Loss of consciousness","A near miss in which no one was injured"],"correct":3,"explanation":"The general recording criteria in 1904.7 include death, days away, restricted work or transfer, medical treatment beyond first aid, loss of consciousness, and a significant injury or illness diagnosed by a physician. A near miss involves no injury or illness, so it is not recordable, although it should be investigated as a free lesson. Near misses are valuable leading-indicator data precisely because they fall outside the 300 Log.\n\n1904.7 的一般记录标准包括死亡、离岗、受限工作或转岗、超出急救范围的医疗处理、意识丧失，以及医师诊断的严重伤害或疾病。未遂事件没有造成伤害或疾病，因此不可记录，但仍应作为免费的学习机会进行调查。未遂事件之所以是宝贵的领先指标数据，正是因为它们不进入 300 日志。","related":[{"n":"6.3","t":"OSHA 记录判定"}],"level":"recall","topic":"General Recording Criteria"},{"text":"An investigation's 5 Whys chain ends with the statement that the operator was careless and did not follow the procedure. Why is this an inadequate stopping point?","group":3,"options":["Because carelessness is never a real factor in incidents","Because 5 Whys must reach exactly five levels of questioning","Because the operator should be interviewed a second time","Because it names a person rather than the system that allowed the deviation"],"correct":3,"explanation":"Stopping at individual blame produces a corrective action of retraining or discipline, which leaves the conditions that permitted the error fully intact. A useful root cause explains why the deviation was possible, for example an unclear procedure, missing interlock or production pressure. Human error can be a starting point for the analysis but not the end of it.\n\n止步于追究个人责任，最终只会得出“再培训”或“纪律处分”这类纠正措施，而使错误得以发生的条件原封不动。有效的根本原因要解释偏差为何可能发生，例如程序不清、缺少联锁或生产压力。人的失误可以作为分析的起点，但不能作为分析的终点。","related":[{"n":"7.5","t":"根源分析方法"}],"level":"application","topic":"5 Whys Stopping Too Early"},{"text":"A maintenance technician reached into a running conveyor to clear a jam and fractured her hand. Which 5 Whys ending identifies a system-level cause that a corrective action can address?","group":3,"options":["Why was it running? Because no lockout step existed for clearing jams","Why did she reach in? Because she was careless about her own safety","Why was she hurt? Because she was simply unlucky that day","Why did it happen? Because conveyors are inherently dangerous equipment"],"correct":0,"explanation":"The system-level answer identifies a missing control, the absence of an energy-isolation step in the task procedure, which can be corrected by revising the procedure and adding a physical interlock. Carelessness, bad luck and inherent danger are dead ends that generate no actionable change. Effective root causes point to conditions management can control.\n\n系统层面的答案指出了缺失的控制措施——作业程序中没有能量隔离步骤，因而可以通过修订程序和增加物理联锁来纠正。粗心、运气不好、设备本身危险都是死胡同，产生不了可执行的改进。有效的根本原因指向管理层可以控制的条件。","related":[{"n":"7.5","t":"根源分析方法"}],"level":"application","topic":"System-Level Why"},{"text":"On a cause-and-effect diagram using the 6M categories, inadequate lighting at a work station belongs in which category?","group":3,"options":["Man/People","Machine","Environment","Measurement"],"correct":2,"explanation":"Lighting, temperature, noise, housekeeping and layout are environmental conditions, so they belong under Environment. Man/People covers training, fatigue and communication, Machine covers equipment condition and design, and Measurement covers inspection, monitoring and calibration. Correct categorization matters because it directs the team's brainstorming toward the right evidence.\n\n照明、温度、噪声、整洁和布局属于环境条件，应归入“环境（Environment）”分支。“人”涵盖培训、疲劳与沟通，“机”涵盖设备状态与设计，“测”涵盖检查、监测与校准。正确归类很重要，因为它把团队的头脑风暴引向相应的证据。","related":[{"n":"7.5","t":"根源分析方法"}],"level":"recall","topic":"Fishbone Categories"},{"text":"A crew used a procedure that had never been updated after an equipment modification, and the wrong valve was opened during a transfer. On a cause-and-effect diagram, the outdated procedure is BEST classified under:","group":3,"options":["Methods","Man/People","Materials","Measurement"],"correct":0,"explanation":"Methods covers the procedures, work instructions and practices used to perform the task, so a procedure that no longer matches the equipment is a method failure. The crew followed the document they were given, which is why Man/People is the wrong category here. The underlying management failure is that the modification did not trigger a procedure update, which links to management of change.\n\n“方法（Methods）”涵盖完成任务所用的程序、作业指导书和做法，因此与设备改造后不再匹配的程序属于方法失效。作业人员只是执行了发给他们的文件，所以“人”不是正确类别。更深层的管理失效在于改造没有触发程序更新，这与变更管理直接相关。","related":[{"n":"7.5","t":"根源分析方法"}],"level":"application","topic":"Outdated Procedure Category"},{"text":"Which statement correctly distinguishes event tree analysis from fault tree analysis?","group":3,"options":["Event trees are deductive and start from a top event, while fault trees are inductive","Both are deductive methods and differ only in their notation and layout","Event trees analyze management failures, while fault trees analyze hardware failures","Event trees are inductive and run forward; fault trees are deductive and trace backward"],"correct":3,"explanation":"An event tree starts with an initiating event and follows the possible success or failure branches forward to the outcomes, which makes it inductive. A fault tree begins with a defined top event and works backward through Boolean gates to the combinations of basic failures that could cause it, which makes it deductive. Both can be quantitative, and both address combinations of failures rather than management factors alone.\n\n事件树从初始事件出发，沿成功或失败分支向前推演到各种后果，属于归纳（inductive）方法；故障树从既定的顶事件出发，通过布尔门向后追溯导致该事件的基本故障组合，属于演绎（deductive）方法。两者都可以定量，且都关注故障组合，而不只是管理因素。","related":[{"n":"7.5","t":"根源分析方法"}],"level":"recall","topic":"Event Tree versus Fault Tree"},{"text":"An investigator arrives 40 minutes after a fall from a mezzanine. The worker is en route to hospital, co-workers have already moved the ladder, and light rain is falling. Which evidence should be collected FIRST?","group":3,"options":["Written statements from all witnesses collected in a group meeting","Photographs and measurements of the scene, including ladder position","The ladder maintenance history from the computerized system","The injured worker's training file and certification record"],"correct":1,"explanation":"Evidence that can change or disappear must be secured first, and the scene is actively degrading because of rain and because the ladder has been moved. Photographs and measurements, including reference points showing where the ladder was found, preserve the physical facts before they are lost. Records such as maintenance history and training files are stable and can be retrieved later.\n\n会变化或消失的证据必须优先固定，而此处的现场正因为下雨和梯子被移动而持续退化。先拍照并测量，同时记录能显示梯子原始位置的参照点，才能在事实消失前把它固定下来。维修历史和培训档案属于稳定记录，可以稍后调取。","related":[{"n":"7.3","t":"证据链"}],"level":"application","topic":"Perishable Evidence"},{"text":"A press crushed a worker's hand. The production manager wants the machine cleaned and restarted before the next shift begins. What should the safety professional recommend?","group":3,"options":["Lock out and tag the equipment, preserve its position, and release it only after the scene has been documented","Allow the restart once the blood has been cleaned, because photographs can be taken later","Restart the press but move it to another bay for the investigation","Release the press after a supervisor signs a statement describing the injury"],"correct":0,"explanation":"The equipment in its post-incident state is primary evidence of guard position, control settings and the location of the injury, so it must be locked out and preserved until documented. Cleaning and restarting destroys that evidence and can also expose other workers to the same condition. A supervisor statement is not a substitute for the physical evidence the machine itself provides.\n\n设备在事故后的原始状态是防护装置位置、控制设定和受伤部位的主要物证，因此必须上锁挂牌并保持原状直至完成记录。清理后重启会销毁这些证据，还可能让其他工人暴露于同一条件。主管的书面陈述不能替代设备本身提供的物证。","related":[{"n":"7.3","t":"证据链"}],"level":"application","topic":"Scene Preservation"},{"text":"A damaged sling was removed from the scene, stored in an unlocked maintenance cabinet, and handed to a testing lab two days later with no signatures recorded. What is the MOST significant consequence?","group":3,"options":["The sling can no longer be tested by the laboratory","The lab results will be inadmissible in every jurisdiction","The whole investigation must restart from the beginning","The chain of custody is broken, so the evidence can be challenged"],"correct":3,"explanation":"Chain of custody is the documented, unbroken record of who handled the evidence, when, and for what purpose. Without signatures the sling could have been substituted, altered or contaminated, so its evidentiary weight collapses even if testing is still possible. Testing remains feasible and the investigation continues, but the physical evidence is now open to challenge.\n\n证据链是记录“谁在何时为何目的接触过证据”的连续书面记录。缺少签名意味着吊带可能被调换、改动或污染，即使仍可检测，其证据价值也已崩塌。检测依然可行、调查也应继续，但该物证已可被质疑。","related":[{"n":"7.3","t":"证据链"}],"level":"application","topic":"Broken Chain of Custody"},{"text":"Three workers witnessed a scaffold collapse and one of them was injured and is being treated. What is the BEST interview plan?","group":3,"options":["Interview the uninjured witnesses separately and promptly, then interview the injured worker when medically able","Interview all three together so their accounts can be reconciled on the spot","Interview the injured worker first, before pain medication affects memory","Wait until all three are available so the interviews can occur at the same time"],"correct":0,"explanation":"Memories fade and witnesses talk to one another, so interviews should begin promptly and each witness should be interviewed alone to prevent contamination. The injured worker is interviewed when their medical condition allows, using the same open-ended approach. Group interviews and delay both degrade the quality of the accounts.\n\n记忆会衰退，证人之间也会互相交流，因此访谈应尽快开始，并且每人单独进行以避免相互污染。受伤工人则在医疗条件允许时以同样的开放式方式访谈。集体访谈和拖延都会降低证词质量。","related":[{"n":"7.4","t":"证人访谈"}],"level":"application","topic":"Interview Sequencing"},{"text":"Which question is MOST appropriate for a witness interview?","group":3,"options":["You did check the guard before starting, didn't you?","Who forgot to lock out the machine before the jam?","Describe what you saw from the alarm until the machine stopped.","Was the shift supervisor responsible for this?"],"correct":2,"explanation":"An open-ended request for a narrative lets the witness volunteer what they actually observed, including details the investigator did not anticipate. The other three questions are leading or blame-oriented and suggest the answer the investigator expects. Closed and leading questions can be used later to clarify specific facts already offered.\n\n开放式叙述请求让证人主动提供其真实观察，包括调查者未曾预料的细节。其余三个问题属于诱导性或追责性提问，暗示了调查者预期的答案。封闭式和诱导式问题可在之后用于澄清已主动提供的具体事实。","related":[{"n":"7.4","t":"证人访谈"}],"level":"application","topic":"Open-Ended Questions"},{"text":"An investigator wants to audio-record a witness interview. What is the correct practice?","group":3,"options":["Recording is prohibited in all incident investigations","Record only when the witness happens to be a supervisor","Record covertly so the witness speaks more freely","Obtain consent, record, and let the witness review the statement"],"correct":3,"explanation":"Recording is a valuable accuracy tool when the witness agrees to it, and giving the witness the opportunity to review the statement protects both the witness and the investigation. Covert recording destroys trust and may be unlawful depending on jurisdiction. The written notes plus the reviewed statement form the durable record.\n\n在证人同意的前提下，录音是提高准确性的有效工具，让证人复核陈述既保护证人也保护调查。秘密录音破坏信任，且可能因司法辖区不同而违法。书面笔记加上经复核的陈述构成可靠的记录。","related":[{"n":"7.4","t":"证人访谈"}],"level":"application","topic":"Recording Interviews"},{"text":"An investigation finds that the jam-clearing task had no written procedure and that operators had cleared jams this way for years with supervisory knowledge. This finding is BEST classified as:","group":3,"options":["A root (system) cause","An immediate cause","An injury mechanism","A substandard act by the operator"],"correct":0,"explanation":"A missing procedure combined with long-standing supervisory acceptance is a management-system deficiency, which is what makes a cause a root cause. The immediate cause is the specific act or condition at the moment of injury, such as reaching into the running conveyor, and the injury mechanism is the energy transfer that produced the fracture. Correct classification matters because system causes require system-level corrective actions.\n\n缺少程序加上主管长期默许，构成管理体系缺陷，这正是“根本原因”的内涵。直接原因是伤害发生瞬间的具体行为或状态，例如把手伸入运行中的输送机；伤害机理则是造成骨折的能量传递。正确分类很关键，因为系统原因需要系统层面的纠正措施。","related":[{"n":"7.1","t":"事故调查目的"}],"level":"application","topic":"Root Cause Classification"},{"text":"A deburring station has produced four hand lacerations in a year, and cut-resistant gloves were reissued after each one. Which corrective action is MOST likely to prevent recurrence?","group":3,"options":["Reissue cut-resistant gloves with a signed acknowledgement from each operator","Add a line to the JHA requiring careful hand placement","Install a holding fixture and guard so hands cannot reach the blade","Retrain the operators on the existing procedure"],"correct":2,"explanation":"The recurrence after each glove reissue shows that PPE and administrative measures are not controlling the hazard, so an engineering change that removes hand exposure is the appropriate level of the hierarchy of controls. Fixtures and guards do not depend on moment-to-moment behavior. Gloves, JHA wording and retraining all leave the hand in the blade's reach.\n\n每次重新发放手套后仍然复发，说明PPE和行政措施无法控制该危害，因此应当采用消除手部暴露的工程改造，符合控制层级的正确层级。夹具和防护装置不依赖作业人员每时每刻的行为。手套、JHA措辞和再培训都仍让手处在刀刃可及范围内。","related":[{"n":"7.7","t":"纠正措施"}],"level":"application","topic":"Corrective Action Selection"},{"text":"A corrective action required installing interlocked gates on two packaging machines. How should the safety professional verify that the action is effective?","group":3,"options":["Confirm the purchase order was paid and the invoice is on file","Confirm the maintenance manager signed the work order complete","Test the interlocks and monitor for bypass events over the next months","Add the item to next year's annual audit checklist"],"correct":2,"explanation":"Effectiveness verification requires evidence that the control actually works in service and stays working, which means functional testing plus a period of monitoring for bypasses. Invoices and signatures prove that money was spent and paperwork was completed, not that the interlock prevents access. Adding the item to a checklist a year later is too slow and verifies documentation rather than function.\n\n有效性验证需要证明控制措施在实际使用中确实有效并持续有效，因此既要功能测试，也要在随后一段时间监测是否被旁路或失效。发票与签字只能证明花了钱、办了手续，不能证明联锁能阻止接触。一年后再加入检查表则太慢，而且验证的是文件而不是功能。","related":[{"n":"7.7","t":"纠正措施"}],"level":"application","topic":"Verifying Effectiveness"},{"text":"In the seven-step incident investigation process, what immediately follows the collection of evidence and facts?","group":3,"options":["Reporting the case to OSHA within 8 hours","Implementing corrective actions and tracking them","Closing the investigation and filing the report","Analyzing the facts to determine causal factors"],"correct":3,"explanation":"The sequence is to secure the scene and provide care, gather evidence and facts, analyze the facts to determine causal factors, then develop corrective actions and track them to closure. Analysis must precede corrective actions, otherwise the organization is guessing at remedies. Reporting obligations run in parallel from the moment of the incident but are not the next analytical step.\n\n正确的顺序是：保护现场并提供救治、收集证据与事实、分析事实以确定致因、制定并跟踪纠正措施直至关闭。分析必须先于纠正措施，否则组织只是在猜测补救办法。报告义务从事故发生时即并行启动，但不是分析流程的下一步。","related":[{"n":"7.2","t":"七步调查流程"}],"level":"recall","topic":"Investigation Sequence"},{"text":"Which statement is MOST appropriate for the findings section of an incident investigation report?","group":3,"options":["The operator failed to follow the written procedure because he is careless","The jam-clearing task had no isolation step, and 2 of 5 operators cleared jams live","The department has a poor safety culture overall, which explains it","The incident was unavoidable given the tight production schedule"],"correct":1,"explanation":"Findings should state verifiable facts, including the condition found and the supporting evidence, so that corrective actions can be traced to them. Blaming an individual, labeling culture and declaring an event unavoidable are conclusions without evidence that close off analysis. Quantified observations such as two of five operators interviewed also show the condition is systemic rather than isolated.\n\n发现部分应陈述可核实的事实，包括所发现的条件及其支撑证据，使纠正措施可以追溯到这些事实。指责个人、给文化贴标签、宣称事故不可避免，都是缺乏证据的结论，会切断后续分析。诸如“访谈的5名操作工中有2人”这样的量化描述，还能说明该条件是系统性的而非孤例。","related":[{"n":"7.2","t":"七步调查流程"}],"level":"application","topic":"Writing Findings"},{"text":"A serious incident occurred on Friday, but the investigation team first visited the area the following Wednesday. What is the MOST likely effect on the investigation?","group":3,"options":["Perishable evidence such as positions, spills and memory has degraded","No effect, because the report can be reconstructed from injury records","Only the OSHA reporting deadline is affected by the delay","The investigation becomes more objective because emotions have cooled"],"correct":0,"explanation":"Scene conditions, physical evidence and human memory all deteriorate quickly, and a five-day delay means the team must rely on secondhand descriptions and cleaned-up areas. Injured-worker records and OSHA deadlines do not preserve causal evidence. Prompt response is a core requirement of the investigation process for exactly this reason.\n\n现场条件、物证和人的记忆都会迅速退化，拖延五天意味着团队只能依赖二手描述和已被清理的区域。伤者病历和 OSHA 时限并不能保存致因证据。正因如此，迅速响应是调查流程的核心要求。","related":[{"n":"7.2","t":"七步调查流程"}],"level":"application","topic":"Investigation Delay"},{"text":"Which event qualifies as a near miss for reporting purposes?","group":3,"options":["A worker sprains an ankle stepping off a pallet and receives first aid","A machine guard is found loose during a scheduled inspection","A suspended load slips and lands in an aisle a worker just left","A wo
