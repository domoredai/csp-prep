rker reports fatigue at the end of a long night shift"],"correct":2,"explanation":"A near miss is an unplanned event that did not cause injury or damage only because of timing or a lucky break, and the falling load fits that definition exactly. The sprain is an injury case, the loose guard is a hazardous condition found by inspection, and a fatigue report is a symptom rather than an event. Near misses are worth reporting because they reveal the same failure paths that produce injuries.\n\n未遂事件是未造成伤害或损失的非计划事件，仅因时机或侥幸而未致害，坠落的吊物正符合这一定义。扭伤属于伤害案例，松动的防护罩是检查发现的危险状态，疲劳报告则是症状而非事件。未遂事件值得报告，是因为它揭示了与伤害相同的失效路径。","related":[{"n":"7.6","t":"未遂事件"}],"level":"application","topic":"Near Miss Definition"},{"text":"An incident produced 18,000 dollars in direct costs. If indirect costs run about 4 times direct costs for this operation, what is the estimated total cost?","group":3,"options":["90,000 dollars","72,000 dollars","22,500 dollars","4,500 dollars"],"correct":0,"explanation":"Indirect costs are 4 times 18,000, or 72,000, and total cost is direct plus indirect: 18,000 plus 72,000 equals 90,000 dollars. Equivalently, total equals 5 times direct. The 72,000 value is only the indirect portion, and 22,500 comes from dividing rather than multiplying.\n\n间接成本 = 4 × 18,000 = 72,000，总成本 = 直接 + 间接 = 18,000 + 72,000 = 90,000 美元，等价于直接成本的 5 倍。72,000 只是间接部分，22,500 则是用除法而非乘法得出的错误结果。","related":[{"n":"7.9","t":"事故成本"}],"level":"calculation","topic":"Total Incident Cost"},{"text":"An incident cost the organization 96,000 dollars in combined direct and indirect costs and resulted in 240 lost workdays. What is the cost per lost workday?","group":3,"options":["240 dollars","400 dollars","960 dollars","4,000 dollars"],"correct":1,"explanation":"Divide total cost by lost workdays: 96,000 divided by 240 equals 400 dollars per lost workday. The 240 value is the number of days mistakenly reported as a cost, and 4,000 comes from dividing by 24 instead of 240. Cost per lost workday is a useful severity measure when arguing the business case for prevention.\n\n用总成本除以损失工作日：96,000 ÷ 240 = 400 美元/损失工作日。240 是被误当成本的天数，4,000 则来自除以 24 而非 240。在为预防措施做商业论证时，每损失工作日的成本是有用的严重度指标。","related":[{"n":"7.9","t":"事故成本"}],"level":"calculation","topic":"Cost per Lost Workday"},{"text":"A site opened 25 investigations during the year. Twenty were closed within the 30-day target, and the other five were closed within 60 days. What percentage met the 30-day target?","group":3,"options":["60 percent","80 percent","92 percent","100 percent"],"correct":1,"explanation":"Twenty of 25 equals 0.80, or 80 percent meeting the 30-day target. The 92 percent figure would count the late closures as on time, since 23 of 25 closed within 60 days. Investigation cycle time is a leading indicator of how quickly lessons turn into corrective actions.\n\n20 ÷ 25 = 0.80，即 80% 达到 30 天目标。92% 是把延期关闭的案例也视为按期（23/25 在 60 天内关闭）。调查周期时间是衡量经验转化为纠正措施速度的领先指标。","related":[{"n":"7.2","t":"七步调查流程"}],"level":"calculation","topic":"Investigation Cycle Time"},{"text":"Two witnesses give conflicting accounts of who started the conveyor. What should the investigator do?","group":3,"options":["Document each account, check PLC logs, and avoid confronting them together","Confront both witnesses together so one admits the discrepancy","Discard both statements and rely on the supervisor's opinion","Choose the account given by the more senior of the two employees"],"correct":0,"explanation":"Conflicting statements are data, not a problem to be resolved by confrontation, and objective evidence such as control-system logs can establish the sequence independently. Documenting each account preserves the differences for later analysis. Confrontation contaminates both accounts, and seniority is not evidence.\n\n相互矛盾的陈述是数据，不是靠对质来解决的问题；PLC 日志等客观证据可以独立确定事件顺序。分别记录各人陈述可以保留差异供后续分析。对质会污染双方证词，而资历并不是证据。","related":[{"n":"7.4","t":"证人访谈"}],"level":"application","topic":"Conflicting Testimony"},{"text":"A plant replaces 12 experienced operators with contract workers from a staffing agency for the summer peak, and a serious near miss occurs in week two. Which analysis approach is MOST relevant?","group":3,"options":["Barrier analysis of the machine guarding and interlocks","Fault tree analysis of the control system and sensors","Change analysis of conditions before and after the staffing change","Pareto analysis of injury types and their frequency"],"correct":2,"explanation":"The incident followed a significant organizational change, so comparing before and after conditions identifies what changed and whether that change contributed. Change analysis is the method designed for exactly this situation and should be paired with management of change so staffing changes are assessed before they occur. Fault tree and barrier analysis address hardware and control failures, which is not where the change originated.\n\n事故发生在一次重大组织变更之后，因此比较变更前后的条件可以识别出什么发生了变化、该变化是否促成事故。变更分析正是为此情形设计的方法，并应与变更管理结合，使人员调整在实施前得到评估。故障树与屏障分析针对硬件与控制失效，而本次变化的源头不在那里。","related":[{"n":"7.8","t":"变更管理"}],"level":"application","topic":"Change Analysis Application"},{"text":"Which team composition is BEST for investigating a serious incident in a packaging area?","group":3,"options":["A trained investigator, an uninvolved worker and a maintenance representative","The area supervisor, the operator involved and the shift lead","Only the safety manager, in order to preserve confidentiality","An outside attorney and the company's insurance adjuster only"],"correct":0,"explanation":"An effective team combines investigation skill, technical knowledge of the equipment and credibility with the workforce, and it excludes people directly involved in the event. Management review of the findings gives the team's conclusions the authority to drive corrective action. A team of only managers or only lawyers tends to produce blame or liability findings rather than prevention.\n\n有效的调查组应结合调查技能、设备技术知识和在员工中的公信力，并排除直接涉事人员。由管理层评审调查结论，才能赋予团队推动纠正措施的权威。全部由管理者或全部由律师组成的团队，往往产出追责或责任认定的结论，而非预防方案。","related":[{"n":"7.1","t":"事故调查目的"}],"level":"application","topic":"Investigation Team Composition"},{"text":"The same root cause appears in three investigations over 18 months, and each time the corrective action was recorded as complete. What is the MOST likely systemic failure?","group":3,"options":["The investigators chose the wrong RCA technique each time","Workers deliberately ignored the corrective actions each time","The incident reporting form lacks a usable root cause field","Actions were closed without verifying implementation and effectiveness"],"correct":3,"explanation":"Repeated findings with closed corrective actions point to a closure process that accepts paperwork instead of verified results. The fix is a closure standard that requires evidence of implementation plus a check that the condition has not recurred. Blaming workers or the form does not explain why the same cause survived three separate corrective cycles.\n\n同一发现反复出现而纠正措施均已关闭，说明关闭流程只认纸面而不认结果。解决办法是建立关闭标准：既要有实施证据，也要核查该条件是否已不再复发。把问题归因于工人或表格，都无法解释同一原因为何能穿越三个纠正周期。","related":[{"n":"7.7","t":"纠正措施"}],"level":"application","topic":"Recurring Root Cause"},{"text":"Why should witnesses be interviewed separately rather than in a group?","group":3,"options":["Group interviews let one account contaminate the others","Group interviews require too much of the investigator's time","Separate interviews are required under 29 CFR 1910.1020","Group interviews prevent the investigator from taking notes"],"correct":0,"explanation":"When witnesses hear each other, later accounts get anchored to the first version and genuine differences disappear, which destroys the independent corroboration the investigation needs. Separate interviews preserve the value of comparing accounts. Neither the recordkeeping rule nor time pressure is the reason for the practice.\n\n证人相互听见后，后来的陈述会被第一版说法锚定，真实差异随之消失，调查赖以相互印证的独立证词就被破坏。分别访谈才能保留比对的价值。记录规则和时间压力都不是这样做的理由。","related":[{"n":"7.4","t":"证人访谈"}],"level":"application","topic":"Separate Interviews"},{"text":"An investigator photographs a damaged guard with a phone, but no scale, date or machine identifier appears in the images. What is the main problem?","group":3,"options":["Phone photographs are never acceptable as evidence in any case","The photographs must be taken by a certified evidence photographer","The images should be deleted once the written report is complete","The images lack context on scale, timing and location, weakening their value"],"correct":3,"explanation":"A photograph is evidence only when it can be tied to a place, a time and a size, so a scale reference, date and equipment identifier belong in the image or in a linked log. Without them the picture shows damage but cannot support specific measurements or rebut alternative explanations. Phone cameras are perfectly acceptable when the context is documented.\n\n照片只有在能与地点、时间和尺寸对应时才是证据，因此比例参照物、日期和设备标识应出现在画面中或附于关联日志。缺少这些信息，照片只能显示损坏，无法支持具体测量，也无法排除其他解释。只要记录了背景信息，手机拍摄完全可以接受。","related":[{"n":"7.3","t":"证据链"}],"level":"application","topic":"Photographic Evidence"},{"text":"After an incident the damaged guard was replaced, the procedure was revised and an interlock was added. Which term describes replacing the guard alone?","group":3,"options":["A preventive action","A correction","A corrective action","A management of change"],"correct":1,"explanation":"A correction fixes the immediate nonconformity, here the broken guard, while a corrective action addresses the cause so the problem does not recur, such as revising the procedure and adding the interlock. A preventive action addresses a potential problem that has not yet occurred. Management of change is the process used to control the modification itself.\n\n纠正（correction）消除眼前的不符合，此处即更换破损的防护罩；纠正措施针对原因，防止问题再次发生，例如修订程序并增设联锁。预防措施针对尚未发生的问题。变更管理则是控制改造本身的过程。","related":[{"n":"7.7","t":"纠正措施"}],"level":"recall","topic":"Correction versus Corrective Action"},{"text":"An experienced operator bypassed an interlock to keep the line running during a breakdown, and a near miss resulted. What response BEST supports learning and prevention?","group":3,"options":["Discipline the operator as an example to the other workers","Remove the interlock because it interferes with production","Add the bypass to the JHA as an approved work practice","Investigate why bypassing was attractive and fix the production pressure"],"correct":3,"explanation":"When a competent operator routinely works around a control, the work system is usually rewarding the workaround, for example by making the correct response slow or unavailable. Investigating that design problem yields a durable fix, while discipline suppresses reporting and drives the behavior underground. Removing or formalizing the bypass legitimizes an uncontrolled hazard.\n\n当一名熟练操作工反复绕过控制措施时，作业体系往往在奖励这种绕行，例如使正确做法变慢或无法获得。调查这一设计问题才能得到持久改进；纪律处分会压制报告、把行为逼入地下。拆除联锁或把绕行写入JHA，等于将失控的危害合法化。","related":[{"n":"7.7","t":"纠正措施"}],"level":"application","topic":"Just Culture Response"},{"text":"After a solvent release, the area was ventilated for two hours before the investigator collected air samples. What is the main problem with this evidence?","group":3,"options":["The samples cannot establish the atmospheric conditions that existed when workers were exposed","Air sampling is not a legitimate part of incident investigation","Samples must be collected by the injured worker personally","There is no problem, because ventilation does not change concentration"],"correct":0,"explanation":"Atmospheric evidence is perishable, and two hours of ventilation may reduce concentrations by orders of magnitude, so the samples describe the cleaned-up area rather than the exposure conditions. Sampling is a standard part of investigating chemical releases when it is done promptly and with appropriate methods. Reconstruction may still be possible through modeling or process data, but the direct sample is no longer probative.\n\n气体证据具有时效性，两小时通风可能使浓度下降几个数量级，因此样本反映的是清理后的区域，而不是工人暴露时的条件。及时并按正确方法采样，是调查化学品泄漏的标准做法。通过建模或工艺数据仍可能重建暴露情形，但直接样本已失去证明力。","related":[{"n":"7.3","t":"证据链"}],"level":"application","topic":"Air Sampling Evidence"},{"text":"A machine guarding project costs 60,000 dollars and is projected to prevent injuries that would otherwise cost 25,000 dollars per year for four years. What is the return on investment?","group":4,"options":["42 percent","66.7 percent","66.7 dollars per year","167 percent"],"correct":1,"explanation":"Total benefit is 25,000 times 4, or 100,000 dollars, and ROI equals benefit minus cost divided by cost: (100,000 - 60,000) / 60,000 equals 0.667, or 66.7 percent. The 167 percent figure comes from dividing total benefit by cost without subtracting the investment. ROI is a percentage of the original investment, not a dollar amount per year.\n\n总收益 = 25,000 × 4 = 100,000 美元；ROI =（收益 − 成本）÷ 成本 =（100,000 − 60,000）÷ 60,000 = 0.667，即 66.7%。167% 是用总收益除以成本而未减去投资。ROI 是相对原始投资的百分比，而不是每年的美元金额。","related":[{"n":"8.2","t":"ROI 与回收期"}],"level":"calculation","topic":"ROI Calculation"},{"text":"An ventilation upgrade costs 120,000 dollars and is expected to reduce respiratory claims and lost productivity by 45,000 dollars per year for five years. What is the five-year ROI?","group":4,"options":["37.5 percent","75.0 percent","87.5 percent","187.5 percent"],"correct":2,"explanation":"Total benefit is 45,000 times 5, or 225,000 dollars. ROI equals (225,000 - 120,000) / 120,000, which is 105,000 divided by 120,000, or 87.5 percent. The 187.5 percent value divides total benefits by cost without subtracting the investment, and 37.5 percent divides the net gain by total benefits instead of by cost.\n\n总收益 = 45,000 × 5 = 225,000 美元。ROI =（225,000 − 120,000）÷ 120,000 = 105,000 ÷ 120,000 = 87.5%。187.5% 是用总收益除以成本而未扣除投资；37.5% 则是用净收益除以总收益而非除以成本。","related":[{"n":"8.2","t":"ROI 与回收期"}],"level":"calculation","topic":"ROI over Five Years"},{"text":"A fall-protection anchor system costs 90,000 dollars and is expected to save 30,000 dollars per year in claim and downtime costs. What is the payback period?","group":4,"options":["2.5 years","3.0 years","3.3 years","9.0 years"],"correct":1,"explanation":"Payback equals initial investment divided by annual savings: 90,000 divided by 30,000 equals 3.0 years. The 3.3-year figure inverts the ratio, and 9.0 years multiplies rather than divides. Payback measures how quickly the investment is recovered and is useful when management is focused on short-term cash exposure rather than total return.\n\n回收期 = 初始投资 ÷ 年节约额 = 90,000 ÷ 30,000 = 3.0 年。3.3 年是比率的倒数，9.0 年则是乘法而非除法。回收期衡量投资回收的速度，当管理层关注短期现金风险而非总回报时特别有用。","related":[{"n":"8.2","t":"ROI 与回收期"}],"level":"calculation","topic":"Payback Period"},{"text":"A noise-control programme has projected benefits of 480,000 dollars and total costs of 160,000 dollars over its life. What is the benefit-cost ratio?","group":4,"options":["0.33","1.5","3.0","4.8"],"correct":2,"explanation":"The benefit-cost ratio equals benefits divided by costs: 480,000 divided by 160,000 equals 3.0, meaning three dollars of benefit for every dollar spent. The 0.33 value inverts the ratio, and 1.5 would use a cost base of 320,000. A ratio above 1.0 indicates the benefits exceed the costs over the analysis period.\n\n效益成本比 = 效益 ÷ 成本 = 480,000 ÷ 160,000 = 3.0，即每投入 1 美元产生 3 美元效益。0.33 是比率的倒数，1.5 则来自 320,000 美元的成本基数。比值大于 1.0 表示在分析期内效益超过成本。","related":[{"n":"8.2","t":"ROI 与回收期"}],"level":"calculation","topic":"Benefit-Cost Ratio"},{"text":"A safety department was budgeted 250,000 dollars for the year and actually spent 287,500 dollars. What is the variance as a percentage of budget?","group":4,"options":["12.5 percent under","13.0 percent over","15.0 percent over","37.5 percent over"],"correct":2,"explanation":"Variance equals actual minus budget, 287,500 minus 250,000 equals 37,500, divided by the budget of 250,000, giving 0.15 or 15 percent over budget. Dividing by actual spending instead would understate the variance at about 13 percent. The sign matters: an overrun of 15 percent must be explained in cost-per-unit or activity terms.\n\n差异 = 实际 − 预算 = 287,500 − 250,000 = 37,500，再除以预算 250,000 得 0.15，即超支 15%。若以实际支出作分母，会把差异低估为约 13%。方向很重要：15% 的超支必须用单位成本或活动量来解释。","related":[{"n":"8.1","t":"安全预算"}],"level":"calculation","topic":"Budget Variance"},{"text":"A site recorded 12 OSHA-recordable cases and estimated total incident costs of 840,000 dollars, including indirect costs. What is the average cost per recordable case?","group":4,"options":["7,000 dollars","70,000 dollars","84,000 dollars","140,000 dollars"],"correct":1,"explanation":"Average cost per case equals total cost divided by the number of cases: 840,000 divided by 12 equals 70,000 dollars. The 7,000 figure is a decimal error, and 84,000 comes from dividing by 10 rather than 12. Expressing safety performance as cost per case translates injury rates into the financial language management uses.\n\n每例平均成本 = 总成本 ÷ 案例数 = 840,000 ÷ 12 = 70,000 美元。7,000 是小数点错误，84,000 则来自除以 10 而非 12。用“每例成本”表达安全绩效，可以把伤害率翻译成管理层熟悉的财务语言。","related":[{"n":"7.9","t":"事故成本"}],"level":"calculation","topic":"Cost per Recordable Case"},{"text":"Why do capital safety projects use net present value rather than simply adding up future savings?","group":4,"options":["Because future savings are worth less, so cash flows are discounted","Because NPV eliminates all uncertainty about future injury costs","Because OSHA requires NPV for all safety investments","Because NPV ignores the initial investment cost entirely"],"correct":0,"explanation":"Money available today can be invested or earn a return, so a dollar received in year five is worth less than a dollar today; discounting converts future cash flows to a common present basis. NPV compares the discounted benefits with the initial cost and shows whether the project adds value. It does not remove uncertainty, and no OSHA rule requires it.\n\n今天的钱可以投资并取得回报，所以五年后的一美元价值低于今天的一美元；折现就是把未来现金流换算到同一现值基准。净现值把折现后的效益与初始成本比较，判断项目是否创造价值。它不能消除不确定性，也没有任何 OSHA 法规要求使用它。","related":[{"n":"8.2","t":"ROI 与回收期"}],"level":"recall","topic":"Net Present Value"},{"text":"A CSP owns 5,000 dollars of stock in a vendor whose fall-protection equipment she is asked to evaluate against two competitors. What is the MOST appropriate action?","group":4,"options":["Disclose the interest and have the evaluation independently reviewed","Proceed with the evaluation, because 5,000 dollars is a small amount","Sell the stock promptly after the evaluation is complete","Recommend the competitor to prove her own impartiality"],"correct":0,"explanation":"The BCSP Code of Ethics requires professionals to avoid conflicts of interest and to disclose them when they exist. Disclosure alone may not be sufficient when the professional is the decision-maker, so reassignment or independent review protects the integrity of the recommendation. The size of the holding is irrelevant, and selling after the fact does not cure the conflict during the evaluation.\n\nBCSP 道德准则要求避免利益冲突，并在存在冲突时予以披露。当专业人员本人就是决策者时，仅披露往往不足，因此应回避或交由独立方评审，以保护建议的公正性。持股金额大小并不改变冲突的性质；事后再卖出也无法消除评估期间的冲突。","related":[{"n":"8.8","t":"职业道德"}],"level":"application","topic":"Conflict of Interest"},{"text":"A CSP with general-industry experience is asked to design a permit-required confined-space rescue plan for a chemical plant, a task outside her training. What should she do?","group":4,"options":["Design the plan and note her limited experience in the report","Decline to work on confined spaces permanently","Accept the assignment, because confined-space requirements are the same in every industry","Accept the assignment while arranging qualified rescue expertise and reviewing the plan with them"],"correct":3,"explanation":"The code requires practice only within areas of competence, and competence can be obtained by bringing in qualified expertise rather than abandoning the work. A caveat in the report does not protect workers if the rescue plan is technically unsound. Blanket refusal is unnecessary when the gap can be closed through collaboration.\n\n准则要求在能力范围内执业，而能力差距可以通过引入合格专家来弥补，而不是放弃工作。报告中加一句免责说明，并不能在救援方案技术不可靠时保护工人。在能够通过协作补足能力的情况下，一概拒绝并无必要。","related":[{"n":"8.8","t":"职业道德"}],"level":"application","topic":"Competence Boundary"},{"text":"A production supervisor asks the safety professional for details of an employee's medical restriction after the employee returns from a back injury. What is the BEST response?","group":4,"options":["Provide the full medical file because the supervisor manages the employee","Refuse to discuss any aspect of the case with the supervisor","Provide only the work restrictions needed to assign safe duties, keeping the diagnosis confidential","Post the restriction on the department board so co-workers can help"],"correct":2,"explanation":"Medical information is confidential under 29 CFR 1910.1020 and must be shared only on a need-to-know basis, and a supervisor needs to know the work restrictions, not the diagnosis. Withholding the restrictions can lead to unsafe assignment, while sharing the diagnosis or posting it violates confidentiality. The standard approach is a restrictions-only communication.\n\n医疗信息依 29 CFR 1910.1020 属保密信息，只能按“需要知道”原则共享；主管需要知道的是工作限制，而不是诊断。不告知限制可能导致不安全的岗位安排，而透露诊断或张贴出来则违反保密要求。规范做法是只传递工作限制。","related":[{"n":"8.9","t":"举报人保护"}],"level":"application","topic":"Medical Confidentiality"},{"text":"An employer transfers a worker to a less desirable shift after the worker reports a serious hazard to OSHA. Under the OSH Act, this action is:","group":4,"options":["Lawful if the transfer is described as a business necessity","Lawful because the worker did not file a written complaint","Unlawful retaliation against protected activity under Section 11(c)","A matter for the workers' compensation system rather than OSHA"],"correct":2,"explanation":"Section 11(c) prohibits retaliation against employees for exercising rights such as filing a complaint, participating in an inspection or reporting an injury. A transfer, demotion or schedule change that punishes protected activity is retaliation regardless of the business justification offered. The worker must generally file a complaint with OSHA within 30 days of the retaliatory action.\n\n《职业安全健康法》第 11(c) 条禁止因员工行使投诉、参与检查或报告伤害等权利而实施报复。调岗、降职或改动班次只要是对受保护活动的惩罚，就构成报复，无论给出何种业务理由。员工通常须在报复行为发生后 30 天内向 OSHA 投诉。","related":[{"n":"8.9","t":"举报人保护"}],"level":"application","topic":"Protected Activity"},{"text":"Which establishments are partially exempt from routine OSHA injury and illness recordkeeping under 29 CFR 1904.2?","group":4,"options":["Establishments with 10 or fewer employees in designated low-hazard industries","All establishments with fewer than 50 employees, in any industry","Establishments that participate in OSHA's VPP recognition program","Establishments with no recordable injuries in the previous year"],"correct":0,"explanation":"The partial exemption applies to establishments that had 10 or fewer employees at all times in the previous calendar year and are classified in an industry listed in Appendix A to Subpart B, which covers largely low-hazard retail, service and office sectors. Size alone does not exempt a construction or manufacturing site, and VPP participation does not remove the duty to keep the 300 Log. Partially exempt employers must still report fatalities, amputations, hospitalizations and eye losses.\n\n部分豁免适用于上一日历年全年雇员人数始终不超过 10 人、且属于附录 A（主要为低危零售、服务与办公行业）所列行业的场所。仅凭规模不能豁免建筑或制造场所，参加 VPP 也不免除保存 300 日志的义务。部分豁免的雇主仍须报告死亡、截肢、住院和失明。","related":[{"n":"8.6","t":"记录保存期限"}],"level":"recall","topic":"Partial Exemption"},{"text":"An employee requests a copy of her air sampling results. Under 29 CFR 1910.1020, the employer must provide access within:","group":4,"options":["7 calendar days","15 working days","24 hours","30 calendar days"],"correct":1,"explanation":"The access rule requires the employer to provide employee exposure and medical records within 15 working days of the request. The 7-day figure belongs to recording a case on the 300 Log, and 30 days is the deadline for filing a retaliation complaint with OSHA. Access must be free of charge and can be provided in copy or by allowing the employee to review the record.\n\n查阅规则要求雇主在员工提出请求后 15 个工作日内提供暴露记录和医疗记录。7 天是记入 300 日志的时限，30 天是向 OSHA 提出报复投诉的期限。查阅必须免费，可以提供副本，也可以允许员工本人查看记录。","related":[{"n":"8.6","t":"记录保存期限"}],"level":"recall","topic":"Record Access Timing"},{"text":"A safety professional discovers that three recordable cases from the past year were never entered on the OSHA 300 Log. What is the correct action?","group":4,"options":["Enter the cases now and note the late entry, without backdating the original entry date","Leave the log unchanged to avoid creating evidence of a violation","Enter the cases with the original injury dates so the log appears timely","Delete other cases so the annual total stays unchanged"],"correct":0,"explanation":"The employer must record each case within seven calendar days of learning of it, and when a case is discovered late it is entered at that time; falsifying dates would be a separate and more serious violation. Concealment and offsetting deletions are misrepresentations of the record. The 300A summary should then reflect the corrected totals.\n\n雇主须在知悉可记录案例后 7 个日历日内登记；发现漏记时应即时补记，篡改日期则构成另一项更严重的违规。隐瞒或用删除其他案例来平衡总数，属于对记录的不实陈述。补记后 300A 汇总表也应反映更正后的数字。","related":[{"n":"8.6","t":"记录保存期限"}],"level":"application","topic":"Correcting the 300 Log"},{"text":"A plant manager stops a job when she sees a missing machine guard, thanks the worker who reported it, and waits until the guard is replaced before production resumes. This behavior BEST illustrates:","group":4,"options":["Safety management through documentation","Visible leadership and demonstrated commitment to safety","Delegation of safety responsibility to hourly workers","Enforcement of the disciplinary policy"],"correct":1,"explanation":"Leaders shape behavior most powerfully through what they personally do, and stopping work for a missing guard signals that production does not outrank safety. Thanking the reporter reinforces reporting rather than punishing the messenger. This is the leadership dimension that complements management activities such as audits and procedures.\n\n领导者主要通过自身行为塑造行为，为缺失的防护罩停下作业，明确传递了生产不得凌驾于安全之上的信号。感谢报告者则强化了报告意愿，而不是惩罚报信人。这正是与审核、程序等管理活动相辅相成的领导力维度。","related":[{"n":"8.4","t":"安全领导力"}],"level":"application","topic":"Visible Leadership"},{"text":"Which action by senior management provides the STRONGEST evidence of genuine safety commitment to the workforce?","group":4,"options":["Issuing an updated corporate safety policy statement","Holding a quarterly all-hands safety town hall","Funding hazard corrections ahead of discretionary projects","Adding safety to the values statement on the company website"],"correct":2,"explanation":"Workers judge commitment by where resources go, so funding hazard corrections before discretionary spending and following through on completion is the most credible signal. Policy statements, meetings and value statements are supportive but cost little and are easily contradicted by budget decisions. Alignment between stated priorities and spending is the essence of leadership credibility.\n\n员工通过资源去向判断管理层的承诺，因此把隐患整改排在可自由支配项目之前并跟踪完成情况，是最可信的信号。方针声明、会议和价值观宣言虽然有支持作用，但成本很低，且容易被预算决策否定。所言与所花的钱是否一致，是领导力可信度的本质。","related":[{"n":"8.4","t":"安全领导力"}],"level":"application","topic":"Commitment through Resources"},{"text":"A site is directed to cut the safety budget by 20 percent. What is the BEST approach for the safety professional?","group":4,"options":["Reduce training and audits evenly across all departments","Eliminate the positions held by workers closest to retirement","Cut all PPE purchases and ask workers to reuse existing equipment","Prioritize by risk and legal requirement, and document the residual risk"],"correct":3,"explanation":"A defensible reduction starts with legal requirements and the highest risks, defers lower-value spending, and documents the risk that remains so management owns the decision. Across-the-board cuts degrade the controls that matter most, and cutting PPE or eliminating experienced staff transfers risk to workers. The safety professional's job is to make the trade-offs explicit, not to absorb them silently.\n\n可辩护的削减应从法律要求和最高风险入手，推迟价值较低的支出，并把剩余风险形成文件，使管理层对取舍负责。一刀切削减会削弱最关键的控制措施，削减 PPE 或裁掉有经验的员工则把风险转嫁给工人。安全专业人员的职责是让取舍显性化，而不是默默承受。","related":[{"n":"8.1","t":"安全预算"}],"level":"application","topic":"Budget Reduction Strategy"},{"text":"A CSP needs 200,000 dollars for an engineering control. Which presentation is MOST likely to secure funding from a chief financial officer?","group":4,"options":["A memo stating that the regulation requires the control","A summary of incident narratives from the affected area","Projected savings in claims, overtime and downtime, with payback and ROI","A petition signed by the workers in the affected area"],"correct":2,"explanation":"Finance leaders allocate capital by comparing expected returns and risk, so quantified savings with a payback period and ROI speak their language and allow comparison with competing projects. Compliance obligations should be stated as a floor, not the whole argument, and narratives or petitions build empathy without a financial case. Effective safety professionals present both the legal requirement and the business return.\n\n财务负责人按预期回报与风险配置资本，因此带回收期和 ROI 的量化节约最符合他们的决策语言，也便于与其他项目比较。合规义务应作为底线陈述，而不是全部论据；事故叙述或联名请愿能唤起共情，但缺少财务论证。有效的安全专业人员会同时呈现法律要求与商业回报。","related":[{"n":"8.2","t":"ROI 与回收期"}],"level":"application","topic":"Business Case Framing"},{"text":"In a RACI chart for developing a new confined-space rescue procedure, which role does the R designation describe?","group":4,"options":["The person who does the work of producing the deliverable","The person who signs off and owns the outcome","The person who must be consulted before a decision","The person who is informed after the decision is made"],"correct":0,"explanation":"R stands for Responsible, the role that performs the work, while A is Accountable for the outcome and is the single approver. C is Consulted before the decision and I is Informed afterward. Confusing R with A is a common error that produces charts where nobody is clearly accountable.\n\nR 代表 Responsible（负责执行），即实际完成交付物的人；A 代表 Accountable（问责），是对结果负责的唯一批准人。C 是决策前需咨询的人，I 是决策后需知会的人。把 R 与 A 混为一谈，常导致无人真正负责的图表。","related":[{"n":"8.5","t":"RACI 与项目时间线"}],"level":"recall","topic":"RACI Responsible Role"},{"text":"A safety project requires design (4 weeks), then procurement (5 weeks), then installation (3 weeks). Permitting (6 weeks) can start after design and runs in parallel with procurement and installation. What is the minimum project duration?","group":4,"options":["10 weeks","12 weeks","14 weeks","18 weeks"],"correct":1,"explanation":"The sequential path is 4 plus 5 plus 3, or 12 weeks, and it is the critical path. The permitting path is 4 plus 6, or 10 weeks, so permitting has 2 weeks of float and does not extend the project. Adding all durations, 18 weeks, would wrongly assume every task is sequential.\n\n串行路径为 4 + 5 + 3 = 12 周，即关键路径。许可路径为 4 + 6 = 10 周，因此有 2 周浮动时间，不会延长项目工期。把各项工期相加得 18 周，是错误假设所有任务都必须串行。","related":[{"n":"8.5","t":"RACI 与项目时间线"}],"level":"calculation","topic":"Project Duration"},{"text":"A 25-employee machine shop in a state with an approved consultation program wants public recognition and relief from programmed inspections but is not ready for VPP Star. Which program fits BEST?","group":4,"options":["VPP Merit, because it is the entry level of the VPP track","SHARP, a small-employer program built on state consultation services","OSHA's Voluntary Protection Program Demonstration track","The OSHA Strategic Partnership Program for contractors"],"correct":1,"explanation":"SHARP recognizes small employers that use free on-site consultation and meet program criteria, and it carries an exemption from programmed inspections for the recognition period. VPP tracks, including Merit, require a comprehensive VPP-quality system and are a heavier lift for a 25-person shop. The Demonstration track is for worksites using alternative approaches, not a small-business entry point.\n\nSHARP 面向使用免费现场咨询并达到项目标准的小型雇主，并在认可期内免除计划性检查。包括 Merit 在内的 VPP 各轨道都要求达到 VPP 水准的完整体系，对 25 人的车间而言门槛过高。示范轨道面向采用替代方法的场所，不是小企业的入门通道。","related":[{"n":"8.7","t":"VPP 自愿保护"}],"level":"application","topic":"SHARP versus VPP"},{"text":"A site has been accepted into VPP Star. A worker is killed in a forklift incident six months later. What happens?","group":4,"options":["OSHA takes no action because VPP sites are exempt from enforcement","The site is automatically removed from VPP but no inspection occurs","Only the insurance carrier investigates, because VPP sites self-investigate","OSHA still investigates the fatality, and the site must also report it within 8 hours"],"correct":3,"explanation":"VPP removes a site from programmed inspection lists but does not exempt it from enforcement; OSHA investigates fatalities, catastrophes and valid complaints at VPP sites. The fatality must also be reported to OSHA within 8 hours under 29 CFR 1904.39. VPP status may be reviewed afterward, but it never displaces the regulatory duty.\n\nVPP 只把场所从计划性检查名单中移除，并不豁免执法；OSHA 仍会调查 VPP 场所的死亡、灾难和有效投诉。该死亡还须依 29 CFR 1904.39 在 8 小时内报告。事后 VPP 资格可能被复核，但它从不取代法规义务。","related":[{"n":"8.7","t":"VPP 自愿保护"}],"level":"application","topic":"VPP and Enforcement"},{"text":"An employer disagrees with a citation issued after an inspection. Within what period must it notify OSHA that it intends to contest?","group":4,"options":["8 calendar days","10 calendar days","15 working days","30 working days"],"correct":2,"explanation":"Under 29 CFR 1903.17 the employer must file a written notice of contest within 15 working days of receiving the citation and proposed penalty. The case then goes to the Occupational Safety and Health Review Commission. Missing the deadline generally makes the citation a final order and waives the objection.\n\n依 29 CFR 1903.17，雇主须在收到罚单与拟处罚款后 15 个工作日内提交书面的异议通知。案件随后提交职业安全健康复审委员会。错过期限通常使罚单成为终局裁定，并视为放弃异议。","related":[{"n":"8.8","t":"职业道德"}],"level":"recall","topic":"Contesting a Citation"},{"text":"Which type of OSHA inspection is triggered when a worker files a signed complaint alleging a serious hazard?","group":4,"options":["A programmed inspection","A complaint inspection","A follow-up inspection","A fatality inspection"],"correct":1,"explanation":"A complaint inspection responds to an employee allegation, and a formal signed complaint alleging a serious hazard generally results in an on-site inspection. Programmed inspections are scheduled by industry hazard ranking, follow-up inspections verify abatement of prior citations, and fatality inspections respond to a death or catastrophe. Understanding the trigger helps a safety professional anticipate the scope of the visit.\n\n投诉检查因员工指控而启动；指控严重危害的正式签名投诉通常会引发现场检查。计划性检查依行业危害排序安排，跟踪检查核实既往罚单的整改，死亡检查则针对死亡或灾难事故。了解启动原因有助于安全专业人员预判检查范围。","related":[{"n":"8.6","t":"记录保存期限"}],"level":"recall","topic":"Complaint Inspection"},{"text":"A plant manager asks the safety professional to sign a training roster for 20 workers who have not yet attended the required fall-protection class, so a customer audit can proceed. What should the CSP do?","group":4,"options":["Sign the roster and schedule the class for the following month","Sign only for the workers who have had some prior training","Refuse to sign, and give the customer an accurate training status","Ask a supervisor to sign instead to avoid a personal ethics issue"],"correct":2,"explanation":"Signing a false training record is misrepresentation that endangers workers and violates the requirement to be honest and accurate in professional reports. The constructive path is to correct the status and give the customer truthful information, which also protects the employer from a much larger credibility failure. Routing the signature to someone else does not change the falsity of the record.\n\n在培训记录上签字属于不实陈述，会危及工人，并违反在专业报告中保持诚实准确的要求。建设性的做法是纠正状态并向客户提供真实信息，这也使雇主免于更大的信誉风险。把签字转给他人并不能改变记录虚假的事实。","related":[{"n":"8.8","t":"职业道德"}],"level":"application","topic":"Falsifying Training Records"},{"text":"Which principle comes first in the BCSP Code of Ethics?","group":4,"options":["Protecting the employer from liability","Holding paramount the safety, health and welfare of the public and workers","Maximizing the profitability of safety investments","Deferring to the judgment of the client's executives"],"correct":1,"explanation":"The code's first canon is to hold paramount the safety, health and welfare of the public and workers, along with protection of the environment and property. Loyalty to an employer or client is real but subordinate to that duty, which is why a professional cannot certify a knowingly unsafe condition. Profitability and deference are business considerations, not ethical first principles.\n\n准则的第一条是把公众与工人的安全、健康与福祉置于最高地位，同时保护环境与财产。对雇主或客户的忠诚确实存在，但必须服从这一首要义务，因此专业人员不能为明知不安全的状态背书。盈利与服从属于商业考量，不是伦理的首要原则。","related":[{"n":"8.8","t":"职业道德"}],"level":"recall","topic":"Paramount Duty"},{"text":"An employee requests exposure records that contain a trade-secret formulation. Under 29 CFR 1910.1020, the employer may:","group":4,"options":["Require a signed confidentiality agreement but still disclose the exposure data","Refuse access because trade secrets are exempt from disclosure","Provide the records only after the employee files a lawsuit","Delete the formulation from the record and provide nothing else"],"correct":0,"explanation":"The access rule allows an employer to withhold specific trade-secret chemical identity only under limited conditions, and it may require a confidentiality agreement before releasing that portion; the exposure and medical information itself must still be provided. Refusing access outright, or stripping the record so it becomes useless, defeats the purpose of the standard. Employees and their designated representatives retain the right to the exposure data.\n\n查阅规则允许雇主仅在有限条件下对特定商业秘密的化学身份保密，并可在提供该部分前要求签署保密协议；暴露与医疗信息本身仍须提供。一概拒绝提供，或删减到记录失去用途，都背离了该标准的目的。员工及其指定代表仍保有获取暴露数据的权利。","related":[{"n":"8.9","t":"举报人保护"}],"level":"application","topic":"Trade Secrets in Records"},{"text":"A safety professional has no direct authority over production supervisors but must improve fall-protection compliance. Which approach is MOST effective?","group":4,"options":["Build relationships and tie the change to supervisors' own goals","Issue stop-work orders personally whenever a violation is seen","Escalate every deficiency to the plant manager for discipline","Document violations and wait for the next corporate audit to surface them"],"correct":0,"explanation":"Influence without authority comes from credibility, reciprocity and framing the change in terms of the supervisor's own goals, such as fewer disruptions and lost-time claims. Escalation and personal stop-work orders may occasionally be necessary but damage the relationship if they become the default. Documenting and waiting cedes the opportunity to prevent the next injury.\n\n没有直线职权时，影响力来自可信度、互惠以及把变革与主管自身目标（如减少停工与工伤损失）联系起来。动辄上报或个人下达停工令在必要时可以使用，但若成为常态会损害关系。记录问题然后等下一年度审核，则放弃了预防下一次伤害的机会。","related":[{"n":"8.4","t":"安全领导力"}],"level":"application","topic":"Influence without Authority"},{"text":"OSHA cites an employer for a recognized serious hazard that is not covered by a specific standard. Which provision supports the citation?","group":4,"options":["Section 5(a)(1), the general duty clause","Section 11(c), the anti-retaliation provision","29 CFR 1904.7, the general recording criteria","29 CFR 1910.1020, access to employee records"],"correct":0,"explanation":"Section 5(a)(1) requires each employer to furnish a workplace free from recognized hazards that are causing or likely to cause death or serious physical harm, and it is used when no specific standard applies. To support a general duty citation, OSHA must show a recognized hazard, a feasible means of abatement and employee exposure. The other provisions address retaliation and recordkeeping, not hazard abatement.\n\n第 5(a)(1) 条要求雇主提供不存在已知危害、且该危害正在或可能导致死亡或严重身体伤害的工作场所，在没有具体标准适用时据此开罚。要支持一般责任条款的罚单，OSHA 须证明危害已被认知、整改可行且员工确有暴露。其他条款涉及报复与记录保存，而非危害消除。","related":[{"n":"8.8","t":"职业道德"}],"level":"recall","topic":"General Duty Clause"},{"text":"A site offers a 500-dollar bonus to any crew that completes a quarter with zero recordable injuries. What is the MOST likely unintended consequence?","group":4,"options":["Improved near-miss reporting because crews want to help each other","Higher recordable rates because injuries increase under pressure","No effect, because incentives cannot influence reporting behavior","Under-reporting of injuries and near misses, because reporting costs the crew money"],"correct":3,"explanation":"A reward contingent on zero recorded injuries rewards not reporting, so workers and supervisors have a financial reason to leave cases off the log and to discourage near-miss reports. The consequence is a cleaner-looking scorecard with hidden risk, plus potential recordkeeping violations. Incentives should reward preventive activity such as hazard reporting and correction rather than the absence of recorded injury.\n\n以“零可记录伤害”为条件的奖励，实际上是在奖励不报告，因此工人和主管都有经济动机把案例排除在日志之外，并劝阻未遂报告。结果是台账好看、风险被隐藏，还可能构成记录违规。激励应奖励隐患报告与整改等预防性活动，而不是奖励“没有记录到伤害”。","related":[{"n":"8.4","t":"安全领导力"}],"level":"application","topic":"Incentive Program Design"}]
